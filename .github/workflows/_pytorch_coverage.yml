name: PyTorch Coverage
on:
  workflow_call:
    inputs:
      resolved_short:
        description: 'Built pytorch commit short SHA (first 10 chars). Empty = resolve latest commit of upstream_ref'
        required: false
        default: ''
        type: string
      upstream_ref:
        description: 'pytorch/pytorch ref (used when resolved_short is empty)'
        required: false
        default: 'main'
        type: string
      categories:
        description: 'Comma-separated categories to run for debugging (e.g. core,tensor). Empty = all categories; empty is also the only case where OBS latest is overwritten'
        required: false
        default: ''
        type: string

env:
  OBS_ENDPOINT: obs.ap-southeast-1.myhuaweicloud.com
  OBS_COVERAGE_PREFIX: obs://pytorch-ci-cache/coverage/pytorch

jobs:
  # Resolve pytorch commit: full SHA (for building) + short SHA (for tarball names)
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short: ${{ steps.resolve.outputs.short }}
    steps:
      - name: Resolve pytorch SHA
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          SHORT="${{ inputs.resolved_short }}"
          if [ -n "${SHORT}" ]; then
            echo "Using provided resolved_short: ${SHORT}"
            # Expand the short SHA to full SHA (also validates it exists)
            FULL=$(curl -sf \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/pytorch/pytorch/commits/${SHORT}" | jq -r '.sha')
            if [ -z "${FULL}" ] || [ "${FULL}" = "null" ]; then
              echo "ERROR: cannot resolve provided short SHA ${SHORT} in pytorch/pytorch" >&2
              exit 1
            fi
          else
            # Resolve the latest commit of pytorch/pytorch (schedule or empty input)
            REF="${{ inputs.upstream_ref }}"
            REF="${REF:-main}"
            echo "Resolving latest commit of pytorch/pytorch@${REF} ..."
            FULL=$(curl -sf \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/pytorch/pytorch/commits/${REF}" | jq -r '.sha')
            if [ -z "${FULL}" ] || [ "${FULL}" = "null" ]; then
              echo "ERROR: cannot resolve pytorch/pytorch@${REF}" >&2
              exit 1
            fi
            SHORT="${FULL:0:10}"
          fi
          echo "Resolved -> ${FULL} (short: ${SHORT})"
          echo "sha=${FULL}" >> "$GITHUB_OUTPUT"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"

  build:
    needs: [resolve]
    uses: ./.github/workflows/_build.yml
    secrets: inherit
    with:
      upstream_repo: pytorch/pytorch
      upstream_ref: ${{ needs.resolve.outputs.sha }}
      torch_npu_repo: Ascend/pytorch
      torch_npu_ref: master
      docker_image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-test-aarch64-cann-a3-py3.10-torch-master-cann9.2.0-20260910200430-202609140905-0ba22e2b
      report_to_upstream: false
      runner_label: 'linux-aarch64-cpu-24'
      max_jobs: '23'

  # Collect the PR trigger case set (whitelist + hw_classification + skip list)
  # and shard it per category, exactly like the PR trigger pipeline.
  collect:
    needs: [resolve, build]
    uses: ./.github/workflows/_test-collect.yml
    secrets: inherit
    with:
      resolved_short: ${{ needs.resolve.outputs.short }}
      wheels_tarball: ${{ needs.build.outputs.wheels_tarball }}
      case_paths_config: .github/config/pr_test_whitelist.yml
      skip_list: .github/config/pr_skip_list.jsonl
      hw_classification: 'ACCELERATOR'
      device_env: 'privateuse1'
      runner_label: 'linux-aarch64-a3-800i-2-cn12-001'
      docker_image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-test-aarch64-cann-a3-py3.10-torch-master-cann9.2.0-20260910200430-202609140905-0ba22e2b

  # One job per (category, shard): the job carries its own cases JSON and runs
  # them under coverage, then uploads its coverage data for the merge job.
  coverage:
    needs: [resolve, build, collect]
    if: ${{ needs.collect.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.collect.outputs.test_matrix) }}
    uses: ./.github/workflows/_pytorch_coverage_shard.yml
    secrets: inherit
    with:
      category: ${{ matrix.category }}
      matrix_json: ${{ matrix.matrix_json }}
      num_shards: ${{ matrix.num_shards }}
      max_workers: ${{ matrix.max_workers }}
      runner_label: ${{ matrix.runner_label }}
      categories_filter: ${{ inputs.categories }}
      resolved_short: ${{ needs.resolve.outputs.short }}
      wheels_tarball: ${{ needs.build.outputs.wheels_tarball }}
      docker_image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-test-aarch64-cann-a3-py3.10-torch-master-cann9.2.0-20260910200430-202609140905-0ba22e2b

  merge:
    needs: [resolve, build, collect, coverage]
    if: ${{ always() && needs.coverage.result == 'success' }}
    runs-on: linux-aarch64-cpu-24
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    container:
      image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-test-aarch64-cann-a3-py3.10-torch-master-cann9.2.0-20260910200430-202609140905-0ba22e2b
      options: --network host
    env:
      PIP_INDEX_URL: https://mirrors.huaweicloud.com/repository/pypi/simple
    steps:
      - name: Download shard coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: cov-out

      - name: Install coverage
        run: pip install coverage pyyaml

      - name: Checkout coverage script
        uses: actions/checkout@v6
        with:
          repository: Ascend/pytorch
          path: ci-scripts
          ref: ci-test

      # Combine every shard's per-process coverage data files and aggregate the
      # shard failure lists into torch@latest/.
      - name: Merge shard coverage
        run: |
          SHARD_DIRS="$(cd cov-out && ls -d */ | sed 's:/$::' | sed 's:^:cov-out/:' | paste -sd, -)"
          echo "=== Merging shards: ${SHARD_DIRS} ==="

          OUT_ROOT="${GITHUB_WORKSPACE}/coverage-out" \
          PYTHON_BIN=python3 \
            bash "${GITHUB_WORKSPACE}/ci-scripts/.github/scripts/run_pytorch_coverage.sh" \
              --merge "${SHARD_DIRS}"

      # Keep the exact case set used by this run inside the downloadable artifact.
      - name: Download cases shards for the report bundle
        uses: actions/download-artifact@v4
        with:
          name: cases-shards
          path: coverage-out/torch@latest/logs/cases-shards

      # Source snapshot: the exact pytorch source the data came from, so the
      # merged artifact can render the report locally (coverage html needs the
      # sources; map the installed paths with a [paths] section).
      - name: Download source snapshot for the artifact
        if: always()
        continue-on-error: true
        run: |
          COV_DIR="${GITHUB_WORKSPACE}/coverage-out/torch@latest"
          if [ ! -f "${COV_DIR}/coverage.xml" ]; then
            echo "WARNING: no merged coverage.xml, skip source snapshot"
            exit 0
          fi

          obsutil config -i=${{ secrets.ACCESSKEY }} -k=${{ secrets.SECRETACCESSKEY }} -e=${{ env.OBS_ENDPOINT }}

          TARBALL="pytorch-source-${{ needs.resolve.outputs.short }}.tar.gz"
          mkdir -p "${COV_DIR}/source"
          for attempt in 1 2; do
            echo "=== Download attempt ${attempt} ==="
            if obsutil cp "obs://pytorch-ci-cache/7day-cache/${TARBALL}" "${COV_DIR}/source/${TARBALL}" -vlength; then
              echo "Source snapshot saved: ${COV_DIR}/source/${TARBALL}"
              exit 0
            fi
            sleep 10
          done
          echo "WARNING: ${TARBALL} not available in OBS cache, artifact stays without sources" >&2

      # Unpack the source snapshot into the conventional convstub layout
      # (convstub/pytorch/{torch,test}) so coverage html can be rendered locally.
      - name: Extract source snapshot
        if: always()
        continue-on-error: true
        run: |
          COV_DIR="${GITHUB_WORKSPACE}/coverage-out/torch@latest"
          TARBALL="pytorch-source-${{ needs.resolve.outputs.short }}.tar.gz"
          if [ ! -f "${COV_DIR}/source/${TARBALL}" ]; then
            echo "WARNING: no source snapshot tarball, skip extraction"
            exit 0
          fi

          mkdir -p "${COV_DIR}/convstub/pytorch"
          tar -xzf "${COV_DIR}/source/${TARBALL}" -C "${COV_DIR}/convstub/pytorch" \
            --strip-components=1 pytorch/torch pytorch/test
          echo "=== convstub unpacked ==="
          du -sh "${COV_DIR}/convstub/pytorch"/* || true

      - name: Write job summary
        if: always()
        run: |
          COV_DIR="${GITHUB_WORKSPACE}/coverage-out/torch@latest"
          [ -d "${COV_DIR}" ] || COV_DIR=""
          {
            echo "## PyTorch Coverage (${{ needs.resolve.outputs.short }})"
            echo ""
            echo "- Categories: \`${{ inputs.categories || 'all' }}\`"
            echo "- Artifacts: freshly built by this run (commit \`${{ needs.resolve.outputs.short }}\`)"
            if [ -n "${COV_DIR}" ] && [ -f "${COV_DIR}/coverage.xml" ]; then
              echo "- coverage.xml: \`${COV_DIR}/coverage.xml\`"
            fi
            if [ -n "${COV_DIR}" ] && [ -f "${COV_DIR}/logs/failed_cases.json" ]; then
              SUMMARY=$(python3 -c "import json; d=json.load(open('${COV_DIR}/logs/failed_cases.json')); print(f\"{d.get('total_failed', 0)} / {d.get('total_cases', 0)}\")")
              echo "- Failed cases: ${SUMMARY} (see failed_cases.json)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytorch-coverage-${{ needs.resolve.outputs.short }}
          path: coverage-out/torch@latest/
          retention-days: 14
          if-no-files-found: warn

      # Full covdata to OBS for long-term retention: single copy on the remote,
      # each completed run overwrites it. A crashed run never reaches this step,
      # and a partial (debug) run is never uploaded — the remote keeps the last
      # complete run's data.
      - name: Upload full covdata to OBS
        if: ${{ always() && inputs.categories == '' }}
        continue-on-error: true
        run: |
          obsutil config -i=${{ secrets.ACCESSKEY }} -k=${{ secrets.SECRETACCESSKEY }} -e=${{ env.OBS_ENDPOINT }}

          COV_DIR="${GITHUB_WORKSPACE}/coverage-out/torch@latest"
          if [ ! -f "${COV_DIR}/coverage.xml" ]; then
            echo "WARNING: no coverage.xml in ${COV_DIR}, skip OBS upload to keep the remote intact"
            exit 0
          fi

          obsutil cp "${COV_DIR}" "${{ env.OBS_COVERAGE_PREFIX }}/latest/" -r -f -vlength