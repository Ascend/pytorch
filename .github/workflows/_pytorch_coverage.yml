name: PyTorch Coverage
on:
  workflow_call:
    inputs:
      resolved_short:
        description: 'Built pytorch commit short SHA (first 10 chars). Empty = resolve latest commit of upstream_ref'
        required: false
        default: ''
        type: string
      upstream_ref:
        description: 'pytorch/pytorch ref (used when resolved_short is empty)'
        required: false
        default: 'main'
        type: string
      categories:
        description: 'Comma-separated categories to run (e.g. core,tensor). Empty = all 5 categories'
        required: false
        default: ''
        type: string

env:
  OBS_ENDPOINT: obs.ap-southeast-1.myhuaweicloud.com
  OBS_COVERAGE_PREFIX: obs://pytorch-ci-cache/coverage/pytorch
  DOCKER_IMAGE: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-test-aarch64-cann-a3-py3.10-torch-master-cann9.2.0-20260910200430-202609140905-0ba22e2b

jobs:
  # Resolve pytorch commit: full SHA (for building) + short SHA (for tarball names)
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short: ${{ steps.resolve.outputs.short }}
    steps:
      - name: Resolve pytorch SHA
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          SHORT="${{ inputs.resolved_short }}"
          if [ -n "${SHORT}" ]; then
            echo "Using provided resolved_short: ${SHORT}"
            # Expand the short SHA to full SHA (also validates it exists)
            FULL=$(curl -sf \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/pytorch/pytorch/commits/${SHORT}" | jq -r '.sha')
            if [ -z "${FULL}" ] || [ "${FULL}" = "null" ]; then
              echo "ERROR: cannot resolve provided short SHA ${SHORT} in pytorch/pytorch" >&2
              exit 1
            fi
          else
            # Resolve the latest commit of pytorch/pytorch (schedule or empty input)
            REF="${{ inputs.upstream_ref }}"
            REF="${REF:-main}"
            echo "Resolving latest commit of pytorch/pytorch@${REF} ..."
            FULL=$(curl -sf \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/pytorch/pytorch/commits/${REF}" | jq -r '.sha')
            if [ -z "${FULL}" ] || [ "${FULL}" = "null" ]; then
              echo "ERROR: cannot resolve pytorch/pytorch@${REF}" >&2
              exit 1
            fi
            SHORT="${FULL:0:10}"
          fi
          echo "Resolved -> ${FULL} (short: ${SHORT})"
          echo "sha=${FULL}" >> "$GITHUB_OUTPUT"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"

  pick:
    needs: [resolve]
    runs-on: ubuntu-latest
    container:
      image: ${{ env.DOCKER_IMAGE }}
      options: --network host
    outputs:
      cache_hit: ${{ steps.probe.outputs.cache_hit }}
      short: ${{ steps.probe.outputs.short }}
      source_tarball: ${{ steps.probe.outputs.source_tarball }}
      wheels_tarball: ${{ steps.probe.outputs.wheels_tarball }}
    steps:
      - name: Probe OBS cache for built artifacts
        id: probe
        run: |
          set -euo pipefail
          obsutil config -i=${{ secrets.ACCESSKEY }} -k=${{ secrets.SECRETACCESSKEY }} -e=${{ env.OBS_ENDPOINT }}

          ARCH=$(uname -m)
          PYVER=$(python3 -c "import sys; print(f'py{sys.version_info.major}{sys.version_info.minor}')")
          SHORT="${{ needs.resolve.outputs.short }}"
          SRC="obs://pytorch-ci-cache/7day-cache/pytorch-source-${SHORT}.tar.gz"
          WHL="obs://pytorch-ci-cache/7day-cache/wheels-${SHORT}-${PYVER}-${ARCH}.tar.gz"

          echo "Probing cache:"
          echo "  ${SRC}"
          echo "  ${WHL}"
          if obsutil ls "${SRC}" >/dev/null 2>&1 && obsutil ls "${WHL}" >/dev/null 2>&1; then
            echo "cache_hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "cache_hit=false" >> "$GITHUB_OUTPUT"
          fi
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"
          echo "source_tarball=pytorch-source-${SHORT}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "wheels_tarball=wheels-${SHORT}-${PYVER}-${ARCH}.tar.gz" >> "$GITHUB_OUTPUT"

  build:
    needs: [resolve, pick]
    if: ${{ needs.pick.outputs.cache_hit != 'true' }}
    uses: ./.github/workflows/_build.yml
    secrets: inherit
    with:
      upstream_repo: pytorch/pytorch
      upstream_ref: ${{ needs.resolve.outputs.sha }}
      torch_npu_repo: Ascend/pytorch
      torch_npu_ref: master
      docker_image: ${{ env.DOCKER_IMAGE }}
      report_to_upstream: false
      runner_label: 'linux-aarch64-cpu-24'
      max_jobs: '23'

  # Download artifacts -> install wheels -> run coverage script -> upload reports
  # NOTE: runs-on / container.image do not support the env context
  # (only github/needs/vars/inputs etc.), so runner and image are inlined.
  coverage:
    needs: [pick, build]
    if: ${{ always() && (needs.pick.outputs.cache_hit == 'true' || needs.build.result == 'success') }}
    runs-on: linux-aarch64-a3-800i-8-cn12-001
    timeout-minutes: 1440  # 229 test files run serially; allow up to 24h
    outputs:
      test_status: ${{ steps.run_coverage.outputs.test_status }}
    container:
      image: ${{ env.DOCKER_IMAGE }}
      options: --network host
    env:
      PIP_INDEX_URL: https://mirrors.huaweicloud.com/repository/pypi/simple

    steps:
      # Tarball names follow the _build.yml/_nightly_build.yml upload convention
      - name: Compute SHAs
        id: sha
        run: |
          echo "short=${{ needs.pick.outputs.short }}" >> "$GITHUB_OUTPUT"
          echo "source_tarball=${{ needs.pick.outputs.source_tarball }}" >> "$GITHUB_OUTPUT"
          echo "wheels_tarball=${{ needs.pick.outputs.wheels_tarball }}" >> "$GITHUB_OUTPUT"

      # obsutil is preinstalled in the test image; 2 retries + resumable download
      - name: Download PyTorch source from OBS
        run: |
          obsutil config -i=${{ secrets.ACCESSKEY }} -k=${{ secrets.SECRETACCESSKEY }} -e=${{ env.OBS_ENDPOINT }}

          TARBALL="${{ steps.sha.outputs.source_tarball }}"
          for attempt in 1 2; do
            echo "=== Download attempt ${attempt} ==="
            if obsutil cp "obs://pytorch-ci-cache/7day-cache/${TARBALL}" "./${TARBALL}" -vlength; then
              echo "Download succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Download attempt ${attempt} failed"
            sleep 10
          done
          echo "ERROR: ${TARBALL} not found in OBS cache (build may have failed to upload)." >&2
          exit 1

      - name: Extract PyTorch source
        run: |
          tar -xzf ${{ steps.sha.outputs.source_tarball }}
          rm ${{ steps.sha.outputs.source_tarball }}
          echo "PyTorch source extracted: $(du -sh pytorch/ | cut -f1)"

      - name: Download wheels from OBS
        run: |
          obsutil config -i=${{ secrets.ACCESSKEY }} -k=${{ secrets.SECRETACCESSKEY }} -e=${{ env.OBS_ENDPOINT }}

          TARBALL="${{ steps.sha.outputs.wheels_tarball }}"
          for attempt in 1 2; do
            echo "=== Download attempt ${attempt} ==="
            if obsutil cp "obs://pytorch-ci-cache/7day-cache/${TARBALL}" "./${TARBALL}" -vlength; then
              echo "Download succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Download attempt ${attempt} failed"
            sleep 10
          done
          echo "ERROR: ${TARBALL} not found in OBS cache (build may have failed to upload)." >&2
          exit 1

      # Device under test: the installed torch python sources
      - name: Extract and install wheels
        run: |
          mkdir -p /tmp/wheels
          tar -xzf ${{ steps.sha.outputs.wheels_tarball }} -C /tmp/wheels
          rm ${{ steps.sha.outputs.wheels_tarball }}
          pip install /tmp/wheels/torch-*.whl
          pip install --no-deps /tmp/wheels/torch_npu*.whl
          pip install --no-deps /tmp/wheels/torchvision-*.whl || echo "WARNING: torchvision wheel not found in tarball"
          pip install pyyaml coverage  # script deps: whitelist parsing + coverage

      - name: Checkout coverage script
        uses: actions/checkout@v6
        with:
          repository: Ascend/pytorch
          path: ci-scripts
          ref: ci-test

      - name: Run coverage script
        id: run_coverage
        run: |
          source /usr/local/Ascend/cann/set_env.sh 2>/dev/null || true
          source /usr/local/Ascend/nnal/atb/set_env.sh 2>/dev/null || true
          export LD_LIBRARY_PATH=/opt/conda/envs/py_3.10/lib:$LD_LIBRARY_PATH

          COV_ARGS=(--test-dir "${GITHUB_WORKSPACE}/pytorch/test" --timeout 1800)
          if [ -n "${{ inputs.categories }}" ]; then
            COV_ARGS+=(--category "${{ inputs.categories }}")
          fi

          echo "=== Coverage script args: ${COV_ARGS[*]} ==="

          COV_STATUS=0
          OUT_ROOT="${GITHUB_WORKSPACE}/coverage-out" \
          PYTHON_BIN=python3 \
            bash "${GITHUB_WORKSPACE}/ci-scripts/.github/scripts/run_pytorch_coverage.sh" "${COV_ARGS[@]}" \
            || COV_STATUS=$?

          echo "Coverage script finished with status: ${COV_STATUS}"
          echo "test_status=${COV_STATUS}" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        if: always()
        run: |
          # Only the promoted torch@latest dir counts: on a crashed run the
          # script leaves an incomplete torch@staging behind, which must NOT
          # be reported or uploaded.
          COV_DIR="${GITHUB_WORKSPACE}/coverage-out/torch@latest"
          [ -d "${COV_DIR}" ] || COV_DIR=""
          {
            echo "## PyTorch Coverage (${{ steps.sha.outputs.short }})"
            echo ""
            echo "- Test status (script exit code): \`${{ steps.run_coverage.outputs.test_status }}\`"
            if [ "${{ needs.pick.outputs.cache_hit }}" = "true" ]; then
              echo "- Artifacts: OBS cache hit (commit \`${{ steps.sha.outputs.short }}\`)"
            else
              echo "- Artifacts: cache miss, freshly built by this run (commit \`${{ steps.sha.outputs.short }}\`)"
            fi
            if [ -n "${COV_DIR}" ] && [ -f "${COV_DIR}/coverage.xml" ]; then
              echo "- coverage.xml: \`${COV_DIR}/coverage.xml\`"
            fi
            if [ -n "${COV_DIR}" ] && [ -f "${COV_DIR}/logs/failed_cases.json" ]; then
              FAILED=$(python3 -c "import json; print(json.load(open('${COV_DIR}/logs/failed_cases.json')) and len(json.load(open('${COV_DIR}/logs/failed_cases.json'))))" 2>/dev/null || echo "?")
              echo "- Failed test files: ${FAILED} (see failed_cases.json)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # GitHub Artifacts: report + logs (lightweight, downloadable from the run page)
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytorch-coverage-${{ steps.sha.outputs.short }}
          path: |
            coverage-out/torch@latest/coverage.xml
            coverage-out/torch@latest/.coverage
            coverage-out/torch@latest/logs/
          retention-days: 14
          if-no-files-found: warn

      # Full covdata to OBS for long-term retention: single copy on the remote,
      # each completed run overwrites it. A crashed run leaves only an
      # incomplete torch@staging locally, which is never uploaded — the remote
      # keeps the last successful run's data.
      - name: Upload full covdata to OBS
        if: always()
        continue-on-error: true
        run: |
          obsutil config -i=${{ secrets.ACCESSKEY }} -k=${{ secrets.SECRETACCESSKEY }} -e=${{ env.OBS_ENDPOINT }}

          COV_DIR="${GITHUB_WORKSPACE}/coverage-out/torch@latest"
          if [ ! -d "${COV_DIR}" ]; then
            echo "WARNING: no promoted coverage dir (torch@latest) found, skip OBS upload"
            exit 0
          fi

          obsutil cp "${COV_DIR}" "${{ env.OBS_COVERAGE_PREFIX }}/latest/" -r -f -vlength
