name: PyTorch Coverage
on:
  workflow_call:
    inputs:
      resolved_short:
        description: 'Built pytorch commit short SHA (first 10 chars). Empty = resolve latest commit of upstream_ref'
        required: false
        default: ''
        type: string
      upstream_ref:
        description: 'pytorch/pytorch ref (used when resolved_short is empty)'
        required: false
        default: 'main'
        type: string
      categories:
        description: 'Comma-separated categories to run for debugging (e.g. core,tensor). Empty = all categories; empty is also the only case where OBS latest is overwritten'
        required: false
        default: ''
        type: string

env:
  OBS_ENDPOINT: obs.ap-southeast-1.myhuaweicloud.com
  OBS_COVERAGE_PREFIX: obs://pytorch-ci-cache/coverage/pytorch
  OBS_SHARD_PREFIX: obs://pytorch-ci-cache/7day-cache/coverage-shards

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short: ${{ steps.resolve.outputs.short }}
    steps:
      - name: Resolve pytorch SHA
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          SHORT="${{ inputs.resolved_short }}"
          if [ -n "${SHORT}" ]; then
            echo "Using provided resolved_short: ${SHORT}"
            FULL=$(curl -sf \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/pytorch/pytorch/commits/${SHORT}" | jq -r '.sha')
            if [ -z "${FULL}" ] || [ "${FULL}" = "null" ]; then
              echo "ERROR: cannot resolve provided short SHA ${SHORT} in pytorch/pytorch" >&2
              exit 1
            fi
          else
            REF="${{ inputs.upstream_ref }}"
            REF="${REF:-main}"
            echo "Resolving latest commit of pytorch/pytorch@${REF} ..."
            FULL=$(curl -sf \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/pytorch/pytorch/commits/${REF}" | jq -r '.sha')
            if [ -z "${FULL}" ] || [ "${FULL}" = "null" ]; then
              echo "ERROR: cannot resolve pytorch/pytorch@${REF}" >&2
              exit 1
            fi
            SHORT="${FULL:0:10}"
          fi
          echo "Resolved -> ${FULL} (short: ${SHORT})"
          echo "sha=${FULL}" >> "$GITHUB_OUTPUT"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"

  build:
    needs: [resolve]
    uses: ./.github/workflows/_build.yml
    secrets: inherit
    with:
      upstream_repo: pytorch/pytorch
      upstream_ref: ${{ needs.resolve.outputs.sha }}
      torch_npu_repo: Ascend/pytorch
      torch_npu_ref: master
      docker_image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-test-aarch64-cann-a3-py3.10-torch-master-cann9.2.0-20260910200430-202609230923-00b993fc
      report_to_upstream: false
      runner_label: 'linux-aarch64-cpu-24'
      max_jobs: '23'

  collect:
    needs: [resolve, build]
    uses: ./.github/workflows/_pytorch_coverage_collect.yml
    secrets: inherit
    with:
      resolved_short: ${{ needs.resolve.outputs.short }}
      wheels_tarball: ${{ needs.build.outputs.wheels_tarball }}
      case_paths_config: .github/config/coverage_test_whitelist.yml
      skip_list: .github/config/pr_skip_list.jsonl
      hw_classification: 'ACCELERATOR'
      device_env: 'privateuse1'
      runner_label: 'linux-aarch64-a3-800i-2-cn12-001'
      docker_image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-test-aarch64-cann-a3-py3.10-torch-master-cann9.2.0-20260910200430-202609230923-00b993fc

  coverage:
    needs: [resolve, build, collect]
    if: ${{ needs.collect.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.collect.outputs.test_matrix) }}
    uses: ./.github/workflows/_pytorch_coverage_shard.yml
    secrets: inherit
    with:
      category: ${{ matrix.category }}
      matrix_json: ${{ matrix.matrix_json }}
      num_shards: ${{ matrix.num_shards }}
      max_workers: ${{ matrix.max_workers }}
      runner_label: ${{ matrix.runner_label }}
      categories_filter: ${{ inputs.categories }}
      resolved_short: ${{ needs.resolve.outputs.short }}
      wheels_tarball: ${{ needs.build.outputs.wheels_tarball }}
      docker_image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-test-aarch64-cann-a3-py3.10-torch-master-cann9.2.0-20260910200430-202609230923-00b993fc

  merge:
    needs: [resolve, build, collect, coverage]
    if: ${{ always() && needs.coverage.result == 'success' }}
    runs-on: linux-aarch64-cpu-24
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    container:
      image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-test-aarch64-cann-a3-py3.10-torch-master-cann9.2.0-20260910200430-202609230923-00b993fc
      options: --network host
    env:
      PIP_INDEX_URL: https://mirrors.huaweicloud.com/repository/pypi/simple
      COV_ARTIFACTS: ${{ github.workspace }}/coverage-out/artifacts
    steps:
      - name: Install coverage
        run: pip install coverage

      - name: Checkout coverage script
        uses: actions/checkout@v6
        with:
          repository: Ascend/pytorch
          path: ci-scripts
          ref: ci-test

      - name: Prepare sources for the merge
        if: always()
        continue-on-error: true
        run: |
          obsutil config -i=${{ secrets.ACCESSKEY }} -k=${{ secrets.SECRETACCESSKEY }} -e=${{ env.OBS_ENDPOINT }}

          TARBALL="pytorch-source-${{ needs.resolve.outputs.short }}.tar.gz"
          mkdir -p "${GITHUB_WORKSPACE}/source"
          for attempt in 1 2; do
            echo "=== Download attempt ${attempt} ==="
            if obsutil cp "obs://pytorch-ci-cache/7day-cache/${TARBALL}" "${GITHUB_WORKSPACE}/source/${TARBALL}" -vlength; then
              break
            fi
            sleep 10
          done
          if [ ! -f "${GITHUB_WORKSPACE}/source/${TARBALL}" ]; then
            echo "WARNING: ${TARBALL} not available in OBS cache, merging without a source map" >&2
            exit 0
          fi
          echo "Source snapshot saved: ${GITHUB_WORKSPACE}/source/${TARBALL}"

          rm -rf "${COV_ARTIFACTS}/covstub"
          mkdir -p "${COV_ARTIFACTS}/covstub"
          tar -xzf "${GITHUB_WORKSPACE}/source/${TARBALL}" -C "${COV_ARTIFACTS}/covstub" \
            --strip-components=1 pytorch/torch pytorch/test
          rm -f "${GITHUB_WORKSPACE}/source/${TARBALL}"
          echo "=== covstub unpacked ==="
          du -sh "${COV_ARTIFACTS}/covstub"/* || true

          printf '[report]\nignore_errors = True\n\n[paths]\ntorch =\n    %s\n    %s\n' \
            "${COV_ARTIFACTS}/covstub/torch" \
            '/opt/conda/envs/py_3.10/lib/python3.10/site-packages/torch' \
            > "${GITHUB_WORKSPACE}/merge.coveragerc"
          echo "COVERAGE_RCFILE=${GITHUB_WORKSPACE}/merge.coveragerc" >> "$GITHUB_ENV"
          cat "${GITHUB_WORKSPACE}/merge.coveragerc"

      - name: Download shard data from OBS
        env:
          MATRIX_JSON: ${{ needs.collect.outputs.test_matrix }}
          CATEGORIES: ${{ inputs.categories }}
        run: |
          obsutil config -i=${{ secrets.ACCESSKEY }} -k=${{ secrets.SECRETACCESSKEY }} -e=${{ env.OBS_ENDPOINT }}

          SHARDS="$(python3 - <<'PYEOF'
          import json
          import os

          keep = {c.strip() for c in os.environ.get("CATEGORIES", "").split(",") if c.strip()}
          shards = []
          for entry in json.loads(os.environ.get("MATRIX_JSON") or "[]"):
              if keep and entry["category"] not in keep:
                  continue
              for shard in json.loads(entry["matrix_json"]):
                  shards.append(f"{entry['category']}-{shard}")
          print(" ".join(shards))
          PYEOF
          )"
          if [ -z "${SHARDS}" ]; then
            echo "ERROR: no shards selected (matrix='${MATRIX_JSON}' categories='${CATEGORIES}')" >&2
            exit 1
          fi
          echo "=== Shards from OBS: ${SHARDS} ==="

          for shard_name in ${SHARDS}; do
            shard_dir="cov-out/${shard_name}"
            source_url="${{ env.OBS_SHARD_PREFIX }}/${{ github.run_id }}/${shard_name}.tar.gz"
            tarball="${shard_dir}.tar.gz"
            mkdir -p "${shard_dir}"
            echo "=== ${shard_name} <- ${source_url} ==="
            for attempt in 1 2; do
              if obsutil cp "${source_url}" "${tarball}" -vlength; then
                break
              fi
              echo "Download attempt ${attempt} failed"
              sleep 10
            done
            if [ ! -f "${tarball}" ]; then
              echo "ERROR: no shard tarball for ${shard_name}" >&2
              exit 1
            fi
            tar -xzf "${tarball}" -C "${shard_dir}"
            rm -f "${tarball}"
            echo "  test group(s): $(find "${shard_dir}" -type f -path '*/covdata/coverage' | wc -l)"
          done

      - name: Trim the snapshot test tree to the tests that ran
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import sys
          from pathlib import Path

          test_dir = Path(os.environ["COV_ARTIFACTS"]) / "covstub" / "test"
          if not test_dir.is_dir():
              print("no snapshot test tree, nothing to trim")
              sys.exit(0)

          keep = set()
          for report in sorted(Path("cov-out").glob("*/reports/shard_*_cases.json")):
              data = json.loads(report.read_text(encoding="utf-8"))
              for case in data.get("cases", []):
                  file_path = case.get("file") or ""
                  if file_path:
                      keep.add(file_path[5:] if file_path.startswith("test/") else file_path)

          if not keep:
              print("WARNING: no executed test file found in the shard reports, keeping the tree as it is")
              sys.exit(0)

          removed = 0
          for path in sorted(p for p in test_dir.rglob("*") if p.is_file()):
              if path.relative_to(test_dir).as_posix() in keep:
                  continue
              path.unlink()
              removed += 1
          for path in sorted((p for p in test_dir.rglob("*") if p.is_dir()), reverse=True):
              try:
                  path.rmdir()
              except OSError:
                  pass

          print(f"snapshot test tree: kept {len(keep)} executed test file(s), removed {removed} file(s)")
          PYEOF
          du -sh "${COV_ARTIFACTS}/covstub/test" || true

      - name: Merge shard coverage
        env:
          PYTORCH_SHA: ${{ needs.resolve.outputs.sha }}
          PYTORCH_SHORT: ${{ needs.resolve.outputs.short }}
        run: |
          SHARD_DIRS="$(cd cov-out && ls -d */ | sed 's:/$::' | sed 's:^:cov-out/:' | paste -sd, -)"
          echo "=== Merging shards: ${SHARD_DIRS} ==="

          OUT_ROOT="${COV_ARTIFACTS}" \
          PYTHON_BIN=python3 \
            bash "${GITHUB_WORKSPACE}/ci-scripts/.github/scripts/run_pytorch_coverage.sh" \
              --merge "${SHARD_DIRS}"

          COV_DIR="${COV_ARTIFACTS}/pytorch@latest"
          if [ ! -f "${COV_DIR}/coverage.xml" ]; then
            echo "WARNING: merge did not promote, no manifest written"
            exit 0
          fi

          python3 - <<'PYEOF'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          cov_dir = Path(os.environ["COV_ARTIFACTS"]) / "pytorch@latest"
          failed = cov_dir / "logs" / "failed_cases.json"
          counts = json.loads(failed.read_text(encoding="utf-8")) if failed.is_file() else {}
          test_groups = len(list((cov_dir / "test").glob("**/covdata")))

          manifest = {
              "workflow": "pytorch_coverage_nightly",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "pytorch_sha": os.environ.get("PYTORCH_SHA", ""),
              "pytorch_short": os.environ.get("PYTORCH_SHORT", ""),
              "generated_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "test_groups": test_groups,
              "total_cases": counts.get("total_cases", 0),
              "total_failed": counts.get("total_failed", 0),
          }
          (cov_dir / "manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(manifest, indent=2))
          PYEOF

      - name: Backfill missing coverage data from the previous release
        run: |
          set -euo pipefail

          obsutil config -i=${{ secrets.ACCESSKEY }} -k=${{ secrets.SECRETACCESSKEY }} -e=${{ env.OBS_ENDPOINT }}

          python3 - <<'PYEOF'
          import json
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          cov_dir = Path(os.environ["COV_ARTIFACTS"]) / "pytorch@latest"
          if not (cov_dir / "coverage.xml").is_file():
              print("merge did not promote, nothing to backfill")
              sys.exit(0)

          expected = set()
          for report in sorted(Path("cov-out").glob("*/reports/shard_*_cases.json")):
              data = json.loads(report.read_text(encoding="utf-8"))
              for case in data.get("cases", []):
                  if case.get("file"):
                      expected.add(case["file"])

          covered = {
              p.parent.parent.relative_to(cov_dir).as_posix()
              for p in cov_dir.glob("test/**/covdata/coverage")
          }
          failed = {
              p.parent.parent.relative_to(cov_dir).as_posix()
              for p in cov_dir.glob("test/**/covdata/FAILED")
          }
          missing = sorted(expected - (covered - failed))
          if not missing:
              print("coverage data is complete for all executed test files")
              sys.exit(0)
          print(f"{len(missing)} test file(s) missing usable coverage data: {missing}")

          base = "obs://pytorch-ci-cache/coverage/pytorch"
          archive_file = "/tmp/previous-release.tar.gz"
          extract_root = Path("/tmp/previous-release")
          shutil.rmtree(extract_root, ignore_errors=True)
          extract_root.mkdir(parents=True)
          downloaded = subprocess.run(
              ["obsutil", "cp", f"{base}/latest/release.tar.gz", archive_file, "-f", "-vlength"],
              capture_output=True,
          )
          extracted_ok = False
          if downloaded.returncode == 0:
              extracted_ok = (
                  subprocess.run(
                      ["tar", "-xzf", archive_file, "-C", str(extract_root)],
                      capture_output=True,
                  ).returncode == 0
              )
          previous_local = extract_root / "pytorch@latest"
          if not extracted_ok or not (previous_local / "coverage.xml").is_file():
              print("WARNING: no usable previous release at latest/release.tar.gz, cannot backfill")
              sys.exit(0)
          print(f"previous coverage: {base}/latest/release.tar.gz")

          backfilled = []
          still_missing = []
          for test_file in missing:
              target = cov_dir / test_file / "covdata"
              tmp = cov_dir / test_file / "covdata.backfill"
              if tmp.exists():
                  shutil.rmtree(tmp)
              tmp.mkdir(parents=True)
              src_dir = previous_local / test_file / "covdata"
              if src_dir.is_dir():
                  for item in src_dir.iterdir():
                      if item.is_file():
                          shutil.copy2(item, tmp / item.name)
              if not (tmp / "coverage").is_file():
                  shutil.rmtree(tmp)
                  still_missing.append(test_file)
                  continue
              if target.exists():
                  shutil.rmtree(target)
              tmp.rename(target)
              backfilled.append(test_file)

          manifest_file = cov_dir / "manifest.json"
          manifest = json.loads(manifest_file.read_text(encoding="utf-8")) if manifest_file.is_file() else {}
          manifest["test_groups"] = len(list(cov_dir.glob("test/**/covdata")))
          manifest["backfilled"] = backfilled
          if still_missing:
              manifest["backfill_missing"] = still_missing
          manifest_file.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          print(f"backfilled {len(backfilled)} test file(s) from the previous release")
          if still_missing:
              print(
                  f"WARNING: still no usable coverage data for {len(still_missing)} test file(s): {still_missing}",
                  file=sys.stderr,
              )
          PYEOF

      - name: Check the promoted coverage data
        id: promote-check
        if: always()
        run: |
          set -euo pipefail

          if [ ! -f "${COV_ARTIFACTS}/pytorch@latest/coverage.xml" ]; then
            echo "merge did not promote, skipping the map build"
            exit 0
          fi

          GROUP="$(find "${COV_ARTIFACTS}/pytorch@latest/test" -type f -path '*/covdata/coverage' -print -quit)"
          if [ -z "${GROUP}" ]; then
            echo "WARNING: merge promoted no per-test coverage data, skipping the map build"
            exit 0
          fi

          echo "promoted=1" >> "$GITHUB_OUTPUT"

      - name: generate-test-case-map
        if: ${{ always() && steps.promote-check.outputs.promoted == '1' }}
        continue-on-error: true
        uses: lb-actions/precision-test@v1.0.2
        with:
          repo: pytorch
          build-map: true
          coverage-dir: ${{ env.COV_ARTIFACTS }}/pytorch@latest
          source-dir: ${{ env.COV_ARTIFACTS }}/covstub
          map-file: ${{ env.COV_ARTIFACTS }}/pytorch@latest/test_case_map.json
        env:
          PYTHON_EXEC_TIMEOUT_SECONDS: "900"

      - name: Publish coverage to OBS and clean up staging
        if: always()
        continue-on-error: true
        env:
          CATEGORIES: ${{ inputs.categories }}
        run: |
          if [ ! -f "${COV_ARTIFACTS}/pytorch@latest/coverage.xml" ] || [ ! -d "${COV_ARTIFACTS}/covstub" ]; then
            echo "WARNING: merge did not promote, keeping the remote and the staging data untouched"
            exit 0
          fi

          obsutil config -i=${{ secrets.ACCESSKEY }} -k=${{ secrets.SECRETACCESSKEY }} -e=${{ env.OBS_ENDPOINT }}

          if [ -z "${CATEGORIES}" ]; then
            tar -C "${COV_ARTIFACTS}" -czf /tmp/release.tar.gz covstub pytorch@latest
            ls -lh /tmp/release.tar.gz
            tar -tzf /tmp/release.tar.gz > /tmp/release-files.txt
            if grep -qx "pytorch@latest/manifest.json" /tmp/release-files.txt && grep -qx "pytorch@latest/coverage.xml" /tmp/release-files.txt; then
              obsutil cp /tmp/release.tar.gz "${{ env.OBS_COVERAGE_PREFIX }}/latest/release.tar.gz" -f -vlength

              RELEASE_OK=""
              for attempt in 1 2; do
                obsutil stat "${{ env.OBS_COVERAGE_PREFIX }}/latest/release.tar.gz" >>/tmp/obs-stat.log 2>&1 && { RELEASE_OK=1; break; }
                sleep 5
              done
              if [ -z "${RELEASE_OK}" ]; then
                tail -5 /tmp/obs-stat.log || true
                echo "::error::latest/release.tar.gz is missing on OBS after the upload"
                PUBLISH_FAILED=1
              else
                echo "published: ${{ env.OBS_COVERAGE_PREFIX }}/latest/release.tar.gz (run_id ${{ github.run_id }})"
              fi
            else
              echo "::error::the release archive is incomplete (missing manifest.json / coverage.xml); nothing was uploaded"
              PUBLISH_FAILED=1
            fi
          else
            echo "Debug run (categories='${CATEGORIES}'), skipping the ${{ env.OBS_COVERAGE_PREFIX }}/latest upload"
          fi

          obsutil rm -r -f "${{ env.OBS_SHARD_PREFIX }}/${{ github.run_id }}/"
          echo "Shard data staging removed"
          exit "${PUBLISH_FAILED:-0}"

      - name: Write job summary
        if: always()
        continue-on-error: true
        env:
          CATEGORIES: ${{ inputs.categories }}
          RESOLVED_SHORT: ${{ needs.resolve.outputs.short }}
          OBS_COVERAGE_PREFIX: ${{ env.OBS_COVERAGE_PREFIX }}
        run: |
          python3 - <<'PYEOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          artifacts = Path(os.environ["COV_ARTIFACTS"])
          cov_dir = artifacts / "pytorch@latest"
          prefix = os.environ.get("OBS_COVERAGE_PREFIX", "")
          short = os.environ.get("RESOLVED_SHORT", "")
          categories = os.environ.get("CATEGORIES") or "all"

          print(f"## PyTorch Coverage ({short})")
          print()
          print("| item | value |")
          print("| --- | --- |")

          def row(name, value):
              print(f"| {name} | {value} |")

          row("categories", f"`{categories}`")
          row("artifacts", f"freshly built by this run (commit `{short}`)")

          if not (cov_dir / "coverage.xml").is_file():
              print()
              print("merge did not promote, there is no coverage artifact to summarize")
              raise SystemExit(0)

          manifest = {}
          manifest_file = cov_dir / "manifest.json"
          if manifest_file.is_file():
              try:
                  manifest = json.loads(manifest_file.read_text(encoding="utf-8"))
              except Exception:
                  manifest = {}
          run_id = str(manifest.get("run_id", ""))
          if run_id:
              row("coverage run", f"`{run_id}` (event `{manifest.get('event')}`, attempt {manifest.get('run_attempt')})")
          if manifest.get("pytorch_sha"):
              row("built commit", f"`{manifest['pytorch_sha']}`")
          row("test files with coverage", str(manifest.get("test_groups", "n/a")))

          failed_file = cov_dir / "logs" / "failed_cases.json"
          failed = {}
          if failed_file.is_file():
              try:
                  failed = json.loads(failed_file.read_text(encoding="utf-8"))
              except Exception:
                  failed = {}
          if failed:
              row("cases", f"{failed.get('total_cases', 0)} executed, {failed.get('total_failed', 0)} failed")

          try:
              root = ET.parse(cov_dir / "coverage.xml").getroot()
              lines_valid = int(root.get("lines-valid", 0))
              lines_covered = int(root.get("lines-covered", 0))
              rate = float(root.get("line-rate", 0)) * 100
              row("coverage (torch)", f"lines {rate:.2f}% ({lines_covered}/{lines_valid})")
          except Exception as exc:
              row("coverage (torch)", f"n/a ({exc})")

          backfilled = manifest.get("backfilled") or []
          if backfilled:
              shown = ", ".join(f"`{f}`" for f in backfilled[:5])
              more = f" (+{len(backfilled) - 5} more)" if len(backfilled) > 5 else ""
              row("backfilled from previous release", f"{len(backfilled)} file(s): {shown}{more}")
          missing = manifest.get("backfill_missing") or []
          if missing:
              shown = ", ".join(f"`{f}`" for f in missing[:5])
              row("backfill still missing", f"{len(missing)} file(s): {shown}")

          map_file = cov_dir / "test_case_map.json"
          if map_file.is_file():
              try:
                  mapping = json.loads(map_file.read_text(encoding="utf-8"))
                  file_sum = sum(v.get("file_count", 0) for v in mapping.values() if isinstance(v, dict))
                  line_sum = sum(v.get("line_count", 0) for v in mapping.values() if isinstance(v, dict))
                  if file_sum or line_sum:
                      row("test_case_map", f"published: {file_sum} file(s), {line_sum} line(s)")
                  else:
                      row("test_case_map", "published but EMPTY (0 files / 0 lines) - coverage-mapped selection is degraded")
              except Exception as exc:
                  row("test_case_map", f"published but unreadable ({exc})")
          else:
              row("test_case_map", "not published - the coverage-mapped selection will be missing")

          row("OBS release", f"`{prefix}/latest/release.tar.gz`")
          PYEOF
