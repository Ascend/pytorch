name: Test Compare (v3) — No Poison Plugin

on:
  workflow_call:
    inputs:
      resolved_short:
        required: true
        type: string
        description: Short SHA of upstream PyTorch (from _build-v3.yml outputs)

defaults:
  run:
    shell: bash

jobs:
  compare:
    runs-on: linux-aarch64-a3-8
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        shell: bash
    container:
      image: quay.io/kerer/pytorch:torch-npu-test-aarch64-cann-a3-py3.10-torch-nightly
      options: --network host
    env:
      PIP_INDEX_URL: https://mirrors.huaweicloud.com/repository/pypi/simple

    steps:
      - name: Authenticate to Huawei Cloud
        uses: huaweicloud/auth-action@v1.1.0
        with:
          access_key_id: ${{ secrets.ACCESSKEY }}
          secret_access_key: ${{ secrets.SECRETACCESSKEY }}
          region: ap-southeast-1

      - name: Compute SHAs
        id: sha
        run: |
          UPSTREAM_SHORT="${{ inputs.resolved_short }}"
          echo "source_tarball=pytorch-source-${UPSTREAM_SHORT}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "wheels_tarball=wheels-${UPSTREAM_SHORT}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Download PyTorch source from OBS
        uses: huaweicloud/obs-helper@v1.0.1
        with:
          region: ap-southeast-1
          bucket_name: pytorch-ci-cache
          local_file_path: ./${{ steps.sha.outputs.source_tarball }}
          obs_file_path: 7day-cache/${{ steps.sha.outputs.source_tarball }}
          operation_type: download

      - name: Extract PyTorch source
        run: |
          tar -xzf ${{ steps.sha.outputs.source_tarball }}
          rm ${{ steps.sha.outputs.source_tarball }}
          echo "PyTorch source extracted: $(du -sh pytorch/ | cut -f1)"

      - name: Download wheels from OBS
        uses: huaweicloud/obs-helper@v1.0.1
        with:
          region: ap-southeast-1
          bucket_name: pytorch-ci-cache
          local_file_path: ./${{ steps.sha.outputs.wheels_tarball }}
          obs_file_path: 7day-cache/${{ steps.sha.outputs.wheels_tarball }}
          operation_type: download

      - name: Extract and install wheels
        run: |
          mkdir -p /tmp/wheels
          tar -xzf ${{ steps.sha.outputs.wheels_tarball }} -C /tmp/wheels
          rm ${{ steps.sha.outputs.wheels_tarball }}
          pip install /tmp/wheels/torch-*.whl
          pip install --no-deps /tmp/wheels/torch_npu*.whl

      - name: Checkout CI scripts
        uses: actions/checkout@v6
        with:
          path: ci-scripts
          ref: ci-test

      - name: Verify NPU environment
        run: |
          source /usr/local/Ascend/cann/set_env.sh 2>/dev/null || true
          source /usr/local/Ascend/nnal/atb/set_env.sh 2>/dev/null || true

          echo "=== NPU Device Information ==="
          npu-smi info
          echo "=== End of NPU Device Information ==="

          python -c "
          import torch
          print(f'torch: {torch.__version__}')
          import torch_npu
          print(f'torch_npu: {torch_npu.__version__}')
          print(f'NPU available: {torch.npu.is_available()}')
          print(f'NPU count: {torch.npu.device_count()}')
          "

      - name: Run compare tests (no poison plugin)
        id: compare_tests
        run: |
          source /usr/local/Ascend/cann/set_env.sh 2>/dev/null || true
          source /usr/local/Ascend/nnal/atb/set_env.sh 2>/dev/null || true

          if [ -d /root/ascend ]; then
            echo "Cleaning CANN logs in /root/ascend"
            rm -rf /root/ascend/* 2>/dev/null || true
          fi

          export PYTHONPATH="${GITHUB_WORKSPACE}/ci-scripts/.github/scripts/v3:${PYTHONPATH}"

          COMPARE_FILES=(
            "test/test_binary_ufuncs.py"
            "test/nn/test_convolution.py"
            "test/test_ops.py"
          )

          echo "=== Compare Test: Running without npu_poisoning_plugin ==="
          echo "Files: ${COMPARE_FILES[*]}"
          echo "Device groups: 8 cards × 1 device/proc = 8 workers"
          echo ""

          python3 -c "
          import sys; sys.path.insert(0, '${GITHUB_WORKSPACE}/ci-scripts/.github/scripts/v3')
          from run_npu_test_file import build_device_groups
          groups = build_device_groups(8, 1)
          for i, g in enumerate(groups):
              print(f'  group {i}: ASCEND_RT_VISIBLE_DEVICES={g}')
          "

          set +e
          python ci-scripts/.github/scripts/v3/run_npu_test_file.py \
            --files "${COMPARE_FILES[@]}" \
            --test-dir pytorch/test \
            --report-dir test-reports \
            --npu-count 8 \
            --devices-per-proc 1 \
            --timeout 3600 \
            --case-timeout 300 \
            --no-poison-plugin \
            --shard 1 \
            --num-shards 1 \
            --category compare \
            --runner linux-aarch64-a3-8 \
            2>&1 | tee /tmp/test_compare.log

          TEST_STATUS=${PIPESTATUS[0]}
          echo "compare_status=${TEST_STATUS}" >> "$GITHUB_OUTPUT"
          set -e

          # Always succeed — this is a comparison task, not a gate
          echo "Compare test finished with status: ${TEST_STATUS}"

      - name: Parse compare test results
        if: always()
        run: |
          python3 -c "
          import json, os, sys
          cases_file = 'test-reports/shard_compare-1_cases.jsonl'
          stats = {'passed': 0, 'failed': 0, 'errors': 0, 'skipped': 0, 'total': 0}
          try:
              with open(cases_file) as f:
                  d = json.loads(f.readline())
              stats['passed'] = d.get('passed', 0)
              stats['failed'] = d.get('failed', 0)
              stats['errors'] = d.get('errors', 0)
              stats['skipped'] = d.get('skipped', 0)
              stats['total'] = d.get('total_cases', 0)
          except Exception as e:
              print(f'Warning: Could not parse results: {e}', file=sys.stderr)
          total_failed = stats['failed'] + stats['errors']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              for k, v in stats.items():
                  f.write(f'{k}={v}\n')
          print(f'Compare: {stats[\"passed\"]} passed, {stats[\"failed\"]} failed, '
                f'{stats[\"errors\"]} errors, {stats[\"skipped\"]} skipped, '
                f'{stats[\"total\"]} total')
          "

      - name: Package compare test reports
        if: always()
        run: |
          if [ -d "test-reports/junit_xmls" ]; then
            echo "=== Compressing JUnit XMLs ==="
            XML_COUNT=$(find test-reports/junit_xmls -type f -name "*.xml" | wc -l)
            echo "Found ${XML_COUNT} XML files"
            tar -czf "test-reports/junit_xmls-compare-1.tar.gz" -C test-reports junit_xmls
            rm -rf test-reports/junit_xmls
            echo "JUnit XMLs compressed: $(ls -lh test-reports/junit_xmls-compare-1.tar.gz)"
          fi

      - name: Collect CANN logs
        if: always()
        run: |
          mkdir -p test-reports
          if [ -d /root/ascend ] && [ -n "$(ls -A /root/ascend 2>/dev/null)" ]; then
            echo "=== Collecting CANN logs from /root/ascend ==="
            du -sh /root/ascend || true
            tar -czf "test-reports/cann-logs-compare-1.tar.gz" -C /root ascend
            echo "CANN logs compressed: $(ls -lh test-reports/cann-logs-compare-1.tar.gz)"
          else
            echo "=== No CANN logs found in /root/ascend, skipping ==="
          fi

      - name: Upload compare test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-compare-v3
          path: test-reports/
          retention-days: 7

      - name: Upload compare test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-compare-v3-log
          path: /tmp/test_compare.log
          retention-days: 7
