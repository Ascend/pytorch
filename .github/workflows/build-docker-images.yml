name: Build build/test Docker Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Single image tag to build (without timestamp). Leave empty to build all.'
        required: false
        type: string
  push:
    paths:
      - .ci/docker/**
      - .github/workflows/build-docker-images.yml
  pull_request:
    paths:
      - .ci/docker/**
      - .github/workflows/build-docker-images.yml

env:
  REGISTRY: swr.cn-north-4.myhuaweicloud.com
  SWR_ORG: frameworkptadapter
  IMAGE_NAME: pytorch

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.set.outputs.tags }}
    steps:
      - id: set
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAGS='["${{ inputs.tag }}"]'
          else
            TAGS='["torch-npu-builder-x86_64-torch-master","torch-npu-builder-aarch64-torch-master","torch-npu-test-x86_64-cann-a1-py3.10-torch-master","torch-npu-test-x86_64-cann-a2-py3.10-torch-master","torch-npu-test-x86_64-cann-a3-py3.10-torch-master","torch-npu-test-aarch64-cann-a1-py3.10-torch-master","torch-npu-test-aarch64-cann-a2-py3.10-torch-master","torch-npu-test-aarch64-cann-a3-py3.10-torch-master"]'
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

  build:
    needs: matrix
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.matrix.outputs.tags) }}
    runs-on: ${{ contains(matrix.tag, 'x86_64') && 'ubuntu-latest' || 'ubuntu-22.04-arm' }}
    env:
      PUSH_IMAGE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell
          sudo rm -rf /opt/hostedtoolcache
          docker system prune -af
          sudo apt clean && sudo apt autoremove -y
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to SWR
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: Build and push image
        run: |
          TIMESTAMP=$(date -u +%Y%m%d%H%M)
          COMMIT_ID=$(git rev-parse --short=8 HEAD)
          cd .ci/docker
          chmod +x ./docker_build.sh
          TIMESTAMP=${TIMESTAMP} COMMIT_ID=${COMMIT_ID} ./docker_build.sh ${{ matrix.tag }}

          mkdir -p /tmp/result
          if [[ "${PUSH_IMAGE}" == "true" ]]; then
            IMAGE_TAG="${{ matrix.tag }}-${TIMESTAMP}-${COMMIT_ID}"
            REMOTE_IMAGE="${{ env.REGISTRY }}/${{ env.SWR_ORG }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"
            docker tag "${IMAGE_TAG}" "${REMOTE_IMAGE}"
            docker push "${REMOTE_IMAGE}"
            echo "${REMOTE_IMAGE}" > "/tmp/result/${{ matrix.tag }}.txt"
            echo "Pushed ${REMOTE_IMAGE}"
          else
            echo "Fork PR or no secrets — build only, skipping push"
            echo "build-only: ${{ matrix.tag }}" > "/tmp/result/${{ matrix.tag }}.txt"
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.tag }}
          path: /tmp/result/${{ matrix.tag }}.txt
          retention-days: 1

  summary:
    needs: [matrix, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download results
        uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: /tmp/results
          merge-multiple: true

      - name: Generate summary
        run: |
          echo "## Docker Image Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| # | Image | Pull Command |" >> $GITHUB_STEP_SUMMARY
          echo "|---|-------|-------------|" >> $GITHUB_STEP_SUMMARY

          if [ -d /tmp/results ] && [ "$(ls -A /tmp/results 2>/dev/null)" ]; then
            COUNT=1
            for f in /tmp/results/*.txt; do
              IMAGE=$(cat "$f")
              echo "| ${COUNT} | \`${IMAGE##*:}\` | \`docker pull ${IMAGE}\` |" >> $GITHUB_STEP_SUMMARY
              COUNT=$((COUNT + 1))
            done
          else
            echo "| - | No images built | - |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`${{ env.REGISTRY }}/${{ env.SWR_ORG }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
