name: Nightly Build and Test (label)

on:
  push:
    branches:
      - ci-test
    paths:
      - '.github/workflows/nightly.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_nightly_build.yml
    secrets: inherit
    with:
      upstream_repo: pytorch/pytorch
      upstream_ref: main
      torch_npu_repo: Ascend/pytorch
      torch_npu_ref: master
      # Build in the dedicated builder image; the wheel-repair step in
      # _nightly_build.yml vendors its private libs (OpenBLAS) into the
      # torch wheel so it stays self-contained in the test image.
      docker_image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-builder-aarch64-torch-master-202610160225-8a315d17
      report_to_upstream: false
      runner_label: 'linux-aarch64-cpu-24'
      max_jobs: '23'
      # Wheels cache moved to the dedicated Guiyang bucket
      # (pytorch-torchnpu, cn-southwest-2): probe, upload and cache-hit
      # download during build all use it. The PyTorch source tarball
      # stays on the legacy ap-southeast-1 bucket. The Guiyang bucket is
      # owned by a different key pair (ACCESSKEY_GUIYANG/
      # SECRETACCESSKEY_GUIYANG), selected by the wheel steps via the
      # cn-southwest-2 endpoint match.
      wheels_obs_endpoint: 'obs.cn-southwest-2.myhuaweicloud.com'
      wheels_obs_bucket: 'pytorch-torchnpu/7day-cache'

  test:
    needs: build
    uses: ./.github/workflows/_nightly_test.yml
    secrets: inherit
    with:
      resolved_short: ${{ needs.build.outputs.resolved_short }}
      resolved_sha: ${{ needs.build.outputs.resolved_sha }}
      pytorch_wheels_tarball: ${{ needs.build.outputs.pytorch_wheels_tarball }}
      torchnpu_wheels_tarball: ${{ needs.build.outputs.torchnpu_wheels_tarball }}
      upstream_repo: pytorch/pytorch
      torch_npu_short: ${{ needs.build.outputs.torch_npu_short }}
      case_paths_config: .github/config/nightly_test_categories.yml
      docker_image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-test-aarch64-cann-a3-py3.11-torch-master-cann9.2.0-20260910200430-202610160225-8a315d17
      report_to_upstream: false
      hw_classification: 'GENERIC ACCELERATOR'
      full_scan: true
      device_env: 'privateuse1,cpu'
      runner_label: 'linux-aarch64-a3-800i-2-cn12-001'
      # Same dedicated Guiyang wheels bucket as the build job above;
      # collect/shard jobs download the wheels the build uploaded there.
      wheels_obs_endpoint: 'obs.cn-southwest-2.myhuaweicloud.com'
      wheels_obs_bucket: 'pytorch-torchnpu/7day-cache'
      skip_list: |-
        .github/config/disabled_testcases.json
        .github/config/running_skiped_testcases.json
        .github/config/unsupport_dtype_testcases.json
        .github/config/unsupported_aclnn_testcases.json
      # Rewrites the installed triton-ascend backend's hardcoded
      # -std=c++17 to -std=c++20 and prebuilds npu_utils.so once per
      # shard container, working around the deterministic npu_utils
      # build failure against torch master's C++20-only ATen headers.
      # Validated on nightly-a3 run 39538533016: 199 graph npu_utils
      # failures -> 0, global failures -1035, no side effects.
      # See the Patch triton cxx20 step in _nightly_test-category.yml.
      patch_triton_cxx20: true

