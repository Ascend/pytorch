name: Nightly Build and Test

on:
  push:
    branches:
      - ci-test
    paths:
      - '.github/workflows/nightly.yml'
      - '.github/workflows/_build.yml'
      - '.github/workflows/_test.yml'
      - '.github/workflows/_test-collect.yml'
      - '.github/workflows/_test-category.yml'
      - '.github/workflows/_test-report.yml'
      - '.github/config/nightly_test_categories.yml'
      - '.github/scripts/collect_all_cases.py'
      - '.github/scripts/discover_test_files.py'
      - '.github/scripts/run_npu_test_shard.py'
      - '.github/scripts/parse_test_results.py'
      - '.github/scripts/generate_npu_full_test_report.py'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      docker_image: ${{ steps.config.outputs.docker_image }}
    steps:
      - id: config
        run: echo "docker_image=quay.io/kerer/pytorch:torch-npu-test-aarch64-cann-a3-py3.10-torch-nightly" >> "$GITHUB_OUTPUT"

  build:
    needs: config
    uses: ./.github/workflows/_build.yml
    secrets: inherit
    with:
      upstream_repo: pytorch/pytorch
      upstream_ref: main
      torch_npu_repo: Ascend/pytorch
      torch_npu_ref: master
      docker_image: ${{ needs.config.outputs.docker_image }}
      report_to_upstream: false

  test:
    needs: [config, build]
    uses: ./.github/workflows/_test.yml
    secrets: inherit
    with:
      resolved_short: ${{ needs.build.outputs.resolved_short }}
      torch_npu_short: ${{ needs.build.outputs.torch_npu_short }}
      case_paths_config: .github/config/nightly_test_categories.yml
      docker_image: ${{ needs.config.outputs.docker_image }}
      report_to_upstream: false
      hw_classification: 'GENERIC ACCELERATOR'
      full_scan: true
