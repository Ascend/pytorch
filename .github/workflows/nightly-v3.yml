name: Nightly Build and Test (v3)

on:
  push:
    branches:
      - ci-test
    paths:
      - '.github/workflows/nightly-v3.yml'
      - '.github/workflows/_build-v3.yml'
      - '.github/workflows/_test-v3.yml'
      - '.github/workflows/_test-collect-v3.yml'
      - '.github/workflows/_test-exec-v3.yml'
      - '.github/workflows/_test-report-v3.yml'
      - '.github/config/nightly_v3_test_whitelist.yml'
      - '.github/scripts/v3/**'
  workflow_dispatch:

concurrency:
  group: nightly-v3-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build-v3.yml
    secrets: inherit
    with:
      upstream_repo: pytorch/pytorch
      upstream_ref: main
      torch_npu_repo: Ascend/pytorch
      torch_npu_ref: master
      report_to_upstream: false

  test:
    needs: build
    uses: ./.github/workflows/_test-v3.yml
    secrets: inherit
    with:
      resolved_short: ${{ needs.build.outputs.resolved_short }}
