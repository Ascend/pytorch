name: Precise Test

on:
  workflow_call:
    inputs:
      event_type:
        required: false
        type: string
        default: ''
        description: Event type from repository_dispatch (pull_request)
      payload:
        required: false
        type: string
        default: ''
        description: Full client_payload as a JSON string

jobs:
  extract:
    runs-on: ubuntu-latest
    outputs:
      upstream_repo: ${{ steps.parse.outputs.upstream_repo }}
      pr_number: ${{ steps.parse.outputs.pr_number }}
      head_sha: ${{ steps.parse.outputs.head_sha }}
      base_ref: ${{ steps.parse.outputs.base_ref }}
      changed_files: ${{ steps.parse.outputs.changed_files }}
    steps:
      - name: Parse the PR payload
        id: parse
        env:
          EVENT_TYPE: ${{ inputs.event_type }}
          PAYLOAD_JSON: ${{ inputs.payload }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${EVENT_TYPE}" != "pull_request" ]; then
            echo "DEBUG: no pull_request payload (event_type='${EVENT_TYPE}'), the precise-test plan stays empty"
            echo "upstream_repo=" >> "$GITHUB_OUTPUT"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            echo "head_sha=" >> "$GITHUB_OUTPUT"
            echo "base_ref=" >> "$GITHUB_OUTPUT"
            echo "changed_files=0" >> "$GITHUB_OUTPUT"
            echo "::notice::precise-test debug run: no PR payload, nothing to plan"
            exit 0
          fi

          ACTION=$(echo "$PAYLOAD_JSON" | jq -r '.payload.action // empty')
          PR_NUMBER=$(echo "$PAYLOAD_JSON" | jq -r '.payload.pull_request.number // empty')
          UPSTREAM_REPO=$(echo "$PAYLOAD_JSON" | jq -r '.payload.repository.full_name // empty')
          HEAD_SHA=$(echo "$PAYLOAD_JSON" | jq -r '.payload.pull_request.head.sha // empty')
          BASE_REF=$(echo "$PAYLOAD_JSON" | jq -r '.payload.pull_request.base.ref // empty')

          if [ -n "${UPSTREAM_REPO}" ] && [ -n "${PR_NUMBER}" ]; then
            FILES_JSON=$(curl -sf \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${UPSTREAM_REPO}/pulls/${PR_NUMBER}/files?per_page=100" || echo '[]')
          else
            FILES_JSON='[]'
          fi
          CHANGED_FILES=$(echo "$FILES_JSON" | jq -r 'length' 2>/dev/null || echo 0)

          echo "upstream_repo=${UPSTREAM_REPO}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "base_ref=${BASE_REF}" >> "$GITHUB_OUTPUT"
          echo "changed_files=${CHANGED_FILES}" >> "$GITHUB_OUTPUT"

          echo "=== PR payload ==="
          echo "action:        ${ACTION}"
          echo "upstream_repo: ${UPSTREAM_REPO}"
          echo "pr_number:     ${PR_NUMBER}"
          echo "head_sha:      ${HEAD_SHA}"
          echo "base_ref:      ${BASE_REF}"
          echo "changed_files: ${CHANGED_FILES}"
          echo "--- first 30 changed files ---"
          echo "$FILES_JSON" | jq -r '.[:30][] | "  \(.status)\t\(.filename)"'

  recommend-tests:
    name: Recommend tests from coverage
    needs: extract
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      coverage_dir: ${{ steps.fetch.outputs.coverage_dir }}
      test_groups: ${{ steps.fetch.outputs.test_groups }}
      total_cases: ${{ steps.fetch.outputs.total_cases }}
      coverage_paths: ${{ steps.export-paths.outputs.coverage_paths }}
    steps:
      - name: Install obsutil
        run: |
          set -euo pipefail

          ARCH=$(uname -m)
          case "${ARCH}" in
            x86_64)  OBS_ARCH="amd64" ;;
            aarch64) OBS_ARCH="arm64" ;;
            *)       echo "Unsupported architecture: ${ARCH}"; exit 1 ;;
          esac
          OBS_URL="https://obs-community.obs.cn-north-1.myhuaweicloud.com/obsutil/current/obsutil_linux_${OBS_ARCH}.tar.gz"
          wget --tries=3 --timeout=30 --waitretry=10 --progress=dot:mega "${OBS_URL}"

          OBSUTIL_HOME="$HOME/.local/obsutil"
          mkdir -p "${OBSUTIL_HOME}"
          tar -zxf "obsutil_linux_${OBS_ARCH}.tar.gz" -C "${OBSUTIL_HOME}/"
          rm -f "obsutil_linux_${OBS_ARCH}.tar.gz"
          ln -sf "${OBSUTIL_HOME}"/obsutil_linux_${OBS_ARCH}_*/obsutil "${OBSUTIL_HOME}/obsutil"
          echo "${OBSUTIL_HOME}" >> "$GITHUB_PATH"
          "${OBSUTIL_HOME}/obsutil" version

      - name: Download the coverage map from OBS
        id: fetch
        run: |
          set -euo pipefail

          obsutil config -i=${{ secrets.ACCESSKEY }} -k=${{ secrets.SECRETACCESSKEY }} -e=obs.ap-southeast-1.myhuaweicloud.com

          rm -rf cov-dl && mkdir -p cov-dl
          for attempt in 1 2; do
            echo "=== Download attempt ${attempt} ==="
            if obsutil cp "obs://pytorch-ci-cache/coverage/pytorch/latest/pytorch@latest/" ./cov-dl/ -r -f -vlength; then
              break
            fi
            sleep 10
          done

          COV_XML="$(find cov-dl -maxdepth 3 -type f -name coverage.xml | head -1)"
          if [ -z "${COV_XML}" ]; then
            echo "ERROR: coverage.xml not found after the OBS download" >&2
            find cov-dl -maxdepth 2 >&2 || true
            exit 1
          fi
          COV_DIR="$(dirname "${COV_XML}")"
          TEST_GROUPS=$(find "${COV_DIR}/test" -type f -path '*/covdata/coverage' 2>/dev/null | wc -l)
          TOTAL_CASES=0
          if [ -f "${COV_DIR}/logs/failed_cases.json" ]; then
            TOTAL_CASES=$(python3 -c "import json; print(json.load(open('${COV_DIR}/logs/failed_cases.json')).get('total_cases', 0))")
          fi

          echo "coverage_dir=${COV_DIR}" >> "$GITHUB_OUTPUT"
          echo "test_groups=${TEST_GROUPS}" >> "$GITHUB_OUTPUT"
          echo "total_cases=${TOTAL_CASES}" >> "$GITHUB_OUTPUT"

          echo "=== Coverage map ==="
          du -sh cov-dl
          echo "coverage_dir: ${COV_DIR}"
          echo "test groups:  ${TEST_GROUPS} (test/<file>/covdata/coverage)"
          echo "cases:        ${TOTAL_CASES}"
          echo "--- coverage.xml header ---"
          head -1 "${COV_XML}"
          echo "--- test files with data ---"
          find "${COV_DIR}/test" -type f -path '*/covdata/coverage' | sed "s|${COV_DIR}/test/||; s|/covdata/coverage||" | sort | head -30

      - name: Recommend tests for the current PR
        env:
          UPSTREAM_REPO: ${{ needs.extract.outputs.upstream_repo }}
          PR_NUMBER: ${{ needs.extract.outputs.pr_number }}
        run: |
          set -euo pipefail

          COV_DIR="${{ steps.fetch.outputs.coverage_dir }}"

          echo "=== selector inputs ==="
          echo "pull request:  ${UPSTREAM_REPO}#${PR_NUMBER}"
          echo "coverage map:  ${COV_DIR}/test/<test file>/covdata/coverage"
          echo "changed files: resolved from the PR through the GitHub API"

          echo "::notice::precise-test selector is not implemented yet, no test is recommended from the coverage map"

      - name: Export coverage paths output
        id: export-paths
        if: always()
        run: |
          set -euo pipefail

          FILE="recommended_pytest_paths.txt"
          if [ -s "${FILE}" ]; then
            {
              echo "coverage_paths<<EOF"
              cat "${FILE}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "Exported $(wc -l < "${FILE}") recommended path(s)"
          else
            echo "coverage_paths=" >> "$GITHUB_OUTPUT"
            echo "::notice::${FILE} has no recommended path"
          fi

  precise:
    name: Precise test plan
    needs: [extract, recommend-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Plan the precise test set
        run: |
          set -euo pipefail

          echo "=== PR ==="
          echo "upstream_repo: ${{ needs.extract.outputs.upstream_repo }}"
          echo "pr_number:     ${{ needs.extract.outputs.pr_number }}"
          echo "head_sha:      ${{ needs.extract.outputs.head_sha }}"
          echo "base_ref:      ${{ needs.extract.outputs.base_ref }}"
          echo "changed_files: ${{ needs.extract.outputs.changed_files }}"

          echo "=== coverage map (from OBS) ==="
          echo "coverage_dir:  ${{ needs.recommend-tests.outputs.coverage_dir }}"
          echo "test groups:   ${{ needs.recommend-tests.outputs.test_groups }}"
          echo "cases:         ${{ needs.recommend-tests.outputs.total_cases }}"

          echo "=== recommended tests ==="
          echo "${{ needs.recommend-tests.outputs.coverage_paths }}"

          echo "::notice::precise-test skeleton: coverage map and the recommendation interface are in place; the changed-file to affected-test mapping, the build and the test run are not implemented yet"