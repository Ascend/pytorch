name: Precise Test

on:
  workflow_call:
    inputs:
      event_type:
        required: false
        type: string
        default: ''
        description: Event type from repository_dispatch (pull_request)
      payload:
        required: false
        type: string
        default: ''
        description: Full client_payload as a JSON string
      case_paths_config:
        required: false
        type: string
        default: '.github/config/privateuse1_npu_passed_testcases.json'
        description: >-
          Path (relative to the repo root, on the ci-test branch) to the
          coverage case whitelist (the same passed-testcases nodeid list the
          coverage pipeline and the PR gate run); the recommendation is
          restricted to the files it covers.
    outputs:
      precise_files:
        description: >-
          Newline-separated test file paths selected for the run and present
          in the coverage case whitelist; empty with a successful job means nothing
          to run, while a failing job makes the caller fall back to the full
          case list
        value: ${{ jobs.precision-test.outputs.precise_files }}

jobs:
  prepare:
    name: Resolve the PR to compare
    runs-on: ubuntu-latest
    outputs:
      github_pr: ${{ steps.parse.outputs.github_pr }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Parse the dispatch payload
        id: parse
        env:
          EVENT_TYPE: ${{ inputs.event_type }}
          PAYLOAD_JSON: ${{ inputs.payload }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${EVENT_TYPE}" = "pull_request" ]; then
            PR_NUMBER=$(echo "$PAYLOAD_JSON" | jq -r '.payload.pull_request.number // empty')
            UPSTREAM_REPO=$(echo "$PAYLOAD_JSON" | jq -r '.payload.repository.full_name // empty')

            if [ -z "${PR_NUMBER}" ] || [ -z "${UPSTREAM_REPO}" ]; then
              echo "ERROR: cannot read the PR number / upstream repo from the payload" >&2
              exit 1
            fi

            ACTION=$(echo "$PAYLOAD_JSON" | jq -r '.payload.action // empty')
            HAS_MERGED=$(echo "$PAYLOAD_JSON" | jq -r '.payload.pull_request.labels // [] | map(.name) | index("Merged") // ""')
            if [ "${ACTION}" = "closed" ] && [ -z "${HAS_MERGED}" ]; then
              LABELS_CODE=$(curl -sS -o /tmp/pr-labels.json -w '%{http_code}' --max-time 30 \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                "https://api.github.com/repos/${UPSTREAM_REPO}/issues/${PR_NUMBER}/labels" || echo 000)
              if [ "${LABELS_CODE}" != "200" ]; then
                echo "::error::cannot fetch the labels of ${UPSTREAM_REPO}#${PR_NUMBER} (http_code=${LABELS_CODE}); the merged state cannot be verified" >&2
                exit 1
              fi
              HAS_MERGED=$(jq -r '[.[].name] | index("Merged") // ""' /tmp/pr-labels.json 2>/dev/null || true)
            fi
            if [ "${ACTION}" != "closed" ] || [ -z "${HAS_MERGED}" ]; then
              echo "::notice::PR ${UPSTREAM_REPO}#${PR_NUMBER} is not a landed PR (action='${ACTION}', Merged label='${HAS_MERGED:-none}'), the precise selection is skipped"
              {
                echo "- PR: \`${UPSTREAM_REPO}#${PR_NUMBER}\`"
                echo "- Skipped: not a landed PR (action='${ACTION}', Merged label='${HAS_MERGED:-none}'), no precise selection needed"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "github_pr=${UPSTREAM_REPO}#${PR_NUMBER}" >> "$GITHUB_OUTPUT"

            echo "=== pull request ==="
            echo "github_pr: ${UPSTREAM_REPO}#${PR_NUMBER}"
            exit 0
          fi

          echo "::notice::event_type='${EVENT_TYPE}' is not pull_request, the precise selection is skipped"

  precision-test:
    needs: [prepare]
    if: ${{ needs.prepare.outputs.github_pr }}
    outputs:
      precise_files: ${{ steps.expose.outputs.files }}
    name: Precise test case selection
    runs-on: linux-aarch64-cpu-24
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    container:
      image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-test-aarch64-cann-a3-py3.11-torch-master-cann9.2.0-20260910200430-202610160225-8a315d17
      options: --network host
    env:
      github_pr: ${{ needs.prepare.outputs.github_pr }}
      PIP_INDEX_URL: https://mirrors.huaweicloud.com/repository/pypi/simple
    steps:
      - name: Download the coverage data from OBS
        if: ${{ env.github_pr != '' }}
        run: |
          set -euo pipefail

          obsutil config -i=${{ secrets.ACCESSKEY }} -k=${{ secrets.SECRETACCESSKEY }} -e=obs.ap-southeast-1.myhuaweicloud.com

          PREFIX="obs://pytorch-ci-cache/coverage/pytorch"

          ARCHIVE="${PREFIX}/latest/release.tar.gz"
          echo "release: ${ARCHIVE}"

          DOWNLOADED=""
          for attempt in 1 2 3; do
            echo "=== Download attempt ${attempt} ==="
            rm -rf coverage && mkdir -p coverage
            if obsutil cp "${ARCHIVE}" /tmp/release.tar.gz -f -vlength && tar -xzf /tmp/release.tar.gz -C coverage; then
              DOWNLOADED=1
              break
            fi
            echo "download failed (attempt ${attempt})"
            sleep 10
          done
          if [ -z "${DOWNLOADED}" ]; then
            echo "ERROR: cannot download the coverage release from ${ARCHIVE}" >&2
            exit 1
          fi

          echo "=== OBS layout ==="
          find coverage -maxdepth 3 -type d | sort | head -20

          python3 - <<'PYEOF'
          import json
          import sys
          from pathlib import Path

          root = Path("coverage")
          cov_dir = root / "pytorch@latest"
          if not (cov_dir / "coverage.xml").is_file():
              sys.exit("ERROR: coverage.xml not found under the OBS download")

          source_dir = root / "covstub"
          if not (source_dir / "torch" / "__init__.py").is_file():
              sys.exit("ERROR: no source snapshot (covstub/torch) found under the OBS download")

          cases = len(list((cov_dir / "test").glob("**/covdata")))

          manifest_file = cov_dir / "manifest.json"
          if not manifest_file.is_file():
              sys.exit(f"ERROR: no manifest.json in {cov_dir}, the coverage data was not published by the coverage pipeline")
          manifest = json.loads(manifest_file.read_text(encoding="utf-8"))

          print("manifest:")
          for key in ("workflow", "run_id", "event", "pytorch_short", "generated_at", "test_groups", "total_cases"):
              print(f"  {key}: {manifest.get(key)}")
          print(f"coverage dir:  {cov_dir}")
          print(f"source dir:    {source_dir} (package: torch/)")
          print(f"test cases:    {cases}")
          print(f"coverage.xml:  {(cov_dir / 'coverage.xml').stat().st_size} bytes")
          if not cases:
              sys.exit(f"ERROR: no per-test coverage data under {cov_dir}/test")
          if manifest.get("test_groups") != cases:
              sys.exit(f"ERROR: coverage data is incomplete: manifest reports {manifest.get('test_groups')} test group(s), found {cases} under {cov_dir}/test")
          map_file = cov_dir / "test_case_map.json"
          if map_file.is_file():
              print("test_case_map: published")
          else:
              print("::warning::no test_case_map.json in the coverage release; the selector builds the map on the spot")
          Path("/tmp/precise.env").write_text(f"TASK_DIR={cov_dir}\nSOURCE_DIR={source_dir}\nMAP_FILE={map_file if map_file.is_file() else ''}\n")
          PYEOF

          cat /tmp/precise.env >> "$GITHUB_ENV"
          cat /tmp/precise.env

      - name: generate-select-tests-case
        id: select
        if: ${{ env.github_pr != '' }}
        uses: lb-actions/precision-test@v1.0.4
        with:
          repo: pytorch
          github-pr: ${{ env.github_pr }}
          source-dir: ${{ env.SOURCE_DIR }}
          coverage-dir: ${{ env.TASK_DIR }}
          map-file: ${{ env.MAP_FILE }}
          dedup: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHON_EXEC_TIMEOUT_SECONDS: "900"

      - name: Checkout the coverage case whitelist
        if: ${{ env.github_pr != '' }}
        uses: actions/checkout@v6
        with:
          path: ci-scripts
          ref: ci-test

      - name: Filter the recommendation by the coverage case whitelist
        if: ${{ env.github_pr != '' }}
        run: |
          set -euo pipefail

          if [ ! -s recommended_pytest_paths.txt ]; then
            echo "no recommendation to filter"
            exit 0
          fi

          WHITELIST="ci-scripts/${{ inputs.case_paths_config }}"
          if [ ! -f "${WHITELIST}" ]; then
            echo "::warning::coverage case whitelist not found (${WHITELIST}); keeping the unfiltered recommendation"
            exit 0
          fi

          python3 - "${WHITELIST}" recommended_pytest_paths.txt <<'PYEOF'
          import sys
          import yaml

          cfg_path, rec_path = sys.argv[1:3]
          cfg = yaml.safe_load(open(cfg_path, encoding="utf-8"))
          if isinstance(cfg, dict) and isinstance(cfg.get("categories"), dict):
              whitelist = {
                  f
                  for cat in cfg["categories"].values()
                  for f in (cat.get("files") or [])
              }
          else:
              if isinstance(cfg, dict):
                  for key in ("case_whitelist", "cases", "nodeids", "whitelist"):
                      if isinstance(cfg.get(key), list):
                          cfg = cfg[key]
                          break
              whitelist = {
                  n.split("::")[0] for n in cfg if isinstance(n, str) and n
              } if isinstance(cfg, list) else set()
          if not whitelist:
              print("::warning::the coverage case whitelist lists no file; keeping the unfiltered recommendation")
              sys.exit(0)
          wanted = [line.strip() for line in open(rec_path, encoding="utf-8") if line.strip()]
          keep = [f for f in wanted if f in whitelist]
          dropped = [f for f in wanted if f not in whitelist]
          open(rec_path, "w", encoding="utf-8").write("".join(f"{f}\n" for f in keep))
          print(f"case whitelist filter: kept {len(keep)} of {len(wanted)} recommended file(s), dropped {len(dropped)}")
          for f in dropped:
              print(f"  dropped, not in the coverage case whitelist: {f}")
          PYEOF

      - name: Expose the recommendation
        id: expose
        if: always()
        env:
          SELECT_OUTCOME: ${{ steps.select.outcome }}
        run: |
          set -euo pipefail

          if [ -s recommended_pytest_paths.txt ]; then
            { echo "files<<EOF"; cat recommended_pytest_paths.txt; echo "EOF"; } >> "$GITHUB_OUTPUT"
            echo "recommended test files: $(wc -l < recommended_pytest_paths.txt)"
          elif [ "${SELECT_OUTCOME}" = "success" ]; then
            echo "files=" >> "$GITHUB_OUTPUT"
            echo "::warning::no test file to run after the precision selection (0 recommended, or none kept by the coverage case whitelist); the test stage is skipped"
          else
            echo "files=" >> "$GITHUB_OUTPUT"
            echo "::error::the precision selector did not succeed (${SELECT_OUTCOME}); the test stage falls back to the full case list"
          fi
