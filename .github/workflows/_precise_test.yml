name: Precise Test

on:
  workflow_call:
    inputs:
      event_type:
        required: false
        type: string
        default: ''
        description: Event type from repository_dispatch (pull_request)
      payload:
        required: false
        type: string
        default: ''
        description: Full client_payload as a JSON string

jobs:
  precision-test:
    name: Precise test case selection
    runs-on: ubuntu-latest
    steps:
      - name: Parse the dispatch payload
        id: pr
        env:
          EVENT_TYPE: ${{ inputs.event_type }}
          PAYLOAD_JSON: ${{ inputs.payload }}
        run: |
          set -euo pipefail

          if [ "${EVENT_TYPE}" != "pull_request" ]; then
            echo "DEBUG: no pull_request payload (event_type='${EVENT_TYPE}'), the PR stage stays empty"
            echo "github_pr=" >> "$GITHUB_ENV"
            echo "::notice::precise-test debug run: no PR payload, only the coverage map is built"
            exit 0
          fi

          PR_NUMBER=$(echo "$PAYLOAD_JSON" | jq -r '.payload.pull_request.number // empty')
          UPSTREAM_REPO=$(echo "$PAYLOAD_JSON" | jq -r '.payload.repository.full_name // empty')
          BASE_REF=$(echo "$PAYLOAD_JSON" | jq -r '.payload.pull_request.base.ref // empty')

          if [ -z "${PR_NUMBER}" ] || [ -z "${UPSTREAM_REPO}" ]; then
            echo "ERROR: cannot read the PR number / upstream repo from the payload" >&2
            exit 1
          fi

          echo "github_pr=${UPSTREAM_REPO}#${PR_NUMBER}" >> "$GITHUB_ENV"

          echo "=== pull request ==="
          echo "github_pr: ${UPSTREAM_REPO}#${PR_NUMBER}"
          echo "base_ref:  ${BASE_REF}"

      - name: Install obsutil
        run: |
          set -euo pipefail

          ARCH=$(uname -m)
          case "${ARCH}" in
            x86_64)  OBS_ARCH="amd64" ;;
            aarch64) OBS_ARCH="arm64" ;;
            *)       echo "Unsupported architecture: ${ARCH}"; exit 1 ;;
          esac
          OBS_URL="https://obs-community.obs.cn-north-1.myhuaweicloud.com/obsutil/current/obsutil_linux_${OBS_ARCH}.tar.gz"
          wget --tries=3 --timeout=30 --waitretry=10 --progress=dot:mega "${OBS_URL}"

          OBSUTIL_HOME="$HOME/.local/obsutil"
          mkdir -p "${OBSUTIL_HOME}"
          tar -zxf "obsutil_linux_${OBS_ARCH}.tar.gz" -C "${OBSUTIL_HOME}/"
          rm -f "obsutil_linux_${OBS_ARCH}.tar.gz"
          ln -sf "${OBSUTIL_HOME}"/obsutil_linux_${OBS_ARCH}_*/obsutil "${OBSUTIL_HOME}/obsutil"
          echo "${OBSUTIL_HOME}" >> "$GITHUB_PATH"
          "${OBSUTIL_HOME}/obsutil" version

      - name: Download previous coverage data from OBS
        run: |
          set -euo pipefail

          obsutil config -i=${{ secrets.ACCESSKEY }} -k=${{ secrets.SECRETACCESSKEY }} -e=obs.ap-southeast-1.myhuaweicloud.com

          mkdir -p coverage
          for attempt in 1 2; do
            echo "=== Download attempt ${attempt} ==="
            if obsutil cp "obs://pytorch-ci-cache/coverage/pytorch/latest/" coverage/pytorch/ -r -f -vlength; then
              break
            fi
            sleep 10
          done

          if [ ! -d "coverage/pytorch/pytorch@latest" ] || [ ! -d "coverage/pytorch/convstub" ]; then
            echo "::error::No previous coverage data found on OBS, cannot build map"
            find coverage -maxdepth 3
            exit 1
          fi

          echo "=== coverage directory tree ==="
          find coverage -maxdepth 3 -type d
          du -sh coverage/pytorch/pytorch@latest coverage/pytorch/convstub

      - name: generate-param
        run: |
          set -euo pipefail

          if [ -d "coverage" ]; then
            COVERAGE_PKG_DIR=$(find coverage -mindepth 1 -maxdepth 1 -type d | head -n1)
            echo "COVERAGE_PKG_DIR=${COVERAGE_PKG_DIR}"
          else
            echo "::error::coverage directory not found"
            exit 1
          fi

          if [ -d "${COVERAGE_PKG_DIR}" ]; then
            TASK_DIR=$(find "${COVERAGE_PKG_DIR}" -mindepth 1 -maxdepth 1 -type d ! -name "convstub" | head -n1)
            echo "TASK_DIR=${TASK_DIR}"
          else
            echo "::error::task_dir directory not found"
            exit 1
          fi

          SOURCE_DIR="${COVERAGE_PKG_DIR}/convstub/pytorch"
          if [ ! -d "${SOURCE_DIR}" ]; then
            echo "::error::source dir ${SOURCE_DIR} not found"
            exit 1
          fi

          echo "COVERAGE_PKG_DIR=${COVERAGE_PKG_DIR}" >> "$GITHUB_ENV"
          echo "TASK_DIR=${TASK_DIR}" >> "$GITHUB_ENV"
          echo "SOURCE_DIR=${SOURCE_DIR}" >> "$GITHUB_ENV"

      - name: Flatten the coverage data for the selector
        run: |
          set -euo pipefail

          python3 - <<'PYEOF'
          import shutil
          from pathlib import Path

          cov_dir = Path("${{ env.TASK_DIR }}")
          flat_dir = Path("covdata-set")

          if flat_dir.exists():
              shutil.rmtree(flat_dir)
          flat_dir.mkdir(parents=True)

          files = 0
          for covdata in sorted(cov_dir.glob("**/covdata")):
              test_file = covdata.parent.relative_to(cov_dir).as_posix()
              if not test_file.startswith("test/") or not test_file.endswith(".py"):
                  continue
              case_dir = flat_dir / test_file[:-3].replace("/", "__") / "covdata"
              case_dir.mkdir(parents=True, exist_ok=True)
              for src in covdata.glob("coverage*"):
                  shutil.copy2(src, case_dir / src.name)
                  files += 1

          cases = sum(1 for item in flat_dir.iterdir() if item.is_dir())
          print(f"selector input: {files} coverage file(s) in {cases} test case dir(s)")
          if not cases:
              raise SystemExit(f"ERROR: no per-test coverage data found under {cov_dir}")
          for item in sorted(flat_dir.iterdir())[:5]:
              print(f"  {item.name}/covdata/{sorted(p.name for p in item.glob('covdata/*'))}")
          PYEOF

      - name: generate-test-case-map
        uses: lb-actions/precision-test@v1.0.1
        with:
          repo: pytorch
          build-map: true
          coverage-dir: covdata-set
          source-dir: ${{ env.SOURCE_DIR }}
          map-file: test_case_map.json

      - name: generate-select-tests-case
        id: precision-test
        if: ${{ env.github_pr != '' }}
        continue-on-error: true
        uses: lb-actions/precision-test@v1.0.1
        with:
          repo: pytorch
          github-pr: ${{ env.github_pr }}
          source-dir: ${{ env.SOURCE_DIR }}
          map-file: test_case_map.json
          min-affected: 1
          dedup: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHON_EXEC_TIMEOUT_SECONDS: "900"

      - name: Show the selected tests
        if: ${{ steps.precision-test.conclusion == 'success' }}
        run: |
          set -euo pipefail

          echo "=== pull request ==="
          echo "github_pr: ${{ env.github_pr }}"

          if [ ! -s recommended_pytest_paths.txt ]; then
            echo "::notice::recommended_pytest_paths.txt is empty, no test selected for ${{ env.github_pr }}"
            exit 0
          fi

          echo "=== recommended tests ==="
          cat recommended_pytest_paths.txt
          echo "total: $(wc -l < recommended_pytest_paths.txt)"