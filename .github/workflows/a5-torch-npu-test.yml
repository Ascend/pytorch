# TorchNPU 每日自动化验证流水线
# 流程: build → collect → test(10 分片) → report
# 本次: 验证 x86_64 torch wheel 改用 download-r2 归档站后编译是否通过
name: A5 Torch NPU Daily Test

on:
  push:
    branches: [ci-test]
    paths:
      - '.github/workflows/a5-torch-npu-test.yml'
      - '.github/workflows/_a5_torch_npu_build.yml'
      - '.github/workflows/_a5_torch_npu_collect.yml'
      - '.github/workflows/_a5_torch_npu_test_job.yml'
      - '.github/workflows/_a5_torch_npu_report.yml'
      - '.github/scripts/a5-torch-npu-test/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_a5_torch_npu_build.yml
    secrets: inherit
    with:
      PYTHON_VERSION: "3.10"
      PYTORCH_BRANCH: "release/2.15"
      MAX_JOBS: "128"
      DOCKER_IMAGE: "swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-test-x86_64-cann-a5-py3.10-torch-master-cann9.2.0-20260910200430-202609141214-9b737f59"
      CONTAINER_OPTIONS: "--user root --security-opt label=disable -v /data/torchnpu-ccache:/ccache --volume /usr/local/Ascend:/usr/local/Ascend --volume /usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi --device /dev/davinci0 --device /dev/davinci1 --device /dev/davinci2 --device /dev/davinci3 --device /dev/davinci4 --device /dev/davinci5 --device /dev/davinci6 --device /dev/davinci7 --device /dev/davinci_manager --device /dev/hisi_hdc"
      RUNNER_LABEL: "linux-amd64-a5-2"

  collect:
    needs: build
    uses: ./.github/workflows/_a5_torch_npu_collect.yml
    secrets: inherit
    with:
      PYTORCH_BRANCH: "release/2.15"
      DOCKER_IMAGE: "swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-test-x86_64-cann-a5-py3.10-torch-master-cann9.2.0-20260910200430-202609141214-9b737f59"
      CONTAINER_OPTIONS: "--user root --volume /usr/local/Ascend:/usr/local/Ascend --volume /usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi --device /dev/davinci0 --device /dev/davinci1 --device /dev/davinci2 --device /dev/davinci3 --device /dev/davinci4 --device /dev/davinci5 --device /dev/davinci6 --device /dev/davinci7 --device /dev/davinci_manager --device /dev/hisi_hdc --device /dev/devmm_svm"
      DISTRIBUTED_MACHINES: "1"
      DISTRIBUTED_2CARD_SHARDS: "2"
      REGULAR_NPU_MACHINES: "7"
      COLLECT_PARALLEL: "16"
      RUNNER_LABEL: "linux-amd64-a5-2"

  test-dist-2card-1:
    needs: collect
    uses: ./.github/workflows/_a5_torch_npu_test_job.yml
    secrets: inherit
    with:
      SHARD_FILE: distributed_2card_cases_shard_1.json
      REPORT_NAME: test-reports-distributed_2card
      CASE_TIMEOUT: "1200"
      CARDS_PER_TEST: "2"
      PYTORCH_BRANCH: "release/2.15"
      DOCKER_IMAGE: "swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-test-x86_64-cann-a5-py3.10-torch-master-cann9.2.0-20260910200430-202609141214-9b737f59"
      CONTAINER_OPTIONS: "--user root --volume /usr/local/Ascend:/usr/local/Ascend --volume /usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi --device /dev/davinci0 --device /dev/davinci1 --device /dev/davinci2 --device /dev/davinci3 --device /dev/davinci4 --device /dev/davinci5 --device /dev/davinci6 --device /dev/davinci7 --device /dev/davinci_manager --device /dev/hisi_hdc --device /dev/devmm_svm"
      NPU_LABEL: "linux-amd64-a5-2"

  test-dist-2card-2:
    needs: collect
    uses: ./.github/workflows/_a5_torch_npu_test_job.yml
    secrets: inherit
    with:
      SHARD_FILE: distributed_2card_cases_shard_2.json
      REPORT_NAME: test-reports-distributed_2card-2
      CASE_TIMEOUT: "1200"
      CARDS_PER_TEST: "2"
      PYTORCH_BRANCH: "release/2.15"
      DOCKER_IMAGE: "swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-test-x86_64-cann-a5-py3.10-torch-master-cann9.2.0-20260910200430-202609141214-9b737f59"
      CONTAINER_OPTIONS: "--user root --volume /usr/local/Ascend:/usr/local/Ascend --volume /usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi --device /dev/davinci0 --device /dev/davinci1 --device /dev/davinci2 --device /dev/davinci3 --device /dev/davinci4 --device /dev/davinci5 --device /dev/davinci6 --device /dev/davinci7 --device /dev/davinci_manager --device /dev/hisi_hdc --device /dev/devmm_svm"
