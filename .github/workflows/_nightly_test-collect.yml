name: Test Collect

on:
  workflow_call:
    inputs:
      resolved_short:
        required: true
        type: string
        description: Short SHA of upstream PyTorch (from _build.yml outputs)
      resolved_sha:
        required: true
        type: string
        description: Full resolved SHA of upstream PyTorch. Drives the tested source (cloned from the in-cluster git-cdn) and the upstream interface reporting.
      upstream_repo:
        required: false
        type: string
        default: 'pytorch/pytorch'
        description: The upstream repository full name (owner/repo) the source is cloned from.
      pytorch_wheels_tarball:
        required: true
        type: string
        description: >-
          Content-addressed pytorch-side wheels tarball name (torch +
          torchvision) from the build job output
          (wheels-pytorch-<upstream_short>-py<ver>-<image_tag>-<arch>-
          <recipe>.tar.gz), used for the OBS download. A legacy combined
          tarball name also works: it additionally contains the
          torch_npu wheel.
      torchnpu_wheels_tarball:
        required: false
        type: string
        default: ''
        description: >-
          torch_npu wheels tarball name from the build job output
          (wheels-torchnpu-<torch_npu_short>-<upstream_short>-py<ver>-
          <image_tag>-<arch>-<recipe>.tar.gz). Empty means the torch_npu
          wheel comes from the pytorch tarball (legacy combined flows).
      case_paths_config:
        required: false
        type: string
        default: ''
        description: 'Path (relative to repo root) to whitelist YAML. Empty = scan all test_*.py files.'
      docker_image:
        required: false
        type: string
        default: 'quay.io/kerer/pytorch:torch-npu-test-aarch64-cann-a3-py3.10-torch-nightly'
        description: Docker image for running tests
      hw_classification:
        required: false
        type: string
        default: 'ACCELERATOR'
        description: >-
          Space-separated hardware classification filters passed to pytest
          --collect-only (e.g., "ACCELERATOR" or "GENERIC ACCELERATOR").
          Valid values: GENERIC ACCELERATOR CPU CUDA MPS XPU.
      full_scan:
        required: false
        type: boolean
        default: false
        description: >-
          When true, scan ALL test_*.py files and use case-paths-config as a
          categorization mapping (paths + files) instead of a whitelist.
          Unmatched files go to 'others'.
      skip_list:
        required: false
        type: string
        default: ''
        description: >-
          Path(s) (relative to repo root) to skip list files. Newline-separated
          for multiple files. When set, matching nodeids are removed after
          collection and before sharding. When empty, no skip filtering is
          applied. Supports JSONL, JSON {skip_nodeids:[...]}, JSON array,
          and JSON {nodeid: {reason:...}} formats.
      case_whitelist:
        required: false
        type: string
        default: ''
        description: >-
          Path (relative to repo root) to a case-level whitelist: a JSON/YAML
          list of nodeids (flat array root, or under a case_whitelist/cases/
          nodeids/whitelist key). When set, collected cases are intersected
          with this list after collection (before sharding). Empty = keep
          every collected case. Mirrors the case_whitelist input of
          _test-collect.yml (PR-gate chain).
      runner_label:
        required: false
        type: string
        default: 'linux-aarch64-a3-8'
        description: Runner label for runs-on and upstream job-name reporting.
      device_env:
        required: false
        type: string
        default: 'privateuse1'
        description: >-
          Comma-separated device types exported as
          PYTORCH_TESTING_DEVICE_ONLY_FOR during collection. Must match the
          execution phase value.
      artifact_suffix:
        required: false
        type: string
        default: ''
        description: Suffix appended to artifact names (e.g. '-a5') to avoid conflicts when multiple collects run in the same workflow run.
      wheels_obs_endpoint:
        required: false
        type: string
        default: 'obs.ap-southeast-1.myhuaweicloud.com'
        description: >-
          OBS endpoint for the wheels cache objects (wheel downloads).
          The PyTorch source tarball always stays on the legacy
          ap-southeast-1 endpoint regardless of this input.
      wheels_obs_bucket:
        required: false
        type: string
        default: 'pytorch-ci-cache/7day-cache'
        description: >-
          Bucket (with optional key prefix) holding the wheels cache
          objects; wheel downloads read obs://<bucket>/<tarball>. The
          cn-southwest-2 (Guiyang) bucket is owned by a different key
          pair: wheel steps pick ACCESSKEY_GUIYANG/SECRETACCESSKEY_GUIYANG
          when the endpoint is cn-southwest-2, ACCESSKEY/SECRETACCESSKEY
          otherwise.
    outputs:
      core_matrix:
        description: Core shard matrix JSON
        value: ${{ jobs.collect.outputs.core_matrix }}
      tensor_matrix:
        description: Tensor shard matrix JSON
        value: ${{ jobs.collect.outputs.tensor_matrix }}
      distributed_matrix:
        description: Distributed shard matrix JSON
        value: ${{ jobs.collect.outputs.distributed_matrix }}
      graph_matrix:
        description: Graph shard matrix JSON
        value: ${{ jobs.collect.outputs.graph_matrix }}
      others_matrix:
        description: Others shard matrix JSON
        value: ${{ jobs.collect.outputs.others_matrix }}
      core_num_shards:
        description: Number of core shards
        value: ${{ jobs.collect.outputs.core_num_shards }}
      tensor_num_shards:
        description: Number of tensor shards
        value: ${{ jobs.collect.outputs.tensor_num_shards }}
      distributed_num_shards:
        description: Number of distributed shards
        value: ${{ jobs.collect.outputs.distributed_num_shards }}
      graph_num_shards:
        description: Number of graph shards
        value: ${{ jobs.collect.outputs.graph_num_shards }}
      others_num_shards:
        description: Number of others shards
        value: ${{ jobs.collect.outputs.others_num_shards }}
      core_workers:
        description: Worker count for core category
        value: ${{ jobs.collect.outputs.core_workers }}
      tensor_workers:
        description: Worker count for tensor category
        value: ${{ jobs.collect.outputs.tensor_workers }}
      distributed_workers:
        description: Worker count for distributed category
        value: ${{ jobs.collect.outputs.distributed_workers }}
      graph_workers:
        description: Worker count for graph category
        value: ${{ jobs.collect.outputs.graph_workers }}
      others_workers:
        description: Worker count for others category
        value: ${{ jobs.collect.outputs.others_workers }}
      has_core:
        description: Whether core cases exist
        value: ${{ jobs.collect.outputs.has_core }}
      has_tensor:
        description: Whether tensor cases exist
        value: ${{ jobs.collect.outputs.has_tensor }}
      has_distributed:
        description: Whether distributed cases exist
        value: ${{ jobs.collect.outputs.has_distributed }}
      has_graph:
        description: Whether graph cases exist
        value: ${{ jobs.collect.outputs.has_graph }}
      has_others:
        description: Whether others cases exist
        value: ${{ jobs.collect.outputs.has_others }}
      total_cases:
        description: Total number of test cases
        value: ${{ jobs.collect.outputs.total_cases }}
      test_matrix:
        description: JSON array for test matrix, one entry per (category, shard); each entry's matrix_json pins exactly one shard so the caller's strategy.max-parallel caps global test-job concurrency
        value: ${{ jobs.collect.outputs.test_matrix }}

jobs:
  collect:
    runs-on: ${{ inputs.runner_label }}
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        shell: bash
    container:
      image: ${{ inputs.docker_image }}
      options: --network host
    env:
      PIP_INDEX_URL: https://mirrors.huaweicloud.com/repository/pypi/simple
    outputs:
      core_matrix: ${{ steps.build_matrix.outputs.core_matrix }}
      tensor_matrix: ${{ steps.build_matrix.outputs.tensor_matrix }}
      distributed_matrix: ${{ steps.build_matrix.outputs.distributed_matrix }}
      graph_matrix: ${{ steps.build_matrix.outputs.graph_matrix }}
      others_matrix: ${{ steps.build_matrix.outputs.others_matrix }}
      core_num_shards: ${{ steps.build_matrix.outputs.core_num_shards }}
      tensor_num_shards: ${{ steps.build_matrix.outputs.tensor_num_shards }}
      distributed_num_shards: ${{ steps.build_matrix.outputs.distributed_num_shards }}
      graph_num_shards: ${{ steps.build_matrix.outputs.graph_num_shards }}
      others_num_shards: ${{ steps.build_matrix.outputs.others_num_shards }}
      core_workers: ${{ steps.build_matrix.outputs.core_workers }}
      tensor_workers: ${{ steps.build_matrix.outputs.tensor_workers }}
      distributed_workers: ${{ steps.build_matrix.outputs.distributed_workers }}
      graph_workers: ${{ steps.build_matrix.outputs.graph_workers }}
      others_workers: ${{ steps.build_matrix.outputs.others_workers }}
      has_core: ${{ steps.collect_cases.outputs.has_core }}
      has_tensor: ${{ steps.collect_cases.outputs.has_tensor }}
      has_distributed: ${{ steps.collect_cases.outputs.has_distributed }}
      has_graph: ${{ steps.collect_cases.outputs.has_graph }}
      has_others: ${{ steps.collect_cases.outputs.has_others }}
      total_cases: ${{ steps.collect_cases.outputs.total_cases }}
      test_matrix: ${{ steps.build_matrix.outputs.test_matrix }}

    steps:
      - name: Compute tarball names
        id: sha
        env:
          PYTORCH_WHEELS_TARBALL: ${{ inputs.pytorch_wheels_tarball }}
          TORCHNPU_WHEELS_TARBALL: ${{ inputs.torchnpu_wheels_tarball }}
          RESOLVED_SHA: ${{ inputs.resolved_sha }}
        run: |
          UPSTREAM_SHORT="${{ inputs.resolved_short }}"
          echo "source_tarball=pytorch-source-${UPSTREAM_SHORT}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "pytorch_wheels_tarball=${PYTORCH_WHEELS_TARBALL}" >> "$GITHUB_OUTPUT"
          echo "torchnpu_wheels_tarball=${TORCHNPU_WHEELS_TARBALL}" >> "$GITHUB_OUTPUT"
          # Only a full SHA can be fetched directly; a 10-char short SHA
          # (custom-test / blacklist-test recover it from OBS object names)
          # cannot, so those callers keep the OBS tarball path.
          if [[ "${RESOLVED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_mode=gitcdn" >> "$GITHUB_OUTPUT"
          else
            echo "source_mode=obs" >> "$GITHUB_OUTPUT"
          fi

      # Primary path: clone the tested commit from the in-cluster git-cdn.
      # The NPU runner's gitconfig rewrites github.com to git-cdn (a
      # cluster-local service in NO_PROXY), so this is a cache hit rather
      # than a public-internet clone. Submodules are deliberately NOT
      # shallow-cloned: with `--depth 1` every pinned submodule commit is
      # unreachable, so `git submodule update` has to run two extra serial
      # `git fetch` round-trips per submodule; full-history clones reach
      # the pin directly and go straight to the checkout. The extra .git
      # bytes stay on the runner — the shard only needs the working tree.
      - name: Clone PyTorch source from git-cdn
        if: steps.sha.outputs.source_mode == 'gitcdn'
        env:
          UPSTREAM_REPO: ${{ inputs.upstream_repo }}
          UPSTREAM_SHA: ${{ inputs.resolved_sha }}
        run: |
          set -euo pipefail
          git init -q pytorch
          cd pytorch
          git remote add origin "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --depth 1 origin "${UPSTREAM_SHA}"
          git checkout -q -b build FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${UPSTREAM_SHA}" || {
            echo "ERROR: checked out $(git rev-parse HEAD), expected ${UPSTREAM_SHA}" >&2
            exit 1
          }
          git submodule update --init --recursive --jobs=$(nproc)
          echo "PyTorch source ready: $(git rev-parse --short HEAD), $(du -sh . | cut -f1)"

      # Fallback: wheels still come from OBS, and so does the source when
      # only a short SHA is known. The build job (or the PR CI fetch job,
      # which shares the same content-addressed key) published
      # pytorch-source-<upstream_short>.tar.gz there.
      - name: Download PyTorch source from OBS
        if: steps.sha.outputs.source_mode == 'obs'
        run: |
          obsutil config -i=${{ secrets.ACCESSKEY }} -k=${{ secrets.SECRETACCESSKEY }} -e=obs.ap-southeast-1.myhuaweicloud.com

          TARBALL="${{ steps.sha.outputs.source_tarball }}"
          for attempt in 1 2; do
            echo "=== Download attempt ${attempt} ==="
            if obsutil cp "obs://pytorch-ci-cache/7day-cache/${TARBALL}" "./${TARBALL}" -vlength; then
              echo "Download succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Download attempt ${attempt} failed"
            sleep 10
          done
          echo "Download failed after 2 attempts"
          exit 1

      - name: Extract PyTorch source
        if: steps.sha.outputs.source_mode == 'obs'
        run: |
          tar -xzf ${{ steps.sha.outputs.source_tarball }}
          rm ${{ steps.sha.outputs.source_tarball }}
          echo "PyTorch source extracted: $(du -sh pytorch/ | cut -f1)"

      # obsutil is preinstalled in the test image; auth is done inline
      # via `obsutil config` (AK/SK are masked by the runner in logs).
      # Objects above the 50MB threshold use segment download
      # automatically; a failed attempt leaves a checkpoint record in
      # ~/.obsutil_checkpoint/down, so the retry resumes the transfer
      # instead of restarting from byte 0. -vlength verifies the local
      # file size against the object. Do NOT delete the .obs.temp partial
      # file between attempts — it is the resume state.
      - name: Download pytorch wheels from OBS
        run: |
          # Wheels cache bucket/endpoint are caller-selectable; the
          # credentials follow the endpoint because the cn-southwest-2
          # (Guiyang) bucket uses a different key pair. The source
          # download above stays on the legacy ap-southeast-1 endpoint.
          WHEELS_ENDPOINT='${{ inputs.wheels_obs_endpoint }}'
          WHEELS_BUCKET='${{ inputs.wheels_obs_bucket }}'
          if [[ "${WHEELS_ENDPOINT}" == *cn-southwest-2* ]]; then
            obsutil config -i=${{ secrets.ACCESSKEY_GUIYANG }} -k=${{ secrets.SECRETACCESSKEY_GUIYANG }} -e=${WHEELS_ENDPOINT}
          else
            obsutil config -i=${{ secrets.ACCESSKEY }} -k=${{ secrets.SECRETACCESSKEY }} -e=${WHEELS_ENDPOINT}
          fi

          TARBALL="${{ steps.sha.outputs.pytorch_wheels_tarball }}"
          for attempt in 1 2; do
            echo "=== Download attempt ${attempt} ==="
            if obsutil cp "obs://${WHEELS_BUCKET}/${TARBALL}" "./${TARBALL}" -vlength; then
              echo "Download succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Download attempt ${attempt} failed"
            sleep 10
          done
          echo "Download failed after 2 attempts"
          exit 1

      - name: Download torch_npu wheels from OBS
        if: steps.sha.outputs.torchnpu_wheels_tarball != ''
        run: |
          # Same caller-selectable wheels bucket/endpoint as the pytorch
          # wheels download above; credentials follow the endpoint.
          WHEELS_ENDPOINT='${{ inputs.wheels_obs_endpoint }}'
          WHEELS_BUCKET='${{ inputs.wheels_obs_bucket }}'
          if [[ "${WHEELS_ENDPOINT}" == *cn-southwest-2* ]]; then
            obsutil config -i=${{ secrets.ACCESSKEY_GUIYANG }} -k=${{ secrets.SECRETACCESSKEY_GUIYANG }} -e=${WHEELS_ENDPOINT}
          else
            obsutil config -i=${{ secrets.ACCESSKEY }} -k=${{ secrets.SECRETACCESSKEY }} -e=${WHEELS_ENDPOINT}
          fi

          TARBALL="${{ steps.sha.outputs.torchnpu_wheels_tarball }}"
          for attempt in 1 2; do
            echo "=== Download attempt ${attempt} ==="
            if obsutil cp "obs://${WHEELS_BUCKET}/${TARBALL}" "./${TARBALL}" -vlength; then
              echo "Download succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Download attempt ${attempt} failed"
            sleep 10
          done
          echo "Download failed after 2 attempts" >&2
          exit 1

      - name: Extract and install wheels
        run: |
          mkdir -p /tmp/wheels
          tar -xzf ${{ steps.sha.outputs.pytorch_wheels_tarball }} -C /tmp/wheels
          rm ${{ steps.sha.outputs.pytorch_wheels_tarball }}
          if [ -n "${{ steps.sha.outputs.torchnpu_wheels_tarball }}" ]; then
            tar -xzf ${{ steps.sha.outputs.torchnpu_wheels_tarball }} -C /tmp/wheels
            rm ${{ steps.sha.outputs.torchnpu_wheels_tarball }}
          fi
          pip install /tmp/wheels/torch-*.whl
          pip install --no-deps /tmp/wheels/torch_npu*.whl
          pip install --no-deps /tmp/wheels/torchvision-*.whl || echo "WARNING: torchvision wheel not found in tarball"

      - name: Checkout test scripts
        uses: actions/checkout@v6
        with:
          path: ci-scripts
          ref: ci-test

      - name: Collect and shard test cases
        id: collect_cases
        run: |
          source /usr/local/Ascend/cann/set_env.sh 2>/dev/null || true
          source /usr/local/Ascend/nnal/atb/set_env.sh 2>/dev/null || true
          export LD_LIBRARY_PATH="$(python3 -c 'import sys; print(sys.prefix)')/lib:$LD_LIBRARY_PATH"

          export PYTHONPATH="${GITHUB_WORKSPACE}/ci-scripts/.github/scripts:${PYTHONPATH}"

          CASE_PATHS_CONFIG='${{ inputs.case_paths_config }}'

          echo "=== Collecting all test cases ==="
          echo "Case paths config: ${CASE_PATHS_CONFIG:-<scan all>}"

          CONFIG_ARG=""
          if [ -n "${CASE_PATHS_CONFIG}" ]; then
            CONFIG_ARG="--case-paths-config ${GITHUB_WORKSPACE}/ci-scripts/${CASE_PATHS_CONFIG}"
          fi

          FULL_SCAN_ARG=""
          if [ "${{ inputs.full_scan }}" = "true" ]; then
            FULL_SCAN_ARG="--full-scan"
          fi

          SKIP_LIST_ARG=""
          SKIP_LIST_INPUT='${{ inputs.skip_list }}'
          if [ -n "${SKIP_LIST_INPUT}" ]; then
            for skip_path in ${SKIP_LIST_INPUT}; do
              FULL_PATH="${GITHUB_WORKSPACE}/ci-scripts/${skip_path}"
              if [ -f "${FULL_PATH}" ]; then
                SKIP_LIST_ARG="${SKIP_LIST_ARG} --skip-list ${FULL_PATH}"
                echo "Skip list: ${skip_path}"
              else
                echo "WARNING: skip list file not found: ${FULL_PATH}"
              fi
            done
          fi

          CASE_WHITELIST_ARG=""
          CASE_WHITELIST_INPUT='${{ inputs.case_whitelist }}'
          if [ -n "${CASE_WHITELIST_INPUT}" ]; then
            WHITELIST_PATH="${GITHUB_WORKSPACE}/ci-scripts/${CASE_WHITELIST_INPUT}"
            if [ ! -f "${WHITELIST_PATH}" ]; then
              echo "::error::case whitelist file not found: ${WHITELIST_PATH}; refusing to collect without it (would silently widen the case set)"
              exit 1
            fi
            CASE_WHITELIST_ARG="--case-whitelist ${WHITELIST_PATH}"
            echo "Case whitelist: ${CASE_WHITELIST_INPUT}"
          fi

          PLATFORM_ARG=""
          case '${{ inputs.docker_image }}' in
            *cann-a5*) PLATFORM_ARG="--platform a5" ;;
            *cann-a3*) PLATFORM_ARG="--platform a3" ;;
          esac
          echo "Skip-list platform: ${PLATFORM_ARG:-<not detected>}"

          python3 ${GITHUB_WORKSPACE}/ci-scripts/.github/scripts/collect_all_cases.py \
            --test-dir ${GITHUB_WORKSPACE}/pytorch/test \
            --hw-classification ${{ inputs.hw_classification }} \
            ${CONFIG_ARG} \
            ${FULL_SCAN_ARG} \
            ${SKIP_LIST_ARG} \
            ${PLATFORM_ARG} \
            ${CASE_WHITELIST_ARG} \
            --regular-threshold 50000 \
            --distributed-threshold 3000 \
            --device-env "${{ inputs.device_env }}" \
            --output-dir ${GITHUB_WORKSPACE}/cases-shards \
            --error-log-dir ${GITHUB_WORKSPACE}/collection_errors \
            --parallel 16 \
            2>&1 | tee /tmp/collect_cases.log

          echo "=== Generated shard files ==="
          ls -la ${GITHUB_WORKSPACE}/cases-shards/

          echo "=== Collection summary ==="
          cat ${GITHUB_WORKSPACE}/cases-shards/cases_collection_summary.json

          # Extract per-category outputs from summary JSON
          python3 -c "
          import json
          d = json.load(open('${GITHUB_WORKSPACE}/cases-shards/cases_collection_summary.json'))
          cats = d.get('categories', {})

          total = d.get('total_cases', 0)
          print(f'total_cases={total}')

          for cat in ['core', 'tensor', 'distributed', 'graph', 'others']:
              c = cats.get(cat, {})
              has = 'true' if c.get('total_cases', 0) > 0 else 'false'
              print(f'has_{cat}={has}')
          " >> "$GITHUB_OUTPUT"

      - name: Build shard matrices
        id: build_matrix
        run: |
          python3 -c "
          import json
          d = json.load(open('${GITHUB_WORKSPACE}/cases-shards/cases_collection_summary.json'))
          cats = d.get('categories', {})

          for cat in ['core', 'tensor', 'distributed', 'graph', 'others']:
              c = cats.get(cat, {})
              n = c.get('num_shards', 0)
              w = c.get('workers', 32)
              matrix = json.dumps(list(range(1, n + 1))) if n > 0 else '[]'
              print(f'{cat}_matrix={matrix}')
              print(f'{cat}_num_shards={n}')
              print(f'{cat}_workers={w}')

          # Build test_matrix for _test.yml matrix include. One entry per
          # (category, shard): each entry's matrix_json pins exactly one
          # shard, so every test job lives in the caller's single matrix
          # and its strategy.max-parallel caps concurrent test jobs
          # globally. (With one entry per category, max-parallel on the
          # caller could only limit how many categories are expanded at
          # once — each category would still launch all its shards.)
          # Same single-element matrix_json pattern as dist1-rerun-a5.yml.
          test_matrix = []
          for cat in ['core', 'tensor', 'distributed', 'graph', 'others']:
              c = cats.get(cat, {})
              n = c.get('num_shards', 0)
              if n > 0:
                  w = c.get('workers', 32)
                  r = c.get('runner', 'linux-aarch64-a3-8')
                  for shard in range(1, n + 1):
                      test_matrix.append({
                          'category': cat,
                          'num_shards': str(n),
                          'matrix_json': json.dumps([shard]),
                          'max_workers': str(w),
                          'runner_label': r,
                      })
          print(f'test_matrix={json.dumps(test_matrix)}')
          " >> "$GITHUB_OUTPUT"

      - name: Upload cases shard JSONs
        uses: actions/upload-artifact@v4
        with:
          name: cases-shards${{ inputs.artifact_suffix }}
          path: cases-shards/
          retention-days: 7

      - name: Upload collection error logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-errors${{ inputs.artifact_suffix }}
          path: collection_errors/
          if-no-files-found: ignore
          retention-days: 7
