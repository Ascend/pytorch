name: Receive Trigger

on:
  workflow_call:
    inputs:
      event_type:
        required: true
        type: string
        description: Event type from repository_dispatch (pull_request or push)
      payload:
        required: true
        type: string
        description: Full client_payload as a JSON string

jobs:
  extract:
    runs-on: ubuntu-latest
    outputs:
      upstream_repo: ${{ steps.extract.outputs.upstream_repo }}
      should_build: ${{ steps.extract.outputs.should_build }}
    steps:
      - name: Extract build parameters from payload
        id: extract
        env:
          PAYLOAD_JSON: ${{ inputs.payload }}
          EVENT_TYPE: ${{ inputs.event_type }}
        run: |
          set -euo pipefail

          # ---- Filter: only merged PRs targeting main ----
          if [ "${EVENT_TYPE}" = "pull_request" ]; then
            ACTION=$(echo "$PAYLOAD_JSON" | jq -r '.payload.action // empty')
            BASE_REF=$(echo "$PAYLOAD_JSON" | jq -r '.payload.pull_request.base.ref // empty')
            if [ "${ACTION}" != "closed" ]; then
              echo "SKIP: PR action is '${ACTION}', not 'closed'"
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "${BASE_REF}" != "main" ]; then
              echo "SKIP: PR targets '${BASE_REF}', not 'main'"
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # repository_dispatch payload may not populate `merged` correctly.
            # pytorch/pytorch CI adds a "Merged" label to merged PRs — use that.
            HAS_MERGED=$(echo "$PAYLOAD_JSON" | jq -r '.payload.pull_request.labels // [] | map(.name) | index("Merged") // ""')
            if [ -z "${HAS_MERGED}" ]; then
              echo "SKIP: PR does not have 'Merged' label"
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif [ "${EVENT_TYPE}" = "push" ]; then
            echo "SKIP: push events are not processed"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "ERROR: Unknown event_type: ${EVENT_TYPE}"
            exit 1
          fi

          # ---- Extract build parameters ----
          # (Filter above guarantees: pull_request, closed, target=main, has "Merged" label)
          # Build always pulls latest main from the upstream repo — no SHA extraction needed.
          UPSTREAM_REPO=$(echo "$PAYLOAD_JSON" | jq -r '.payload.repository.full_name // empty')

          if [ -z "${UPSTREAM_REPO}" ]; then
            echo "ERROR: Could not extract upstream_repo from payload"
            exit 1
          fi

          echo "upstream_repo=${UPSTREAM_REPO}" >> "$GITHUB_OUTPUT"
          echo "should_build=true" >> "$GITHUB_OUTPUT"

          echo "=== Extracted Build Parameters ==="
          echo "event_type:    ${EVENT_TYPE}"
          echo "upstream_repo: ${UPSTREAM_REPO}"
          echo "upstream_ref:  main  (latest upstream main branch)"

      - name: Print upstream merge commit SHA (for observation)
        id: resolve_merge_sha
        if: ${{ steps.extract.outputs.should_build == 'true' }}
        env:
          PAYLOAD_JSON: ${{ inputs.payload }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PR_NUMBER=$(echo "$PAYLOAD_JSON" | jq -r '.payload.pull_request.number // empty')
          UPSTREAM_REPO=$(echo "$PAYLOAD_JSON" | jq -r '.payload.repository.full_name // empty')

          if [ -z "${PR_NUMBER}" ] || [ -z "${UPSTREAM_REPO}" ]; then
            echo "WARN: Missing PR number or upstream repo in payload, skipping SHA resolution"
            exit 0
          fi

          echo "=== Resolving merge commit SHA for PR #${PR_NUMBER} in ${UPSTREAM_REPO} ==="

          # ---- Show what's in the payload ----
          PAYLOAD_MERGED=$(echo "$PAYLOAD_JSON" | jq -r '.payload.pull_request.merged // "unknown"')
          PAYLOAD_MERGE_SHA=$(echo "$PAYLOAD_JSON" | jq -r '.payload.pull_request.merge_commit_sha // "null"')
          PAYLOAD_BASE_SHA=$(echo "$PAYLOAD_JSON" | jq -r '.payload.pull_request.base.sha // "null"')
          PAYLOAD_HEAD_SHA=$(echo "$PAYLOAD_JSON" | jq -r '.payload.pull_request.head.sha // "null"')

          echo "Payload values:"
          echo "  merged:           ${PAYLOAD_MERGED}"
          echo "  merge_commit_sha: ${PAYLOAD_MERGE_SHA}"
          echo "  base.sha:         ${PAYLOAD_BASE_SHA}"
          echo "  head.sha:         ${PAYLOAD_HEAD_SHA}"

          # ---- Query GitHub PR API ----
          echo ""
          echo "Querying GitHub API: GET /repos/${UPSTREAM_REPO}/pulls/${PR_NUMBER}"

          API_RESPONSE=$(curl -sf \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${UPSTREAM_REPO}/pulls/${PR_NUMBER}")

          API_MERGED=$(echo "$API_RESPONSE" | jq -r '.merged // false')
          API_MERGE_SHA=$(echo "$API_RESPONSE" | jq -r '.merge_commit_sha // "null"')

          echo "PR API response:"
          echo "  merged:           ${API_MERGED}"
          echo "  merge_commit_sha: ${API_MERGE_SHA}"

          # ---- Search commits on main by PR number ----
          # pytorch/pytorch uses a land bot that pushes directly to main,
          # bypassing GitHub's native merge. So merged=false and
          # merge_commit_sha is a placeholder. The land bot commit message
          # always contains "Pull Request resolved: ...pull/{PR_NUMBER}".
          # We use the Commit Search API to find the real commit on main.
          echo ""
          echo "Querying GitHub Commit Search API for PR #${PR_NUMBER}..."

          SEARCH_RESPONSE=$(curl -sf \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/search/commits?q=repo:${UPSTREAM_REPO}+${PR_NUMBER}&sort=author-date&order=desc&per_page=5")

          TOTAL_COUNT=$(echo "$SEARCH_RESPONSE" | jq -r '.total_count // 0')
          echo "Search result: total_count=${TOTAL_COUNT}"

          if [ "${TOTAL_COUNT}" != "0" ]; then
            echo ""
            echo "All commits found (sorted by author-date desc):"
            echo "$SEARCH_RESPONSE" | jq -r '.items[] | "  SHA: \(.sha[0:12])  author-date: \(.commit.author.date // "?")  message: \(.commit.message | split("\n")[0])"'

            # Filter out "Revert" commits — a Revert of a PR also matches the
            # PR number in its message, but is NOT the commit we want to build.
            MERGE_SHA=$(echo "$SEARCH_RESPONSE" | jq -r \
              '[.items[] | select((.commit.message | split("\n")[0]) | test("^Revert"; "i") | not)] | .[0].sha // "null"')

            if [ "${MERGE_SHA}" != "null" ]; then
              echo ""
              echo "Merge commit SHA (excluding reverts): ${MERGE_SHA}"
            else
              echo ""
              echo "WARN: All matching commits are reverts, no merge commit found"
            fi
          else
            echo "WARN: No commits found for PR #${PR_NUMBER}"
          fi

          echo ""
          echo "=== This SHA would be used as upstream_ref (currently NOT applied, still using main) ==="

  build:
    needs: [extract]
    if: ${{ needs.extract.outputs.should_build == 'true' }}
    uses: ./.github/workflows/_build.yml
    secrets: inherit
    with:
      upstream_repo: pytorch/pytorch
      upstream_ref: main
      torch_npu_repo: Ascend/pytorch
      torch_npu_ref: master
      docker_image: quay.io/kerer/pytorch:torch-npu-test-aarch64-cann-a3-py3.10-torch-nightly
      report_to_upstream: true

  test:
    needs: [extract, build]
    if: ${{ needs.extract.outputs.should_build == 'true' && needs.build.result == 'success' }}
    uses: ./.github/workflows/_test.yml
    secrets: inherit
    with:
      resolved_short: ${{ needs.build.outputs.resolved_short }}
      torch_npu_short: ${{ needs.build.outputs.torch_npu_short }}
      case_paths_config: .github/config/pr_test_whitelist.yml
      skip_list: .github/config/pr_skip_list.jsonl
      docker_image: quay.io/kerer/pytorch:torch-npu-test-aarch64-cann-a3-py3.10-torch-nightly
      report_to_upstream: true
      hw_classification: 'ACCELERATOR'
