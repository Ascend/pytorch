name: Receive Trigger

on:
  workflow_call:
    inputs:
      event_type:
        required: true
        type: string
        description: Event type from repository_dispatch (pull_request or push)
      payload:
        required: true
        type: string
        description: Full client_payload as a JSON string

jobs:
  extract:
    runs-on: ubuntu-latest
    outputs:
      upstream_repo: ${{ steps.extract.outputs.upstream_repo }}
      upstream_ref: ${{ steps.extract.outputs.upstream_ref }}
      should_build: ${{ steps.extract.outputs.should_build }}
      merge_sha: ${{ steps.resolve_merge_sha.outputs.merge_sha }}
    steps:
      - name: Log ciflow/trunk tag push events (observation)
        # Observation-only (hypothesis validation, to be removed):
        # When a merge is requested on an upstream PR, pytorch-bot creates
        # tag refs/tags/ciflow/trunk/<PR#> pointing at the PR head, which is
        # the push event that triggers upstream trunk CI. Log every push
        # event (one-liner) and dump the full picture for ciflow/trunk/*
        # tags so the fields can be verified over a day of observation.
        # This step never triggers a build.
        if: ${{ inputs.event_type == 'push' }}
        env:
          PAYLOAD_JSON: ${{ inputs.payload }}
        run: |
          set -euo pipefail

          REF=$(echo "$PAYLOAD_JSON" | jq -r '.payload.ref // empty')
          CREATED=$(echo "$PAYLOAD_JSON" | jq -r '.payload.created // false')
          DELETED=$(echo "$PAYLOAD_JSON" | jq -r '.payload.deleted // false')
          FORCED=$(echo "$PAYLOAD_JSON" | jq -r '.payload.forced // false')
          PUSHER=$(echo "$PAYLOAD_JSON" | jq -r '.payload.pusher.name // empty')
          SENDER=$(echo "$PAYLOAD_JSON" | jq -r '.payload.sender.login // empty')
          DELIVERY_ID=$(echo "$PAYLOAD_JSON" | jq -r '.delivery_id // empty')

          echo "[push-observe] delivery=${DELIVERY_ID} ref=${REF} created=${CREATED} deleted=${DELETED} forced=${FORCED} pusher=${PUSHER} sender=${SENDER}"

          if echo "$REF" | grep -qE '^refs/tags/ciflow/trunk/'; then
            PR_NUM=$(echo "$REF" | sed -E 's#^refs/tags/ciflow/trunk/##')
            if [ "$PUSHER" = "pytorch-bot[bot]" ] || [ "$SENDER" = "pytorch-bot[bot]" ]; then
              BOT_FLAG="CONFIRMED: pushed by pytorch-bot[bot]"
            else
              BOT_FLAG="MISMATCH: pusher is NOT pytorch-bot[bot]"
            fi

            echo ""
            echo "==================== [CIFLOW-TRUNK-TAG] ===================="
            echo "delivery_id:      ${DELIVERY_ID}"
            echo "ref:              ${REF}  (PR #${PR_NUM})"
            echo "created/deleted:  ${CREATED} / ${DELETED}"
            echo "before -> after:  $(echo "$PAYLOAD_JSON" | jq -r '.payload.before // empty' | cut -c1-12) -> $(echo "$PAYLOAD_JSON" | jq -r '.payload.after // empty' | cut -c1-12)"
            echo "pusher/sender:    ${PUSHER} / ${SENDER}"
            echo "bot check:        ${BOT_FLAG}"
            echo "PR source branch: $(echo "$PAYLOAD_JSON" | jq -r '.payload.base_ref // empty')"
            echo "commits in push:  $(echo "$PAYLOAD_JSON" | jq -r '.payload.commits | length')"
            echo "head_commit sha:  $(echo "$PAYLOAD_JSON" | jq -r '.payload.head_commit.id // empty')"
            echo "head_commit msg:  $(echo "$PAYLOAD_JSON" | jq -r '.payload.head_commit.message // empty' | head -n1)"
            echo "head_commit ts:   $(echo "$PAYLOAD_JSON" | jq -r '.payload.head_commit.timestamp // empty')"
            echo "compare url:      $(echo "$PAYLOAD_JSON" | jq -r '.payload.compare // empty')"
            echo "--- head_commit files ---"
            echo "$PAYLOAD_JSON" | jq -r '(.payload.head_commit.added // [])[]' | sed 's/^/  A /'
            echo "$PAYLOAD_JSON" | jq -r '(.payload.head_commit.modified // [])[]' | sed 's/^/  M /'
            echo "$PAYLOAD_JSON" | jq -r '(.payload.head_commit.removed // [])[]' | sed 's/^/  D /'
            echo "============================================================"
            echo ""

            # ---- Verify the tag target is the PR head (what upstream trunk CI runs) ----
            # Upstream trunk.yml checks out the commit the tag points at, which is
            # the PR head, NOT a merge with main. Query the GitHub API to verify:
            #   1. The tag object resolves to the same commit as the push "after" SHA
            #   2. That commit equals the PR's head SHA
            if [ "${CREATED}" = "true" ]; then
              AFTER_SHA=$(echo "$PAYLOAD_JSON" | jq -r '.payload.after // empty')
              REPO_FULL=$(echo "$PAYLOAD_JSON" | jq -r '.payload.repository.full_name // empty')
              echo "--- [tag-target-verify] querying GitHub API ---"
              if [ -n "${AFTER_SHA}" ] && [ -n "${REPO_FULL}" ]; then
                TAG_URL="https://api.github.com/repos/${REPO_FULL}/git/ref/tags/ciflow%2Ftrunk%2F${PR_NUM}"
                TAG_QUERY=$(curl -sf "${TAG_URL}" || echo '{"error": "tag ref not found or deleted"}')
                TAG_SHA=$(echo "${TAG_QUERY}" | jq -r '.object.sha // empty')
                TAG_TYPE=$(echo "${TAG_QUERY}" | jq -r '.object.type // empty')

                PR_QUERY=$(curl -sf "https://api.github.com/repos/${REPO_FULL}/pulls/${PR_NUM}" || echo '{"error": "PR not found"}')
                PR_HEAD_SHA=$(echo "${PR_QUERY}" | jq -r '.head.sha // empty')
                PR_STATE=$(echo "${PR_QUERY}" | jq -r '.state // empty')
                PR_MERGED=$(echo "${PR_QUERY}" | jq -r '.merged // empty')
                PR_TITLE=$(echo "${PR_QUERY}" | jq -r '.title // empty' | head -c 80)

                echo "tag object:        ciflow/trunk/${PR_NUM} -> ${TAG_SHA} (${TAG_TYPE})"
                echo "push after SHA:    ${AFTER_SHA}"
                echo "PR #${PR_NUM} head:     ${PR_HEAD_SHA} (state=${PR_STATE}, merged=${PR_MERGED})"
                echo "PR title:          ${PR_TITLE}"
                if [ -n "${TAG_SHA}" ] && [ "${TAG_SHA}" = "${AFTER_SHA}" ] && [ "${AFTER_SHA}" = "${PR_HEAD_SHA}" ]; then
                  echo "verdict:           MATCH - tag -> after SHA -> PR head (upstream trunk CI runs the PR head commit)"
                elif [ -z "${TAG_SHA}" ] && [ "${AFTER_SHA}" = "${PR_HEAD_SHA}" ]; then
                  echo "verdict:           MATCH (tag already deleted, likely PR merged/closed) - after SHA == PR head"
                else
                  echo "verdict:           DIFFER - tag=${TAG_SHA} after=${AFTER_SHA} pr_head=${PR_HEAD_SHA}"
                fi
              fi
              echo ""
            fi
          fi

      - name: Extract build parameters from payload
        id: extract
        env:
          PAYLOAD_JSON: ${{ inputs.payload }}
          EVENT_TYPE: ${{ inputs.event_type }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # ---- Filter: only merged PRs (closed + Merged label) ----
          # pytorch/pytorch uses a land bot that pushes directly to main,
          # bypassing GitHub's native merge. So base.ref may be "main"
          # (normal PR) or "gh/..." (ghstack PR), and `merged` is always
          # false. The "Merged" label is the authoritative signal that
          # the PR has been landed to main by MergeBot.
          #
          # Check payload snapshot first (fast path), then fall back
          # to a live API query if the label is missing from the payload.
          if [ "${EVENT_TYPE}" = "pull_request" ]; then
            ACTION=$(echo "$PAYLOAD_JSON" | jq -r '.payload.action // empty')
            if [ "${ACTION}" != "closed" ]; then
              echo "SKIP: PR action is '${ACTION}', not 'closed'"
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            PR_NUMBER=$(echo "$PAYLOAD_JSON" | jq -r '.payload.pull_request.number // empty')
            UPSTREAM_REPO=$(echo "$PAYLOAD_JSON" | jq -r '.payload.repository.full_name // empty')

            if [ -z "${PR_NUMBER}" ] || [ -z "${UPSTREAM_REPO}" ]; then
              echo "ERROR: Could not extract PR number or upstream repo from payload"
              exit 1
            fi

            echo "Checking 'Merged' label for PR #${PR_NUMBER} in ${UPSTREAM_REPO}"

            # Fast path: check payload snapshot first
            HAS_MERGED=$(echo "$PAYLOAD_JSON" | jq -r '.payload.pull_request.labels // [] | map(.name) | index("Merged") // ""')
            if [ -n "${HAS_MERGED}" ]; then
              echo "Found 'Merged' label in webhook payload"
            else
              # MergeBot may add the label after closing the PR;
              # fall back to live API query
              LABELS_RESPONSE=$(curl -sf \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${UPSTREAM_REPO}/issues/${PR_NUMBER}/labels")

              HAS_MERGED=$(echo "$LABELS_RESPONSE" | jq -r '[.[].name] | index("Merged") // ""')
              if [ -n "${HAS_MERGED}" ]; then
                echo "Found 'Merged' label via GitHub API"
              fi
            fi

            if [ -z "${HAS_MERGED}" ]; then
              echo "SKIP: PR #${PR_NUMBER} does not have 'Merged' label"
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif [ "${EVENT_TYPE}" = "push" ]; then
            # ---- Filter: ciflow/trunk tag creation (upstream PR trunk gate) ----
            # TEMPORARILY DISABLED: gate resources are insufficient right now.
            # Re-enable the block below (and restore the push branch in the
            # "Extract build parameters" section) once resources allow.
            # Observation logging above still records every push event.
            echo "SKIP: push events are not processed (ciflow/trunk build temporarily disabled)"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
            # When a merge is requested on an upstream PR, pytorch-bot creates
            # tag refs/tags/ciflow/trunk/<PR#> pointing at the PR head commit,
            # which is the same commit upstream trunk CI checks out and runs.
            # Mirror that: build the tag target (PR head), NOT main.
            # Only creation events count; deletions (tag cleanup / PR updates)
            # are ignored, and only pushes by pytorch-bot are trusted.
            # REF=$(echo "$PAYLOAD_JSON" | jq -r '.payload.ref // empty')
            # CREATED=$(echo "$PAYLOAD_JSON" | jq -r '.payload.created // false')
            # PUSHER=$(echo "$PAYLOAD_JSON" | jq -r '.payload.pusher.name // empty')
            # SENDER=$(echo "$PAYLOAD_JSON" | jq -r '.payload.sender.login // empty')
            #
            # if echo "$REF" | grep -qE '^refs/tags/ciflow/trunk/' \
            #    && [ "${CREATED}" = "true" ] \
            #    && { [ "${PUSHER}" = "pytorch-bot[bot]" ] || [ "${SENDER}" = "pytorch-bot[bot]" ]; }; then
            #   PR_NUMBER=$(echo "$REF" | sed -E 's#^refs/tags/ciflow/trunk/##')
            #   UPSTREAM_REPO=$(echo "$PAYLOAD_JSON" | jq -r '.payload.repository.full_name // empty')
            #   UPSTREAM_REF=$(echo "$PAYLOAD_JSON" | jq -r '.payload.after // empty')
            #
            #   if [ -z "${UPSTREAM_REPO}" ] || [ -z "${UPSTREAM_REF}" ]; then
            #     echo "ERROR: ciflow/trunk tag push without repo/after SHA: repo='${UPSTREAM_REPO}' after='${UPSTREAM_REF}'"
            #     exit 1
            #   fi
            #
            #   echo "CIFLOW trunk tag creation detected for PR #${PR_NUMBER}"
            #   echo "Will build upstream ref: ${UPSTREAM_REF} (tag target = PR head)"
            # else
            #   echo "SKIP: push event (ref=${REF}, created=${CREATED}, pusher=${PUSHER}) is not a pytorch-bot ciflow/trunk tag creation"
            #   echo "should_build=false" >> "$GITHUB_OUTPUT"
            #   exit 0
            # fi
          else
            echo "ERROR: Unknown event_type: ${EVENT_TYPE}"
            exit 1
          fi

          # ---- Extract build parameters ----
          # Only one path reaches here right now:
          #   pull_request: closed + "Merged" label -> build from main merge
          #                 commit (merge_sha output, resolved below)
          # Disabled (resource constraints), re-enable with the push branch above:
          #   push:         ciflow/trunk tag creation -> build from the tag
          #                 target = PR head commit (upstream_ref output)
          echo "upstream_repo=${UPSTREAM_REPO}" >> "$GITHUB_OUTPUT"
          echo "upstream_ref=${UPSTREAM_REF:-}" >> "$GITHUB_OUTPUT"
          echo "should_build=true" >> "$GITHUB_OUTPUT"

          echo "=== Extracted Build Parameters ==="
          echo "event_type:    ${EVENT_TYPE}"
          echo "upstream_repo: ${UPSTREAM_REPO}"
          if [ -n "${UPSTREAM_REF:-}" ]; then
            echo "upstream_ref:  ${UPSTREAM_REF} (ciflow/trunk tag target = PR head)"
          else
            echo "upstream_ref:  resolved from main merge commit"
          fi

      - name: Resolve merge commit SHA on main
        id: resolve_merge_sha
        if: ${{ steps.extract.outputs.should_build == 'true' && inputs.event_type == 'pull_request' }}
        env:
          PAYLOAD_JSON: ${{ inputs.payload }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PR_NUMBER=$(echo "$PAYLOAD_JSON" | jq -r '.payload.pull_request.number // empty')
          UPSTREAM_REPO=$(echo "$PAYLOAD_JSON" | jq -r '.payload.repository.full_name // empty')

          if [ -z "${PR_NUMBER}" ] || [ -z "${UPSTREAM_REPO}" ]; then
            echo "WARN: Missing PR number or upstream repo in payload, skipping SHA resolution"
            exit 0
          fi

          echo "=== Resolving merge commit SHA for PR #${PR_NUMBER} in ${UPSTREAM_REPO} ==="

          # ---- List recent commits on main and find PR merge commit ----
          # pytorch/pytorch uses a land bot that pushes directly to main,
          # bypassing GitHub's native merge. So merged=false and
          # merge_commit_sha is a placeholder. The land bot commit message
          # always contains "(#PR_NUMBER)" in the subject line.
          # We list recent commits on main via the Commits API (reads git
          # data directly, no search index delay) and match the PR number
          # in the subject line (first line) to avoid cross-reference
          # false positives from other PR numbers in the body.
          echo ""
          echo "Querying GitHub Commits API: GET /repos/${UPSTREAM_REPO}/commits?sha=main&per_page=100"

          COMMITS_RESPONSE=$(curl -sf \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${UPSTREAM_REPO}/commits?sha=main&per_page=100")

          COMMIT_COUNT=$(echo "$COMMITS_RESPONSE" | jq -r 'length')
          echo "Commits on main (recent ${COMMIT_COUNT}):"
          echo "$COMMITS_RESPONSE" | jq -r '.[] | "  SHA: \(.sha[0:12])  date: \(.commit.author.date // "?")  message: \(.commit.message | split("\n")[0])"'

          # Match "(#PR_NUMBER)" in commit subject line, exclude Reverts
          MERGE_SHA=$(echo "$COMMITS_RESPONSE" | jq -r \
            --arg pr "(#${PR_NUMBER})" \
            '[.[] | (.commit.message // "") as $msg
             | ($msg | split("\n")[0]) as $subject
             | select($subject | test($pr; "i"))
             | select($subject | test("^Revert"; "i") | not)]
             | .[0].sha // "null"')

          if [ "${MERGE_SHA}" != "null" ]; then
            echo ""
            echo "Merge commit SHA (excluding reverts): ${MERGE_SHA}"
            echo "merge_sha=${MERGE_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo ""
            echo "WARN: No commit on main references (#${PR_NUMBER}) in subject, falling back to main"
          fi

  build:
    needs: [extract]
    if: ${{ needs.extract.outputs.should_build == 'true' }}
    uses: ./.github/workflows/_build.yml
    secrets: inherit
    with:
      upstream_repo: ${{ needs.extract.outputs.upstream_repo || 'pytorch/pytorch' }}
      # ciflow/trunk tag path: exact PR head SHA the upstream trunk gate runs.
      # pull_request path: merge commit on main (or latest main as fallback).
      upstream_ref: ${{ needs.extract.outputs.upstream_ref || needs.extract.outputs.merge_sha || 'main' }}
      torch_npu_repo: Ascend/pytorch
      torch_npu_ref: master
      docker_image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-test-aarch64-cann-a3-py3.10-torch-master-202608200833
      report_to_upstream: true

  test:
    needs: [extract, build]
    if: ${{ needs.extract.outputs.should_build == 'true' && needs.build.result == 'success' }}
    uses: ./.github/workflows/_test.yml
    secrets: inherit
    with:
      resolved_short: ${{ needs.build.outputs.resolved_short }}
      torch_npu_short: ${{ needs.build.outputs.torch_npu_short }}
      case_paths_config: .github/config/pr_test_whitelist.yml
      skip_list: .github/config/pr_skip_list.jsonl
      docker_image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-test-aarch64-cann-a3-py3.10-torch-master-202608200833
      report_to_upstream: true
      hw_classification: 'ACCELERATOR'
