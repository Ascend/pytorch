name: Nightly Build and Collect

on:
  push:
    branches:
      - ci-test
    paths:
      - '.github/workflows/nightly-collect-only.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_nightly_build.yml
    secrets: inherit
    with:
      upstream_repo: pytorch/pytorch
      upstream_ref: main
      torch_npu_repo: Ascend/pytorch
      torch_npu_ref: master
      docker_image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-test-aarch64-cann-a3-py3.10-torch-master-cann9.2.0-20260910200430-202609140905-0ba22e2b
      report_to_upstream: false
      runner_label: 'linux-aarch64-cpu-24'
      max_jobs: '23'

  collect:
    needs: build
    uses: ./.github/workflows/_nightly_test-collect.yml
    secrets: inherit
    with:
      resolved_short: ${{ needs.build.outputs.resolved_short }}
      resolved_sha: ${{ needs.build.outputs.resolved_sha }}
      upstream_repo: pytorch/pytorch
      case_paths_config: .github/config/nightly_test_categories.yml
      docker_image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-test-aarch64-cann-a3-py3.10-torch-master-cann9.2.0-20260910200430-202609140905-0ba22e2b
      hw_classification: 'GENERIC ACCELERATOR'
      full_scan: true
      device_env: 'privateuse1,cpu'
      runner_label: 'linux-aarch64-a3-800i-2-cn12-001'
      skip_list: |-
        .github/config/disabled_testcases.json
        .github/config/running_skiped_testcases.json

  build-a5:
    uses: ./.github/workflows/_nightly_build.yml
    secrets: inherit
    with:
      upstream_repo: pytorch/pytorch
      upstream_ref: main
      torch_npu_repo: Ascend/pytorch
      torch_npu_ref: master
      docker_image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-test-x86_64-cann-a5-py3.10-torch-master-cann9.2.0-20260910200430-202609141214-9b737f59
      report_to_upstream: false
      runner_label: 'linux-amd64-a5-2'
      max_jobs: '23'
      artifact_suffix: '-a5'

  collect-a5:
    needs: build-a5
    uses: ./.github/workflows/_nightly_test-collect.yml
    secrets: inherit
    with:
      resolved_short: ${{ needs.build-a5.outputs.resolved_short }}
      resolved_sha: ${{ needs.build-a5.outputs.resolved_sha }}
      upstream_repo: pytorch/pytorch
      case_paths_config: .github/config/nightly_test_categories.yml
      docker_image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-test-x86_64-cann-a5-py3.10-torch-master-cann9.2.0-20260910200430-202609141214-9b737f59
      hw_classification: 'GENERIC ACCELERATOR'
      full_scan: true
      device_env: 'privateuse1,cpu'
      runner_label: 'linux-amd64-a5-2'
      skip_list: |-
        .github/config/disabled_testcases.json
        .github/config/running_skiped_testcases.json
      artifact_suffix: '-a5'

  summary:
    needs: [collect, collect-a5]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout this repo for summary scripts
        uses: actions/checkout@v6
        with:
          ref: ci-test

      - name: Download aarch64 cases-shards
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: cases-shards
          path: collect-a3

      - name: Download a5 cases-shards
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: cases-shards-a5
          path: collect-a5

      - name: Render collection summary
        run: |
          python3 .github/scripts/summarize_collection.py \
            --label "A3 (aarch64)" --summary collect-a3/cases_collection_summary.json \
            --label "A5 (x86_64)" --summary collect-a5/cases_collection_summary.json
