name: Blacklist Test (a3/a5)

# Runs ONLY the nodeids recorded in the platform blacklist files, without any
# collection phase: the blacklists already list explicit nodeids, so this
# pipeline just splits them into shards and executes them.
#
# Both platforms always run in the same workflow (a3 + a5), each with its own
# build, shards and test jobs; there is no platform scope switch any more.
#
# Blacklist files per platform:
#   disabled_testcases_<platform>_all.json
#   unsupported_aclnn_testcases.json   (common + <platform> group)
#   unsupport_dtype_testcases.json     (common + <platform> group)

on:
  push:
    branches:
      - ci-test
    paths:
      - '.github/workflows/blacklist-test.yml'
      - '.github/workflows/_blacklist_diff_shard.yml'
      - '.github/workflows/_blacklist_test-category.yml'
      - '.github/scripts/build_diff_shards.py'
      - '.github/scripts/compare_diff_results.py'
      - '.github/config/disabled_testcases_a3_all.json'
      - '.github/config/disabled_testcases_a5_all.json'
      - '.github/config/unsupported_aclnn_testcases.json'
      - '.github/config/unsupport_dtype_testcases.json'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream PyTorch ref (branch/tag/SHA)'
        required: true
        type: string
        default: 'main'
      torch_npu_ref:
        description: 'torch_npu ref (branch/tag/SHA)'
        required: true
        type: string
        default: 'master'
      num_shards:
        description: 'Number of shards per platform'
        required: true
        type: string
        default: '4'
      diff_num_shards:
        description: 'Number of shards per cross-platform diff category'
        required: true
        type: string
        default: '2'
      test_max_parallel:
        description: 'Max concurrent shard jobs across both platforms'
        required: true
        type: number
        default: 8
      patch_triton_cxx20:
        description: 'Apply the triton-ascend C++20 patch before running'
        required: true
        type: boolean
        default: true

# NOTE: on push events the `inputs` context is empty, so every reference
# below carries an explicit `|| fallback` that encodes the push default
# (upstream main, torch_npu master, 4 blacklist shards, 2 diff shards,
# 8 parallel, patch_triton_cxx20=true — matching the nightly a3/a5 pipelines).

permissions:
  id-token: write
  contents: read

jobs:
  # ==========================================================================
  # Guard against invalid shard counts
  # ==========================================================================
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate inputs
        run: |
          NUM_SHARDS="${{ inputs.num_shards || '4' }}"
          case "${NUM_SHARDS}" in
            ''|*[!0-9]*) echo "::error::num_shards must be a positive integer"; exit 1 ;;
          esac
          if [ "${NUM_SHARDS}" -lt 1 ]; then
            echo "::error::num_shards must be >= 1"
            exit 1
          fi
          DIFF_SHARDS="${{ inputs.diff_num_shards || '2' }}"
          case "${DIFF_SHARDS}" in
            ''|*[!0-9]*) echo "::error::diff_num_shards must be a positive integer"; exit 1 ;;
          esac
          if [ "${DIFF_SHARDS}" -lt 1 ]; then
            echo "::error::diff_num_shards must be >= 1"
            exit 1
          fi

  # ==========================================================================
  # A3
  # ==========================================================================
  build-a3:
    needs: validate
    uses: ./.github/workflows/_nightly_build.yml
    secrets: inherit
    with:
      upstream_repo: pytorch/pytorch
      upstream_ref: ${{ inputs.upstream_ref || 'main' }}
      torch_npu_repo: Ascend/pytorch
      torch_npu_ref: ${{ inputs.torch_npu_ref || 'master' }}
      docker_image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-builder-aarch64-torch-master-202610160225-8a315d17
      report_to_upstream: false
      runner_label: 'linux-aarch64-cpu-24'
      max_jobs: '23'
      artifact_suffix: '-a3'

  shard-a3:
    needs: build-a3
    if: ${{ needs.build-a3.result == 'success' }}
    uses: ./.github/workflows/_blacklist_shard.yml
    secrets: inherit
    with:
      platform: a3
      num_shards: ${{ inputs.num_shards || '4' }}
      artifact_name: cases-shards-a3

  test-a3:
    needs:
      - build-a3
      - shard-a3
    if: ${{ needs.shard-a3.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.test_max_parallel || 8 }}
      matrix:
        include:
          - category: blacklist-a3
            num_shards: ${{ needs.shard-a3.outputs.num_shards }}
            matrix_json: ${{ needs.shard-a3.outputs.shards_json }}
            max_workers: '32'
            runner_label: 'linux-aarch64-a3-800i-2-cn12-001'
    uses: ./.github/workflows/_blacklist_test-category.yml
    secrets: inherit
    with:
      resolved_short: ${{ needs.build-a3.outputs.resolved_short }}
      resolved_sha: ${{ needs.build-a3.outputs.resolved_sha }}
      pytorch_wheels_tarball: ${{ needs.build-a3.outputs.pytorch_wheels_tarball }}
      torchnpu_wheels_tarball: ${{ needs.build-a3.outputs.torchnpu_wheels_tarball }}
      upstream_repo: pytorch/pytorch
      category: ${{ matrix.category }}
      num_shards: ${{ matrix.num_shards }}
      matrix_json: ${{ matrix.matrix_json }}
      max_workers: ${{ matrix.max_workers }}
      docker_image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-test-aarch64-cann-a3-py3.11-torch-master-cann9.2.0-20260910200430-202610160225-8a315d17
      report_to_upstream: false
      runner_label: ${{ matrix.runner_label }}
      device_env: 'privateuse1,cpu'
      patch_triton_cxx20: ${{ inputs.patch_triton_cxx20 || github.event_name == 'push' }}
      cases_artifact_name: cases-shards-a3

  # ==========================================================================
  # A5
  # ==========================================================================
  build-a5:
    needs: validate
    uses: ./.github/workflows/_nightly_build.yml
    secrets: inherit
    with:
      upstream_repo: pytorch/pytorch
      upstream_ref: ${{ inputs.upstream_ref || 'main' }}
      torch_npu_repo: Ascend/pytorch
      torch_npu_ref: ${{ inputs.torch_npu_ref || 'master' }}
      docker_image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-builder-x86_64-torch-master-202610160227-8a315d17
      report_to_upstream: false
      runner_label: 'linux-amd64-a5-2'
      max_jobs: '23'
      artifact_suffix: '-a5'

  shard-a5:
    needs: build-a5
    if: ${{ needs.build-a5.result == 'success' }}
    uses: ./.github/workflows/_blacklist_shard.yml
    secrets: inherit
    with:
      platform: a5
      num_shards: ${{ inputs.num_shards || '4' }}
      artifact_name: cases-shards-a5

  test-a5:
    needs:
      - build-a5
      - shard-a5
    if: ${{ needs.shard-a5.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.test_max_parallel || 8 }}
      matrix:
        include:
          - category: blacklist-a5
            num_shards: ${{ needs.shard-a5.outputs.num_shards }}
            matrix_json: ${{ needs.shard-a5.outputs.shards_json }}
            max_workers: '32'
            runner_label: 'linux-amd64-a5-2'
    uses: ./.github/workflows/_blacklist_test-category.yml
    secrets: inherit
    with:
      resolved_short: ${{ needs.build-a5.outputs.resolved_short }}
      resolved_sha: ${{ needs.build-a5.outputs.resolved_sha }}
      pytorch_wheels_tarball: ${{ needs.build-a5.outputs.pytorch_wheels_tarball }}
      torchnpu_wheels_tarball: ${{ needs.build-a5.outputs.torchnpu_wheels_tarball }}
      upstream_repo: pytorch/pytorch
      category: ${{ matrix.category }}
      num_shards: ${{ matrix.num_shards }}
      matrix_json: ${{ matrix.matrix_json }}
      max_workers: ${{ matrix.max_workers }}
      docker_image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-test-x86_64-cann-a5-py3.11-torch-master-cann9.2.0-20260910200430-202610160226-8a315d17
      report_to_upstream: false
      runner_label: ${{ matrix.runner_label }}
      device_env: 'privateuse1,cpu'
      patch_triton_cxx20: ${{ inputs.patch_triton_cxx20 || github.event_name == 'push' }}
      cases_artifact_name: cases-shards-a5

  # ==========================================================================
  # Cross-platform diff: cases that only ONE platform blacklists are re-run on
  # BOTH platforms, so a failure-with-matching-reason can be turned into a
  # blacklist-sync candidate for the other platform. The candidates are
  # reported as an artifact and never written back to the repository
  # automatically.
  # ==========================================================================
  shard-diff:
    needs: validate
    uses: ./.github/workflows/_blacklist_diff_shard.yml
    with:
      num_shards: ${{ inputs.diff_num_shards || '2' }}

  test-diff-a3:
    needs:
      - build-a3
      - shard-diff
    if: ${{ needs.build-a3.result == 'success' && needs.shard-diff.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.test_max_parallel || 8 }}
      matrix:
        include:
          - category: diff-a3only-a3
            cases_artifact_name: cases-shards-diff-a3only-a3
          - category: diff-a5only-a3
            cases_artifact_name: cases-shards-diff-a5only-a3
    uses: ./.github/workflows/_blacklist_test-category.yml
    secrets: inherit
    with:
      resolved_short: ${{ needs.build-a3.outputs.resolved_short }}
      resolved_sha: ${{ needs.build-a3.outputs.resolved_sha }}
      pytorch_wheels_tarball: ${{ needs.build-a3.outputs.pytorch_wheels_tarball }}
      torchnpu_wheels_tarball: ${{ needs.build-a3.outputs.torchnpu_wheels_tarball }}
      upstream_repo: pytorch/pytorch
      category: ${{ matrix.category }}
      num_shards: ${{ needs.shard-diff.outputs.num_shards }}
      matrix_json: ${{ needs.shard-diff.outputs.shards_json }}
      max_workers: '32'
      docker_image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-test-aarch64-cann-a3-py3.11-torch-master-cann9.2.0-20260910200430-202610160225-8a315d17
      report_to_upstream: false
      runner_label: 'linux-aarch64-a3-800i-2-cn12-001'
      device_env: 'privateuse1,cpu'
      patch_triton_cxx20: ${{ inputs.patch_triton_cxx20 || github.event_name == 'push' }}
      cases_artifact_name: ${{ matrix.cases_artifact_name }}

  test-diff-a5:
    needs:
      - build-a5
      - shard-diff
    if: ${{ needs.build-a5.result == 'success' && needs.shard-diff.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.test_max_parallel || 8 }}
      matrix:
        include:
          - category: diff-a3only-a5
            cases_artifact_name: cases-shards-diff-a3only-a5
          - category: diff-a5only-a5
            cases_artifact_name: cases-shards-diff-a5only-a5
    uses: ./.github/workflows/_blacklist_test-category.yml
    secrets: inherit
    with:
      resolved_short: ${{ needs.build-a5.outputs.resolved_short }}
      resolved_sha: ${{ needs.build-a5.outputs.resolved_sha }}
      pytorch_wheels_tarball: ${{ needs.build-a5.outputs.pytorch_wheels_tarball }}
      torchnpu_wheels_tarball: ${{ needs.build-a5.outputs.torchnpu_wheels_tarball }}
      upstream_repo: pytorch/pytorch
      category: ${{ matrix.category }}
      num_shards: ${{ needs.shard-diff.outputs.num_shards }}
      matrix_json: ${{ needs.shard-diff.outputs.shards_json }}
      max_workers: '32'
      docker_image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-test-x86_64-cann-a5-py3.11-torch-master-cann9.2.0-20260910200430-202610160226-8a315d17
      report_to_upstream: false
      runner_label: 'linux-amd64-a5-2'
      device_env: 'privateuse1,cpu'
      patch_triton_cxx20: ${{ inputs.patch_triton_cxx20 || github.event_name == 'push' }}
      cases_artifact_name: ${{ matrix.cases_artifact_name }}

  # ==========================================================================
  # Aggregate results only. Blacklisted cases are EXPECTED to fail, so this job
  # never turns failures into a red pipeline: a red run would just mean "the
  # blacklist is still accurate". The only signal worth checking is `passed`
  # (blacklist entries that now succeed) and missing reports.
  # ==========================================================================
  summary:
    needs:
      - build-a3
      - shard-a3
      - test-a3
      - build-a5
      - shard-a5
      - test-a5
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Checkout first: actions/checkout runs `git clean -ffdx`, which would
      # delete the downloaded report directories if it ran after them.
      - name: Checkout this repo
        if: always()
        uses: actions/checkout@v6
        with:
          ref: ci-test

      - name: Download a3 test reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: test-reports-bla3-*
          path: reports-a3
          merge-multiple: true

      - name: Download a5 test reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: test-reports-bla5-*
          path: reports-a5
          merge-multiple: true

      - name: Aggregate blacklist results
        run: |
          python3 - <<'PY'
          import glob
          import json
          import os

          groups = [("a3", "reports-a3"), ("a5", "reports-a5")]

          unexpected_pass = 0
          missing = []
          lines = []

          for name, directory in groups:
              files = sorted(glob.glob(os.path.join(directory, "**", "*_cases.json"), recursive=True))
              if not files:
                  missing.append(name)
                  lines.append(f"| {name} | - | - | - | - | - | - |")
                  continue

              totals = {"passed": 0, "failed": 0, "errors": 0, "timeout": 0, "skipped": 0, "total": 0}
              for path in files:
                  with open(path, encoding="utf-8") as f:
                      d = json.load(f)
                  totals["passed"] += d.get("passed", 0)
                  totals["failed"] += d.get("failed", 0)
                  totals["errors"] += d.get("errors", 0)
                  totals["timeout"] += d.get("timeout", 0)
                  totals["skipped"] += d.get("skipped", 0)
                  totals["total"] += d.get("total_cases", 0)

              failed = totals["failed"] + totals["errors"] + totals["timeout"]
              # Failures are the expected outcome for blacklisted cases; only
              # entries that now pass mean the blacklist is stale.
              unexpected_pass += totals["passed"]
              result = "OK" if totals["passed"] == 0 else f"CHECK ({totals['passed']} passed)"
              lines.append(
                  f"| {name} | {len(files)} | {totals['total']} | {totals['passed']} | "
                  f"{failed} | {totals['skipped']} | {result} |"
              )

          header = [
              "### Blacklist test summary",
              "",
              "| platform | shards | total | passed | failed+errors+timeout | skipped | result |",
              "|---|---|---|---|---|---|---|",
          ]
          footer = [
              "",
              "> 黑名单用例预期失败，`failed+errors+timeout` 不作为失败判据；"
              "`result` 仅提示黑名单是否已过期（`CHECK` = 有用例已通过）。",
          ]
          body = "\n".join(header + lines + footer)
          print(body)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a") as f:
                  f.write(body + "\n")

          if missing:
              print(f"WARNING: no test reports found for: {', '.join(missing)}")
          if unexpected_pass:
              print(
                  f"WARNING: {unexpected_pass} blacklisted case(s) now pass; "
                  "they are candidates for removal from the blacklists"
              )
          PY

      - name: Generate blacklist report
        if: always()
        continue-on-error: true
        run: |
          python3 .github/scripts/generate_blacklist_report.py \
            --reports-root . \
            --platform all \
            --config-dir .github/config \
            --output blacklist-report.md

      - name: Upload blacklist report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: blacklist-report
          path: blacklist-report.md
          retention-days: 30

  # ==========================================================================
  # Cross-platform sync candidates. Runs after the diff shards finished on both
  # platforms and only emits a report: nothing is written back to the repo.
  # ==========================================================================
  diff-summary:
    needs:
      - shard-diff
      - test-diff-a3
      - test-diff-a5
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout this repo
        if: always()
        uses: actions/checkout@v6
        with:
          ref: ci-test

      - name: Download diff results (a3only on a3)
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: test-reports-d3a3-*
          path: diff-reports/a3only-a3
          merge-multiple: true

      - name: Download diff results (a3only on a5)
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: test-reports-d3a5-*
          path: diff-reports/a3only-a5
          merge-multiple: true

      - name: Download diff results (a5only on a3)
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: test-reports-d5a3-*
          path: diff-reports/a5only-a3
          merge-multiple: true

      - name: Download diff results (a5only on a5)
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: test-reports-d5a5-*
          path: diff-reports/a5only-a5
          merge-multiple: true

      - name: Compare diff results
        if: always()
        continue-on-error: true
        run: |
          python3 .github/scripts/compare_diff_results.py \
            --reports-root diff-reports \
            --config-dir .github/config \
            --output-prefix blacklist-sync-candidates

      - name: Upload sync candidates
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: blacklist-sync-candidates
          path: |
            blacklist-sync-candidates.json
            blacklist-sync-candidates.md
          retention-days: 30
