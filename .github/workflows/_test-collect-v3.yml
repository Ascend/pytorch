name: Test Collect (v3)

on:
  workflow_call:
    inputs:
      resolved_short:
        required: true
        type: string
        description: Short SHA of upstream PyTorch
      classification_config:
        required: false
        type: string
        default: '.github/config/nightly_v3_test_whitelist.yml'
        description: 'Path to category classification config YAML (relative to ci-scripts checkout root)'
    outputs:
      core_matrix:
        description: Core shard matrix JSON
        value: ${{ jobs.collect.outputs.core_matrix }}
      tensor_matrix:
        description: Tensor shard matrix JSON
        value: ${{ jobs.collect.outputs.tensor_matrix }}
      distributed_matrix:
        description: Distributed shard matrix JSON
        value: ${{ jobs.collect.outputs.distributed_matrix }}
      graph_matrix:
        description: Graph shard matrix JSON
        value: ${{ jobs.collect.outputs.graph_matrix }}
      others_matrix:
        description: Others shard matrix JSON
        value: ${{ jobs.collect.outputs.others_matrix }}
      core_num_shards:
        description: Number of core shards
        value: ${{ jobs.collect.outputs.core_num_shards }}
      tensor_num_shards:
        description: Number of tensor shards
        value: ${{ jobs.collect.outputs.tensor_num_shards }}
      distributed_num_shards:
        description: Number of distributed shards
        value: ${{ jobs.collect.outputs.distributed_num_shards }}
      graph_num_shards:
        description: Number of graph shards
        value: ${{ jobs.collect.outputs.graph_num_shards }}
      others_num_shards:
        description: Number of others shards
        value: ${{ jobs.collect.outputs.others_num_shards }}
      core_runner:
        description: Runner label for core category
        value: ${{ jobs.collect.outputs.core_runner }}
      tensor_runner:
        description: Runner label for tensor category
        value: ${{ jobs.collect.outputs.tensor_runner }}
      distributed_runner:
        description: Runner label for distributed category
        value: ${{ jobs.collect.outputs.distributed_runner }}
      graph_runner:
        description: Runner label for graph category
        value: ${{ jobs.collect.outputs.graph_runner }}
      others_runner:
        description: Runner label for others category
        value: ${{ jobs.collect.outputs.others_runner }}
      core_npu_count:
        description: NPU card count for core
        value: ${{ jobs.collect.outputs.core_npu_count }}
      tensor_npu_count:
        description: NPU card count for tensor
        value: ${{ jobs.collect.outputs.tensor_npu_count }}
      distributed_npu_count:
        description: NPU card count for distributed
        value: ${{ jobs.collect.outputs.distributed_npu_count }}
      graph_npu_count:
        description: NPU card count for graph
        value: ${{ jobs.collect.outputs.graph_npu_count }}
      others_npu_count:
        description: NPU card count for others
        value: ${{ jobs.collect.outputs.others_npu_count }}
      core_devices_per_proc:
        description: Devices per proc for core
        value: ${{ jobs.collect.outputs.core_devices_per_proc }}
      tensor_devices_per_proc:
        description: Devices per proc for tensor
        value: ${{ jobs.collect.outputs.tensor_devices_per_proc }}
      distributed_devices_per_proc:
        description: Devices per proc for distributed
        value: ${{ jobs.collect.outputs.distributed_devices_per_proc }}
      graph_devices_per_proc:
        description: Devices per proc for graph
        value: ${{ jobs.collect.outputs.graph_devices_per_proc }}
      others_devices_per_proc:
        description: Devices per proc for others
        value: ${{ jobs.collect.outputs.others_devices_per_proc }}
      has_core:
        description: Whether core cases exist
        value: ${{ jobs.collect.outputs.has_core }}
      has_tensor:
        description: Whether tensor cases exist
        value: ${{ jobs.collect.outputs.has_tensor }}
      has_distributed:
        description: Whether distributed cases exist
        value: ${{ jobs.collect.outputs.has_distributed }}
      has_graph:
        description: Whether graph cases exist
        value: ${{ jobs.collect.outputs.has_graph }}
      has_others:
        description: Whether others cases exist
        value: ${{ jobs.collect.outputs.has_others }}

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      core_matrix: ${{ steps.build_matrix.outputs.core_matrix }}
      tensor_matrix: ${{ steps.build_matrix.outputs.tensor_matrix }}
      distributed_matrix: ${{ steps.build_matrix.outputs.distributed_matrix }}
      graph_matrix: ${{ steps.build_matrix.outputs.graph_matrix }}
      others_matrix: ${{ steps.build_matrix.outputs.others_matrix }}
      core_num_shards: ${{ steps.build_matrix.outputs.core_num_shards }}
      tensor_num_shards: ${{ steps.build_matrix.outputs.tensor_num_shards }}
      distributed_num_shards: ${{ steps.build_matrix.outputs.distributed_num_shards }}
      graph_num_shards: ${{ steps.build_matrix.outputs.graph_num_shards }}
      others_num_shards: ${{ steps.build_matrix.outputs.others_num_shards }}
      core_runner: ${{ steps.build_matrix.outputs.core_runner }}
      tensor_runner: ${{ steps.build_matrix.outputs.tensor_runner }}
      distributed_runner: ${{ steps.build_matrix.outputs.distributed_runner }}
      graph_runner: ${{ steps.build_matrix.outputs.graph_runner }}
      others_runner: ${{ steps.build_matrix.outputs.others_runner }}
      core_npu_count: ${{ steps.build_matrix.outputs.core_npu_count }}
      tensor_npu_count: ${{ steps.build_matrix.outputs.tensor_npu_count }}
      distributed_npu_count: ${{ steps.build_matrix.outputs.distributed_npu_count }}
      graph_npu_count: ${{ steps.build_matrix.outputs.graph_npu_count }}
      others_npu_count: ${{ steps.build_matrix.outputs.others_npu_count }}
      core_devices_per_proc: ${{ steps.build_matrix.outputs.core_devices_per_proc }}
      tensor_devices_per_proc: ${{ steps.build_matrix.outputs.tensor_devices_per_proc }}
      distributed_devices_per_proc: ${{ steps.build_matrix.outputs.distributed_devices_per_proc }}
      graph_devices_per_proc: ${{ steps.build_matrix.outputs.graph_devices_per_proc }}
      others_devices_per_proc: ${{ steps.build_matrix.outputs.others_devices_per_proc }}
      has_core: ${{ steps.collect.outputs.has_core }}
      has_tensor: ${{ steps.collect.outputs.has_tensor }}
      has_distributed: ${{ steps.collect.outputs.has_distributed }}
      has_graph: ${{ steps.collect.outputs.has_graph }}
      has_others: ${{ steps.collect.outputs.has_others }}
    steps:
      - name: Authenticate to Huawei Cloud
        uses: huaweicloud/auth-action@v1.1.0
        with:
          access_key_id: ${{ secrets.ACCESSKEY }}
          secret_access_key: ${{ secrets.SECRETACCESSKEY }}
          region: ap-southeast-1

      - name: Compute SHAs
        id: sha
        run: |
          UPSTREAM_SHORT="${{ inputs.resolved_short }}"
          echo "source_tarball=pytorch-source-${UPSTREAM_SHORT}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Download PyTorch source from OBS
        uses: huaweicloud/obs-helper@v1.0.1
        with:
          region: ap-southeast-1
          bucket_name: pytorch-ci-cache
          local_file_path: ./${{ steps.sha.outputs.source_tarball }}
          obs_file_path: 7day-cache/${{ steps.sha.outputs.source_tarball }}
          operation_type: download

      - name: Extract PyTorch source
        run: |
          tar -xzf ${{ steps.sha.outputs.source_tarball }}
          rm ${{ steps.sha.outputs.source_tarball }}
          echo "PyTorch source extracted: $(du -sh pytorch/ | cut -f1)"

      - name: Checkout CI scripts
        uses: actions/checkout@v6
        with:
          path: ci-scripts
          ref: ci-test

      - name: Discover and shard test files
        id: collect
        run: |
          export PYTHONPATH="${GITHUB_WORKSPACE}/ci-scripts/.github/scripts/v3:${PYTHONPATH}"

          python3 ${GITHUB_WORKSPACE}/ci-scripts/.github/scripts/v3/shard_test_files.py \
            --test-dir ${GITHUB_WORKSPACE}/pytorch/test \
            --categories-config ${GITHUB_WORKSPACE}/ci-scripts/${{ inputs.classification_config }} \
            --output-dir ${GITHUB_WORKSPACE}/cases-shards

          echo "=== Generated shard files ==="
          ls -la ${GITHUB_WORKSPACE}/cases-shards/

          echo "=== Collection summary ==="
          cat ${GITHUB_WORKSPACE}/cases-shards/cases_collection_summary.json

          # Read has_* from summary
          python3 -c "
          import json
          d = json.load(open('${GITHUB_WORKSPACE}/cases-shards/cases_collection_summary.json'))
          cats = d.get('categories', {})
          for cat in ['core','tensor','distributed','graph','others']:
              cat_data = cats.get(cat, {})
              has = 'true' if cat_data.get('total_files', 0) > 0 else 'false'
              print(f'has_{cat}={has}')
          " >> "$GITHUB_OUTPUT"

      - name: Build shard matrices and per-category params
        id: build_matrix
        run: |
          python3 -c "
          import json
          d = json.load(open('${GITHUB_WORKSPACE}/cases-shards/cases_collection_summary.json'))
          cats = d.get('categories', {})
          for cat in ['core','tensor','distributed','graph','others']:
              cat_data = cats.get(cat, {})
              n = cat_data.get('num_shards', 0)
              runner = cat_data.get('runner', 'linux-aarch64-a3-8')
              npu_count = str(cat_data.get('npu_count', 8))
              devices_per_proc = str(cat_data.get('devices_per_proc', 1))
              if n > 0:
                  matrix = json.dumps(list(range(1, n + 1)))
              else:
                  matrix = '[]'
              print(f'{cat}_matrix={matrix}')
              print(f'{cat}_num_shards={n}')
              print(f'{cat}_runner={runner}')
              print(f'{cat}_npu_count={npu_count}')
              print(f'{cat}_devices_per_proc={devices_per_proc}')
          " >> "$GITHUB_OUTPUT"

      - name: Upload cases shard JSONs
        uses: actions/upload-artifact@v4
        with:
          name: cases-shards-v3
          path: cases-shards/
          retention-days: 7
