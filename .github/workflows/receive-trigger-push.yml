name: Receive Trigger Push

on:
  workflow_call:
    inputs:
      event_type:
        required: true
        type: string
        description: Event type from repository_dispatch (push)
      payload:
        required: true
        type: string
        description: Full client_payload as a JSON string

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Extract push parameters from payload
        id: extract
        env:
          PAYLOAD_JSON: ${{ inputs.payload }}
          EVENT_TYPE: ${{ inputs.event_type }}
        run: |
          set -euo pipefail

          # ---- Filter: only accept push events ----
          if [ "${EVENT_TYPE}" != "push" ]; then
            echo "SKIP: event_type is '${EVENT_TYPE}', not 'push'"
            exit 0
          fi

          # ---- Extract push parameters ----
          REF=$(echo "$PAYLOAD_JSON" | jq -r '.payload.ref // empty')
          BEFORE=$(echo "$PAYLOAD_JSON" | jq -r '.payload.before // empty')
          AFTER=$(echo "$PAYLOAD_JSON" | jq -r '.payload.after // empty')
          UPSTREAM_REPO=$(echo "$PAYLOAD_JSON" | jq -r '.payload.repository.full_name // empty')
          PUSHER=$(echo "$PAYLOAD_JSON" | jq -r '.payload.sender.login // empty')
          CREATED=$(echo "$PAYLOAD_JSON" | jq -r '.payload.created // false')
          DELETED=$(echo "$PAYLOAD_JSON" | jq -r '.payload.deleted // false')
          FORCED=$(echo "$PAYLOAD_JSON" | jq -r '.payload.forced // false')
          COMMIT_COUNT=$(echo "$PAYLOAD_JSON" | jq -r '.payload.commits // [] | length')

          echo "=== Push Event ==="
          echo "event_type:     ${EVENT_TYPE}"
          echo "upstream_repo:  ${UPSTREAM_REPO}"
          echo "ref:            ${REF}"
          echo "before:         ${BEFORE}"
          echo "after:          ${AFTER}"
          echo "pusher:         ${PUSHER}"
          echo "created:        ${CREATED}"
          echo "deleted:        ${DELETED}"
          echo "forced:         ${FORCED}"
          echo "commit_count:   ${COMMIT_COUNT}"

          if [ "${COMMIT_COUNT}" != "0" ] && [ "${COMMIT_COUNT}" != "null" ]; then
            echo ""
            echo "=== Commits ==="
            echo "$PAYLOAD_JSON" | jq -r '.payload.commits[] | "  SHA: \(.id[0:12])  msg: \(.message | split("\n")[0])"'
          fi
