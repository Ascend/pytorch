name: Test Execution (v2)

on:
  workflow_call:
    inputs:
      resolved_short:
        required: true
        type: string
        description: Short SHA of upstream PyTorch
      category:
        required: true
        type: string
        description: Test category (core/tensor/distributed/graph/others)
      shard:
        required: false
        type: number
        default: 1
        description: Shard index (1-based)
      num_shards:
        required: false
        type: number
        default: 1
        description: Total number of shards for this category
      runner:
        required: false
        type: string
        default: linux-aarch64-a3-8
        description: Runner label for this category
      npu_count:
        required: false
        type: number
        default: 8
        description: Number of NPU cards (derived from runner label)
      devices_per_proc:
        required: false
        type: number
        default: 1
        description: NPU cards per pytest process

jobs:
  test:
    runs-on: ${{ inputs.runner }}
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        shell: bash
    container:
      image: quay.io/kerer/pytorch:torch-npu-test-aarch64-cann-a3-py3.10-torch-nightly
      options: --network host
    env:
      PIP_INDEX_URL: https://mirrors.huaweicloud.com/repository/pypi/simple
    steps:
      - name: Authenticate to Huawei Cloud
        uses: huaweicloud/auth-action@v1.1.0
        with:
          access_key_id: ${{ secrets.ACCESSKEY }}
          secret_access_key: ${{ secrets.SECRETACCESSKEY }}
          region: ap-southeast-1

      - name: Compute SHAs
        id: sha
        run: |
          UPSTREAM_SHORT="${{ inputs.resolved_short }}"
          echo "source_tarball=pytorch-source-${UPSTREAM_SHORT}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "wheels_tarball=wheels-${UPSTREAM_SHORT}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Download PyTorch source from OBS
        uses: huaweicloud/obs-helper@v1.0.1
        with:
          region: ap-southeast-1
          bucket_name: pytorch-ci-cache
          local_file_path: ./${{ steps.sha.outputs.source_tarball }}
          obs_file_path: 7day-cache/${{ steps.sha.outputs.source_tarball }}
          operation_type: download

      - name: Extract PyTorch source
        run: |
          tar -xzf ${{ steps.sha.outputs.source_tarball }}
          rm ${{ steps.sha.outputs.source_tarball }}
          echo "PyTorch source extracted: $(du -sh pytorch/ | cut -f1)"

      - name: Download wheels from OBS
        uses: huaweicloud/obs-helper@v1.0.1
        with:
          region: ap-southeast-1
          bucket_name: pytorch-ci-cache
          local_file_path: ./${{ steps.sha.outputs.wheels_tarball }}
          obs_file_path: 7day-cache/${{ steps.sha.outputs.wheels_tarball }}
          operation_type: download

      - name: Extract and install wheels
        run: |
          mkdir -p /tmp/wheels
          tar -xzf ${{ steps.sha.outputs.wheels_tarball }} -C /tmp/wheels
          rm ${{ steps.sha.outputs.wheels_tarball }}
          pip install /tmp/wheels/torch-*.whl
          pip install --no-deps /tmp/wheels/torch_npu*.whl

      - name: Checkout CI scripts
        uses: actions/checkout@v6
        with:
          path: ci-scripts
          ref: ci-test

      # ── Single step: discover → classify → shard → execute → parse ─────
      # test-npu.sh imports shard_test_files, classifies files in memory,
      # round-robins them into shards, then calls upstream run_test.py
      # with --include <this shard's files>.
      - name: Run ${{ inputs.category }} shard ${{ inputs.shard }}/${{ inputs.num_shards }} via test-npu.sh
        run: |
          TEST_CONFIG=${{ inputs.category }} \
          SHARD_NUMBER=${{ inputs.shard }} \
          NUM_TEST_SHARDS=${{ inputs.num_shards }} \
          TEST_DIR="${GITHUB_WORKSPACE}/pytorch/test" \
          REPORTS_DIR="${GITHUB_WORKSPACE}/test-reports" \
          PYTHONPATH_BASE="${GITHUB_WORKSPACE}/ci-scripts/.github/scripts/v2" \
          CLASSIFICATION_CONFIG="${GITHUB_WORKSPACE}/ci-scripts/.github/config/nightly_v2_test_whitelist.yml" \
          RUNNER="${{ inputs.runner }}" \
          NPU_COUNT="${{ inputs.npu_count }}" \
          DEVICES_PER_PROC="${{ inputs.devices_per_proc }}" \
          bash "${GITHUB_WORKSPACE}/ci-scripts/.github/scripts/v2/test-npu.sh"

      - name: Parse test results
        id: parse_results
        if: always()
        run: |
          python3 -c "
          import json, os, sys
          prefix_map = {
              'core': 'core',
              'tensor': 'tensor',
              'distributed': 'dist',
              'graph': 'graph',
              'others': 'others',
          }
          prefix = prefix_map.get('${{ inputs.category }}', 'reg')
          shard = ${{ inputs.shard }}
          jsonl_file = f'test-reports/shard_{prefix}-{shard}_cases.jsonl'
          stats = {'passed': 0, 'failed': 0, 'errors': 0, 'skipped': 0, 'total': 0}
          parse_ok = False
          try:
              with open(jsonl_file) as f:
                  first_line = f.readline()
                  d = json.loads(first_line)
              stats['passed'] = d.get('passed', 0)
              stats['failed'] = d.get('failed', 0)
              stats['errors'] = d.get('errors', 0)
              stats['skipped'] = d.get('skipped', 0)
              stats['total'] = d.get('total_cases', 0)
              parse_ok = True
          except Exception as e:
              print(f'Warning: Could not parse results: {e}', file=sys.stderr)
          total_failed = stats['failed'] + stats['errors']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              for k, v in stats.items():
                  f.write(f'{k}={v}\n')
              f.write(f'total_failed={total_failed}\n')
              f.write(f'parse_ok={str(parse_ok).lower()}\n')
          print(f'${{ inputs.category }} shard {shard}: {stats[\"passed\"]} passed, {stats[\"failed\"]} failed, {stats[\"errors\"]} errors, {stats[\"skipped\"]} skipped, {stats[\"total\"]} total')
          "

      - name: Package and upload test reports
        if: always()
        run: |
          # Compress JUnit XML directory
          if [ -d "test-reports/junit_xmls" ]; then
            echo "=== Compressing junit XMLs ==="
            XML_COUNT=$(find test-reports/junit_xmls -type f -name "*.xml" | wc -l)
            echo "Found ${XML_COUNT} XML files"
            tar -czf test-reports/junit_xmls.tar.gz -C test-reports junit_xmls
            rm -rf test-reports/junit_xmls
          fi

          # Collect CANN runtime logs
          CANN_LOG_DIR="/var/log/npu/slog"
          if [ -d "${CANN_LOG_DIR}" ]; then
            echo "=== Collecting CANN runtime logs ==="
            mkdir -p test-reports/cann-logs
            find "${CANN_LOG_DIR}" -name "*.log" -type f 2>/dev/null | while read -r f; do
              rel="${f#${CANN_LOG_DIR}/"}
              mkdir -p "test-reports/cann-logs/$(dirname "${rel}")"
              tail -n 1000 "${f}" > "test-reports/cann-logs/${rel}" 2>/dev/null || true
            done
            CANN_COUNT=$(find test-reports/cann-logs -name "*.log" -type f | wc -l)
            echo "CANN logs collected: ${CANN_COUNT} files"
          fi

          # Compress entire test-reports/ into a single tarball for upload
          TARBALL="test-reports-${{ inputs.category }}-${{ inputs.shard }}.tar.gz"
          tar -czf "${TARBALL}" test-reports/
          echo "Test reports compressed: $(ls -lh "${TARBALL}")"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ inputs.category }}-${{ inputs.shard }}
          path: test-reports-${{ inputs.category }}-${{ inputs.shard }}.tar.gz
          retention-days: 7

      # ── Failure diagnostics: collect all logs that help root-cause NPU issues ──
      - name: Collect diagnostics on failure
        if: failure()
        run: |
          mkdir -p diagnostics

          # 1. run_test.py execution log (stdout + stderr)
          cp /tmp/test_npu_${{ inputs.category }}_${{ inputs.shard }}.log diagnostics/ 2>/dev/null || true

          # 2. File discovery log (which files were selected for this shard)
          cp /tmp/test_npu_discover_${{ inputs.category }}_${{ inputs.shard }}.log diagnostics/ 2>/dev/null || true

          # 3. NPU device snapshot (device health at time of failure)
          source /usr/local/Ascend/cann/set_env.sh 2>/dev/null || true
          npu-smi info > diagnostics/npu-smi-info.log 2>&1 || true

          # 4. dmesg tail (kernel-level errors: OOM kills, driver panics, PCIe faults)
          dmesg | tail -n 200 > diagnostics/dmesg-tail.log 2>/dev/null || true

          tar -czf diagnostics-${{ inputs.category }}-${{ inputs.shard }}.tar.gz diagnostics/
          echo "Diagnostics compressed: $(ls -lh diagnostics-${{ inputs.category }}-${{ inputs.shard }}.tar.gz)"

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ inputs.category }}-${{ inputs.shard }}
          path: diagnostics-${{ inputs.category }}-${{ inputs.shard }}.tar.gz
          retention-days: 7
