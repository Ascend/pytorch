name: PyTorch CI Trigger Manual

run-name: >-
  PyTorch CI Trigger Manual -
  ${{ format('pytorch@{0} + torch-npu@{1}', inputs.upstream_ref || 'main', inputs.torch_npu_ref || 'master') }}

# Manual full pipeline: build the latest pytorch/pytorch (main) and
# Ascend/pytorch (master, torch_npu) and run a full validation pass
# through the same reusable workflows as Receive Trigger
# (receive-trigger.yml), but with manual-only parameters: nightly-style
# full-scan categorization, a passed-testcases intersection as the case
# filter, and the merged-batch executor. NO upstream reporting:
# report_to_upstream is false everywhere, so every
# pytorch/test-infra cross-repo-ci-relay-callback step is skipped
# (a manual run has no upstream PR context to report against).
#
# The reusable workflows are pinned to @ci-test on purpose:
#   - the _test*.yml chain only exists on the ci-test branch;
#   - receive-trigger.yml itself lives on ci-test, so this pipeline
#     executes the exact same implementation as the PR-triggered one;
#   - this file modifies nothing — it only adds an independent entry
#     point, so the receive-trigger flow is untouched.
#
# Deployment note: workflow_dispatch requires this file to exist on the
# DEFAULT branch (master) before it shows up in the "Run workflow"
# dropdown; the push trigger below works from any branch and is the
# primary trigger while the file lives only on ci-test. Keep the copies
# on master and ci-test identical — the @ci-test pinning makes the file
# branch-independent.
#
# Concurrency is a dedicated group, never shared with the
# receive-trigger `ci-<repo>-<PR>` groups: manual runs neither cancel
# nor get canceled by PR-triggered runs, and repeated manual triggers
# queue behind each other instead of canceling an in-flight run.

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        required: false
        type: string
        default: 'main'
        description: 'pytorch/pytorch ref to build (branch, tag, or commit SHA). Default: latest main.'
      torch_npu_ref:
        required: false
        type: string
        default: 'master'
        description: 'Ascend/pytorch (torch_npu) ref to build. Default: latest master.'
  # Push trigger: fires when this workflow file itself OR the passed-case
  # list changes on the ci-test branch (path filter). The passed-case list
  # is included on purpose: it IS this pipeline's case filter (collected
  # cases are intersected with it), so removing a failing case from the
  # list and pushing is the git-only way to validate the updated case set.
  # The PR skip list is deliberately NOT here: this pipeline no longer
  # consumes it (the PR-gated flow does). All other routine ci-test pushes
  # never start multi-hour runs. Touching either file and pushing is the
  # git-only way to trigger a run — needed because workflow_dispatch
  # requires the file on the default branch (master), while push events
  # work from any branch. inputs.* are empty on push, so the || fallbacks
  # default the build to pytorch@main + torch-npu@master.
  push:
    branches: [ci-test]
    paths:
      - '.github/workflows/pytorch_ci_trigger_manual.yml'
      - '.github/config/privateuse1_npu_passed_testcases.json'

concurrency:
  group: manual-latest-build-test
  cancel-in-progress: false

jobs:
  build:
    uses: Ascend/pytorch/.github/workflows/_build.yml@ci-test
    secrets: inherit
    with:
      upstream_repo: pytorch/pytorch
      # || fallbacks guard against a cleared/empty input from the UI.
      upstream_ref: ${{ inputs.upstream_ref || 'main' }}
      torch_npu_repo: Ascend/pytorch
      torch_npu_ref: ${{ inputs.torch_npu_ref || 'master' }}
      docker_image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-test-aarch64-cann-a3-py3.11-torch-master-cann9.2.0-20260910200430-202610100359-bd67211b
      # Manual run, no upstream PR context — never report to the
      # upstream dashboard (skips all cross-repo-ci-relay-callback steps).
      report_to_upstream: false
      runner_label: 'linux-aarch64-cpu-24'
      max_jobs: '23'

  test:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    uses: Ascend/pytorch/.github/workflows/_test.yml@ci-test
    secrets: inherit
    with:
      resolved_short: ${{ needs.build.outputs.resolved_short }}
      torch_npu_short: ${{ needs.build.outputs.torch_npu_short }}
      wheels_tarball: ${{ needs.build.outputs.wheels_tarball }}
      # Categorization: nightly-style full scan (all test_*.py files,
      # 3-pass classification via nightly_test_categories.yml: files >
      # paths > others). Per-category workers/runner labels flow from the
      # config into the shard matrix automatically.
      case_paths_config: .github/config/nightly_test_categories.yml
      full_scan: true
      # Case-level intersection: only cases listed in the passed-testcases
      # file are executed. The file holds historically PASSED nodeids;
      # when a case starts failing, remove its nodeid from the file (and
      # commit) instead of maintaining a skip list.
      case_whitelist: .github/config/privateuse1_npu_passed_testcases.json
      # Shard thresholds aligned with the nightly pipeline.
      shard_threshold_regular: 50000
      shard_threshold_distributed: 3000
      docker_image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-test-aarch64-cann-a3-py3.11-torch-master-cann9.2.0-20260910200430-202610100359-bd67211b
      # Same as build: no upstream reporting for manual runs.
      report_to_upstream: false
      # Keep hw_classification/device_env in sync with the passed list's
      # nodeid form (ACCELERATOR + privateuse1 -> *PRIVATEUSE1 classes);
      # the intersection only matches same-shape nodeids.
      hw_classification: 'ACCELERATOR'
      device_env: 'privateuse1'
      # Manual runs use the merged-batch executor (one pytest.main() per
      # same-file batch of max 100 cases, batch-level junit XML). No
      # poisoner checks / worker restarts: a crashed or hung batch marks
      # all its cases as error — acceptable here because the whitelist
      # keeps failures rare and every failure gets a manual root cause.
      # PR-gated flows (receive-trigger) keep the default per-case runner.
      batch_execution: true
      runner_label: 'linux-aarch64-a3-800i-2-cn12-001'
