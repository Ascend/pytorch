name: PyTorch CI Trigger PR

run-name: >-
  PyTorch CI Trigger PR -
  ${{
    format('PR {0}', github.event.client_payload.payload.pull_request.number)
  }}
on:
  repository_dispatch:
    types: [pull_request]

# For pull_request events the PR number is unique per PR, so it serves
# as the concurrency key — repeated triggers for the same PR cancel each
# other. Events without a PR number fall back to run_id (unique, never
# cancels).
concurrency:
  group: >-
    ci-${{ github.event.client_payload.payload.repository.full_name }}-${{
    github.event.client_payload.payload.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write  # Required by report-ci-result to obtain an OIDC token

jobs:
  forward:
    uses: Ascend/pytorch/.github/workflows/receive-trigger.yml@ci-test
    secrets: inherit
    with:
      event_type: ${{ github.event.client_payload.event_type }}
      payload: ${{ toJSON(github.event.client_payload) }}
