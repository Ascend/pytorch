name: NPU SIGSEGV Repro

# Reproduction + forensics harness for the intermittent test_foreach worker
# SIGSEGV (see .github/scripts/sigsegv_stress.py docstring for background).
#
# Replays a case batch from a source run through the exact CI execution path
# (run_npu_test_shard.py --worker, pytest.main() per case, one NPU device per
# batch) in a loop and captures core dumps / gdb backtraces / faulthandler
# output / CANN plog on every worker death by signal.
#
# NOTE on images: the container image below is the current ci-test test image.
# The original crashes (runs 34837447197 / 34841388595) happened on:
#   swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-test-aarch64-cann-a3-py3.10-torch-master-202608290444-503883d4
# Edit the container image to that value to reproduce against the original
# CANN build. A clean run on the new image does NOT prove the crash is fixed
# until the old image also stops crashing (wheels/image pairing matters).
#
# Trigger: push to ci-test touching this workflow, the harness, or the runner
# script. Edit the REPRO_* env defaults below and push to run again with
# different parameters.

on:
  push:
    branches:
      - ci-test
    paths:
      - '.github/workflows/sigsegv-repro.yml'
      - '.github/scripts/sigsegv_stress.py'
      - '.github/scripts/run_npu_test_shard.py'

env:
  # Default repro parameters (edit + push to change)
  REPRO_SOURCE_RUN_ID: '34837447197'   # run providing wheels/source/cases artifacts (the crashed run)
  REPRO_CASE_RANGE: '10857-10956'      # 1-based case_idx range from the tensor shard replayed as one batch
  REPRO_DEVICE: '5'                    # NPU device id pinned for all workers
  REPRO_WORKERS: '4'                   # concurrent workers per wave (CI density is 32/8 = 4)
  REPRO_MODES: 'worker_batch,pair_case,subprocess_per_case'
  REPRO_MAX_TOTAL_MINUTES: '120'       # overall stress budget in minutes (shared by all modes)
  REPRO_STOP_AFTER_CRASHES: '3'        # crash samples to collect per mode before moving on (0 = full budget)
  REPRO_PAIR_SUSPECT: '10857-10858'    # suspect pair (clamp_min + clone: ForeachMaximumList chain)
  REPRO_PAIR_CONTROL: '10859-10860'    # control pair (cos + cosh)
  REPRO_ALLOW_CORE_PATTERN: 'true'     # allow writing /proc/sys/kernel/core_pattern (restored in the final step)

concurrency:
  group: sigsegv-repro
  cancel-in-progress: false

permissions:
  actions: read  # cross-run artifact download
  contents: read

jobs:
  repro:
    runs-on: linux-aarch64-a3-800i-8-cn12-001
    timeout-minutes: 150
    container:
      # Current ci-test test image; see NOTE above for the original-crash image
      image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-test-aarch64-cann-a3-py3.10-torch-master-cann9.2.0-20260910200430-202609140905-0ba22e2b
      options: --network host
    env:
      PIP_INDEX_URL: https://mirrors.huaweicloud.com/repository/pypi/simple
      ASCEND_PROCESS_LOG_PATH: /root/ascend/log/plog
      ASCEND_GLOBAL_LOG_LEVEL: '3'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v6
        with:
          # Checkout to a subdirectory (like the real CI test flow) so the
          # workspace root does NOT contain the torch_npu/ source tree:
          # python -c puts cwd at sys.path[0], and the unbuilt source package
          # would shadow the installed torch_npu wheel (no torch_npu._C).
          path: ci-scripts

      - name: Download wheels from source run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.REPRO_SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          pattern: packages-pytorch-*
          path: downloads/
          merge-multiple: true

      - name: Download pytorch source from source run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.REPRO_SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          pattern: pytorch-source-*
          path: downloads/
          merge-multiple: true

      - name: Download cases shards from source run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.REPRO_SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          pattern: cases-shards
          path: downloads/
          merge-multiple: true

      - name: Extract source and install wheels
        run: |
          set -e
          ls -lh downloads/ | tee downloads-listing.txt
          ls -lh downloads/*.whl | head -20
          tar -xzf downloads/pytorch-source-*.tar.gz
          pip install downloads/torch-*.whl
          pip install --no-deps downloads/torch_npu*.whl
          pip install --no-deps downloads/torchvision-*.whl || echo "WARN: torchvision wheel not found"
          # torch_npu._C needs CANN libs (libhccl.so): source the CANN env
          # before the import check, like the later steps do.
          source /usr/local/Ascend/cann/set_env.sh 2>/dev/null || true
          source /usr/local/Ascend/nnal/atb/set_env.sh 2>/dev/null || true
          export LD_LIBRARY_PATH=/opt/conda/envs/py_3.10/lib:$LD_LIBRARY_PATH
          python -c "import torch, torch_npu; print('torch', torch.__version__); print('torch_npu', torch_npu.__version__)"

      - name: Snapshot environment
        run: |
          source /usr/local/Ascend/cann/set_env.sh 2>/dev/null || true
          source /usr/local/Ascend/nnal/atb/set_env.sh 2>/dev/null || true
          export LD_LIBRARY_PATH=/opt/conda/envs/py_3.10/lib:$LD_LIBRARY_PATH
          { npu-smi info; cat /usr/local/Ascend/cann/version.info 2>/dev/null; } | tee repro-env.txt || true
          cp downloads-listing.txt repro-downloads-listing.txt 2>/dev/null || true

      - name: Install gdb (best-effort)
        run: apt-get update -qq && apt-get install -y -qq gdb
        continue-on-error: true

      - name: Configure core dumps
        run: |
          mkdir -p "$GITHUB_WORKSPACE/repro-run/cores"
          cat /proc/sys/kernel/core_pattern | tee repro-run/core_pattern.orig
          if [ "${{ env.REPRO_ALLOW_CORE_PATTERN }}" = "true" ] && \
             echo "$GITHUB_WORKSPACE/repro-run/cores/core.%p.%t" > /proc/sys/kernel/core_pattern 2>/dev/null; then
            echo "workspace" | tee repro-run/core_pattern.status
          else
            echo "unwritable-or-disabled (faulthandler-only mode)" | tee repro-run/core_pattern.status
          fi
          ulimit -c || true

      - name: Run stress harness
        run: |
          source /usr/local/Ascend/cann/set_env.sh 2>/dev/null || true
          source /usr/local/Ascend/nnal/atb/set_env.sh 2>/dev/null || true
          export LD_LIBRARY_PATH=/opt/conda/envs/py_3.10/lib:$LD_LIBRARY_PATH
          # ulimit must be set in the shell that parents the workers
          ulimit -c unlimited
          python ci-scripts/.github/scripts/sigsegv_stress.py \
            --cases-json downloads/tensor_cases_shard_1.json \
            --case-range "${{ env.REPRO_CASE_RANGE }}" \
            --runner-script ci-scripts/.github/scripts/run_npu_test_shard.py \
            --test-dir pytorch/test \
            --workdir repro-run \
            --device "${{ env.REPRO_DEVICE }}" \
            --workers "${{ env.REPRO_WORKERS }}" \
            --modes "${{ env.REPRO_MODES }}" \
            --max-total-minutes "${{ env.REPRO_MAX_TOTAL_MINUTES }}" \
            --stop-after-crashes "${{ env.REPRO_STOP_AFTER_CRASHES }}" \
            --pair-suspect "${{ env.REPRO_PAIR_SUSPECT }}" \
            --pair-control "${{ env.REPRO_PAIR_CONTROL }}" \
            2>&1 | tee repro-run/harness.log

      - name: Summarize
        if: always()
        run: |
          if [ -f repro-run/stats.jsonl ]; then
            python ci-scripts/.github/scripts/sigsegv_stress.py --summarize-only --workdir repro-run | tee -a repro-run/harness.log
          else
            echo "harness produced no stats (see harness.log / ENV_ABORT.txt)"
          fi

      - name: Upload forensics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sigsegv-repro-${{ github.run_id }}
          path: |
            repro-run/stats.json
            repro-run/stats.jsonl
            repro-run/summary.md
            repro-run/harness.log
            repro-run/core_pattern.orig
            repro-run/core_pattern.status
            repro-run/ENV_ABORT.txt
            repro-run/crash-forensics/
            repro-env.txt
            repro-downloads-listing.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Restore core_pattern
        if: always()
        run: |
          if [ -f repro-run/core_pattern.orig ]; then
            cat repro-run/core_pattern.orig > /proc/sys/kernel/core_pattern 2>/dev/null || true
            echo "core_pattern restored"
          fi
