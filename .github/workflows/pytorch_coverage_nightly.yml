name: PyTorch Coverage Nightly
on:
  push:
    branches: [ci-test]  # 临时调试触发器：仅对 ci-test 分支生效，master 不受影响；调试完成后删除本段
    # Only fire when the coverage pipeline itself changes, so teammates
    # pushing code commits to ci-test don't trigger full coverage runs.
    paths:
      - '.github/workflows/_pytorch_coverage.yml'
      - '.github/workflows/pytorch_coverage_nightly.yml'
      - '.github/scripts/run_pytorch_coverage.sh'
  schedule:
    - cron: '0 19 * * *'  # UTC 19:00 = Beijing 03:00, daily
  workflow_dispatch:
    inputs:
      resolved_short:
        description: 'Built pytorch commit short SHA (first 10 chars). Empty = resolve latest commit of upstream_ref'
        required: false
        default: ''
        type: string
      upstream_ref:
        description: 'pytorch/pytorch ref (used when resolved_short is empty)'
        required: false
        default: 'main'
        type: string
      categories:
        description: 'Comma-separated categories to run (e.g. core,tensor). Empty = all 5 categories'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.event_name == 'push' && format('coverage-debug-{0}', github.run_id) || 'pytorch-coverage-nightly' }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  coverage:
    uses: Ascend/pytorch/.github/workflows/_pytorch_coverage.yml@ci-test
    secrets: inherit
    with:
      resolved_short: ${{ inputs.resolved_short }}
      upstream_ref: ${{ inputs.upstream_ref }}
      categories: ${{ inputs.categories }}
