name: Build torch_npu wheel

on:
  workflow_call:
    inputs:
      PYTHON_VERSION:
        description: Python version
        required: false
        type: string
        default: "3.10"
      PYTORCH_BRANCH:
        description: PyTorch source branch
        required: false
        type: string
      MAX_JOBS:
        description: C++ compile parallel jobs
        required: false
        type: string
      DOCKER_IMAGE:
        description: Docker image for building
        required: true
        type: string
      CONTAINER_OPTIONS:
        description: Container options
        required: false
        type: string
        default: ""
      # 调度标签 (变量化): 编译任务默认调度到编译机
      RUNNER_LABEL:
        required: false
        type: string
        default: "linux-amd64-a5-2"

jobs:
  build:
    name: build
    runs-on: ${{ inputs.RUNNER_LABEL }}
    container:
      image: ${{ inputs.DOCKER_IMAGE }}
      options: ${{ inputs.CONTAINER_OPTIONS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure git safe directory
        shell: bash
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Write build environment info
        run: |
          echo "=== Build Environment Info ===" > build_msg.txt
          echo "Python Version:" >> build_msg.txt
          python3.10 --version >> build_msg.txt 2>&1
          echo "CMake Version:" >> build_msg.txt
          cmake3 --version 2>/dev/null | head -1 >> build_msg.txt || cmake --version 2>/dev/null | head -1 >> build_msg.txt
          echo "GCC Version:" >> build_msg.txt
          gcc --version | head -1 >> build_msg.txt
          echo "ccache Version:" >> build_msg.txt
          ccache --version | head -1 >> build_msg.txt
          echo "PyTorch Version:" >> build_msg.txt
          python3.10 -c "import torch; print(torch.__version__)" >> build_msg.txt 2>&1 || echo "not installed yet" >> build_msg.txt
          echo "=== Build Info End ===" >> build_msg.txt

      - name: Install PyTorch from official website
        run: |
          python3.10 .github/scripts/a5-torch-npu-test/scripts/install_pytorch_from_official.py \
            --arch x86_64 \
            --python-tag cp310 \
            --variant cpu \
            --python-exe python3.10 \
            --branch "${{ inputs.PYTORCH_BRANCH }}"

      - name: Verify PyTorch installation
        run: |
          python3.10 -c "
          import torch
          print(f'PyTorch version: {torch.__version__}')
          assert torch.__version__, 'PyTorch installation failed'
          "

      - name: Configure ccache
        env:
          CCACHE_DIR: "/ccache"
        run: |
          ccache -M 10G
          ccache -z || true

      - name: Build torch_npu wheel
        shell: bash
        env:
          CC: "ccache gcc"
          CXX: "ccache g++"
          CCACHE_DIR: "/ccache"
          CCACHE_COMPRESS: "1"
          CCACHE_MAXSIZE: "10G"
          MAX_JOBS: ${{ inputs.MAX_JOBS }}
          DISABLE_INSTALL_TORCHAIR: "FALSE"
          BUILD_WITHOUT_SHA: "1"
        run: |
          export CCACHE_BASEDIR="${GITHUB_WORKSPACE}"
          # release/2.15 -> 2.15.0 (build.sh --torch= expects X.Y.Z)
          TORCH_VER=$(echo "${{ inputs.PYTORCH_BRANCH }}" | sed 's|.*/||')
          if echo "${TORCH_VER}" | grep -Eq '^[0-9]+\.[0-9]+$'; then
            TORCH_VER="${TORCH_VER}.0"
          fi
          bash ci/build.sh --python="3.10" --torch="${TORCH_VER}" 2>&1 | tee "${GITHUB_WORKSPACE}/build_torch_npu.log"
          BUILD_STATUS=${PIPESTATUS[0]}
          ccache -s 2>&1
          if [ ${BUILD_STATUS} -ne 0 ]; then
            echo "===== Build failed (exit ${BUILD_STATUS}), error lines ====="
            grep -nE "error:|FAILED:|fatal error:|Killed|cc1plus" "${GITHUB_WORKSPACE}/build_torch_npu.log" | tail -n 120 || true
            echo "===== tail of build log ====="
            tail -n 80 "${GITHUB_WORKSPACE}/build_torch_npu.log"
            echo "===== end ====="
            exit ${BUILD_STATUS}
          fi
          WHL=$(ls dist/*.whl 2>/dev/null | head -1)
          echo "Build succeeded: ${WHL}"
          echo "Wheel: ${WHL##*/}" >> build_msg.txt

      - name: Upload build log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-torch-npu-log
          path: build_torch_npu.log
          retention-days: 14
          overwrite: true

      - name: Upload torch-npu wheel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: torch-npu-wheel
          path: "dist/*.whl"
          retention-days: 60
          overwrite: true

      - name: Upload build_msg.txt as artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-msg
          path: build_msg.txt
          retention-days: 60
          overwrite: true