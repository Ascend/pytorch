name: Test Report

on:
  workflow_call:
    inputs:
      core_matrix:
        required: false
        type: string
        default: '[]'
        description: Core shard matrix JSON
      tensor_matrix:
        required: false
        type: string
        default: '[]'
        description: Tensor shard matrix JSON
      distributed_matrix:
        required: false
        type: string
        default: '[]'
        description: Distributed shard matrix JSON
      graph_matrix:
        required: false
        type: string
        default: '[]'
        description: Graph shard matrix JSON
      others_matrix:
        required: false
        type: string
        default: '[]'
        description: Others shard matrix JSON
      docker_image:
        required: false
        type: string
        default: 'quay.io/kerer/pytorch:torch-npu-test-aarch64-cann-a3-py3.10-torch-nightly'
        description: Docker image used for test execution
      report_to_upstream:
        required: false
        type: boolean
        default: false
        description: Whether to report test status to upstream dashboard

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Report test in_progress
        if: ${{ inputs.report_to_upstream }}
        continue-on-error: true
        uses: pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback@fb6a1fce9cf9689c395708258317daca817281dc
        with:
          status: in_progress
          job-name: test

      - name: Checkout this repo for report scripts
        uses: actions/checkout@v6
        with:
          ref: ci-test

      - name: Download core shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: test-reports-core-*
          path: all-test-reports
          merge-multiple: true
        continue-on-error: true

      - name: Download tensor shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: test-reports-tensor-*
          path: all-test-reports
          merge-multiple: true
        continue-on-error: true

      - name: Download distributed shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: test-reports-dist-*
          path: all-test-reports
          merge-multiple: true
        continue-on-error: true

      - name: Download graph shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: test-reports-graph-*
          path: all-test-reports
          merge-multiple: true
        continue-on-error: true

      - name: Download others shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: test-reports-others-*
          path: all-test-reports
          merge-multiple: true
        continue-on-error: true

      - name: Download cases collection summary
        uses: actions/download-artifact@v4
        with:
          name: cases-shards
          path: cases-shards
        continue-on-error: true

      - name: Generate consolidated summary
        id: generate_report
        run: |
          REPORT_MD=npu-full-test-summary.md
          REPORT_JSON=npu-full-test-summary.json

          # Build combined matrix with category prefixes
          COMBINED_MATRIX=$(python3 -c "
          import json
          mats = {
              'core': '${{ inputs.core_matrix }}',
              'tensor': '${{ inputs.tensor_matrix }}',
              'distributed': '${{ inputs.distributed_matrix }}',
              'graph': '${{ inputs.graph_matrix }}',
              'others': '${{ inputs.others_matrix }}',
          }
          pfx = {
              'core': 'core', 'tensor': 'tensor',
              'distributed': 'dist', 'graph': 'graph', 'others': 'others',
          }
          combined = []
          for cat, ms in mats.items():
              for n in json.loads(ms):
                  combined.append(f'{pfx[cat]}-{n}')
          print(json.dumps(combined))
          ")

          echo "Combined matrix: ${COMBINED_MATRIX}"

          python3 .github/scripts/generate_npu_full_test_report.py \
            --reports-root all-test-reports \
            --output-markdown ${REPORT_MD} \
            --output-json ${REPORT_JSON} \
            --pytorch-version "nightly" \
            --torch-npu-whl "source-build" \
            --patch-count "0" \
            --shard-matrix-json "${COMBINED_MATRIX}" \
            --docker-image "${{ inputs.docker_image }}" \
            --runner "linux-aarch64-a3-8 (collect), linux-aarch64-a3-8 (distributed: serial), linux-aarch64-a3-8 (core/tensor/graph/others: 32 workers)" \
            --cases-summary cases-shards/cases_collection_summary.json \
            --cases-by-file-dir cases-shards

          cat ${REPORT_MD} >> $GITHUB_STEP_SUMMARY

          # Extract totals for upstream report
          if [ -f "${REPORT_JSON}" ]; then
            python3 -c "
          import json, os
          with open('${REPORT_JSON}') as f:
              d = json.load(f)
          totals = d.get('totals', {})
          total_failed = totals.get('failed', 0) + totals.get('errors', 0)
          report_total_failed = total_failed + totals.get('timeout', 0)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'passed={totals.get(\"passed\", 0)}\n')
              f.write(f'failed={totals.get(\"failed\", 0)}\n')
              f.write(f'errors={totals.get(\"errors\", 0)}\n')
              f.write(f'skipped={totals.get(\"skipped\", 0)}\n')
              f.write(f'total={totals.get(\"total\", 0)}\n')
              f.write(f'total_failed={total_failed}\n')
              f.write(f'report_total_failed={report_total_failed}\n')
          " || true
          fi

      - name: Upload consolidated summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npu-full-test-summary
          path: |
            npu-full-test-summary.md
            npu-full-test-summary.json
            core_cases_results_by_file.jsonl
            tensor_cases_results_by_file.jsonl
            distributed_cases_results_by_file.jsonl
            graph_cases_results_by_file.jsonl
            others_cases_results_by_file.jsonl
          if-no-files-found: warn
          retention-days: 60

      - name: Report test completed
        if: always() && inputs.report_to_upstream
        continue-on-error: true
        uses: pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback@fb6a1fce9cf9689c395708258317daca817281dc
        with:
          status: completed
          conclusion: ${{ steps.generate_report.outputs.report_total_failed == '0' && 'success' || 'failure' }}
          job-name: test
          test-results: >-
            {
              "passed": ${{ steps.generate_report.outputs.passed }},
              "failed": ${{ steps.generate_report.outputs.report_total_failed }},
              "skipped": ${{ steps.generate_report.outputs.skipped }},
              "total": ${{ steps.generate_report.outputs.total }}
            }
