name: PyTorch CI Whitelist Full Run

run-name: >-
  PyTorch CI Whitelist Full Run -
  ${{ format('pytorch@{0} + torch-npu@{1}', inputs.upstream_ref || 'main', inputs.torch_npu_ref || 'master') }}

# Full-whitelist validation entry: build the latest pytorch/pytorch (main)
# and Ascend/pytorch (master, torch_npu) and execute EVERY case in
# privateuse1_npu_passed_testcases.json through the same reusable
# workflows and the same test mechanism as Receive Trigger
# (receive-trigger.yml): nightly-style full-scan categorization, a
# passed-testcases intersection as the case filter, and the merged-batch
# executor.
#
# The one deliberate difference from Receive Trigger: NO precise-test
# selector. The select job (_precise_test.yml) is not called and
# precise_files stays empty, so collection is a full scan of all
# test_*.py files intersected with the case whitelist — every whitelist
# nodeid that still collects upstream is executed exactly once.
#
# Like the manual pipeline (pytorch_ci_trigger_manual.yml) this run has
# no upstream PR context, so report_to_upstream is false everywhere and
# every pytorch/test-infra cross-repo-ci-relay-callback step is skipped.
#
# The reusable workflows are pinned to @ci-test on purpose (same reasons
# as the manual pipeline):
#   - the _test*.yml chain only exists on the ci-test branch;
#   - this file only adds an independent entry point — receive-trigger
#     and the manual pipeline are untouched.
#
# Deployment note: workflow_dispatch requires this file to exist on the
# DEFAULT branch (master) before it shows up in the "Run workflow"
# dropdown; keep the copies on master and ci-test identical — the
# @ci-test pinning makes the file branch-independent.
#
# Concurrency is a dedicated group, never shared with the manual
# pipeline's manual-latest-build-test or the receive-trigger
# ci-<repo>-<PR> groups: whitelist runs neither cancel nor get canceled
# by other pipelines, and repeated triggers queue behind each other
# instead of canceling an in-flight run.

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        required: false
        type: string
        default: 'main'
        description: 'pytorch/pytorch ref to build (branch, tag, or commit SHA). Default: latest main.'
      torch_npu_ref:
        required: false
        type: string
        default: 'master'
        description: 'Ascend/pytorch (torch_npu) ref to build. Default: latest master.'

concurrency:
  group: whitelist-full-run
  cancel-in-progress: false

jobs:
  build:
    uses: Ascend/pytorch/.github/workflows/_build.yml@ci-test
    secrets: inherit
    with:
      upstream_repo: pytorch/pytorch
      # || fallbacks guard against a cleared/empty input from the UI.
      upstream_ref: ${{ inputs.upstream_ref || 'main' }}
      torch_npu_repo: Ascend/pytorch
      torch_npu_ref: ${{ inputs.torch_npu_ref || 'master' }}
      docker_image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-builder-aarch64-torch-master-202610200103-e0dcc43e
      # Whitelist run, no upstream PR context — never report to the
      # upstream dashboard (skips all cross-repo-ci-relay-callback steps).
      report_to_upstream: false
      runner_label: 'linux-aarch64-cpu-24'
      max_jobs: '23'

  test:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    uses: Ascend/pytorch/.github/workflows/_test.yml@ci-test
    secrets: inherit
    with:
      resolved_short: ${{ needs.build.outputs.resolved_short }}
      torch_npu_short: ${{ needs.build.outputs.torch_npu_short }}
      pytorch_wheels_tarball: ${{ needs.build.outputs.pytorch_wheels_tarball }}
      torchnpu_wheels_tarball: ${{ needs.build.outputs.torchnpu_wheels_tarball }}
      # Categorization: nightly-style full scan (all test_*.py files,
      # 3-pass classification via nightly_test_categories.yml: files >
      # paths > others). Per-category workers/runner labels flow from
      # the config into the shard matrix automatically. precise_files is
      # deliberately NOT set: empty means no precise-test filtering, the
      # case set is the full collection intersected with the whitelist.
      case_paths_config: .github/config/nightly_test_categories.yml
      full_scan: true
      # Case-level intersection: only cases listed in the passed-testcases
      # file are executed. The file holds historically PASSED nodeids;
      # when a case starts failing, remove its nodeid from the file (and
      # commit) instead of maintaining a skip list.
      case_whitelist: .github/config/privateuse1_npu_passed_testcases.json
      # Shard thresholds aligned with the manual/nightly pipelines.
      shard_threshold_regular: 50000
      shard_threshold_distributed: 3000
      docker_image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-test-aarch64-cann-a3-py3.11-torch-master-cann9.2.0-20260910200430-202610160225-8a315d17
      # Same as build: no upstream reporting for whitelist runs.
      report_to_upstream: false
      # Keep hw_classification/device_env in sync with the passed list's
      # nodeid form (ACCELERATOR + privateuse1 -> *PRIVATEUSE1 classes);
      # the intersection only matches same-shape nodeids.
      hw_classification: 'ACCELERATOR'
      device_env: 'privateuse1'
      # Merged-batch executor (one pytest.main() per same-file batch of
      # max 100 cases, batch-level junit XML), same as the manual and
      # receive-trigger pipelines. No poisoner checks / worker restarts:
      # a crashed or hung batch marks all its cases as error —
      # acceptable because the whitelist keeps failures rare and every
      # failure gets a manual root cause.
      batch_execution: true
      runner_label: 'linux-aarch64-a3-800i-2-cn12-001'
