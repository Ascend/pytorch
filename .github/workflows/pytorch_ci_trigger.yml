name: PyTorch CI Trigger

run-name: >-
  PyTorch CI Trigger -
  ${{
    format('Push {0}', github.event.client_payload.payload.after)
  }}
on:
  repository_dispatch:
    types: [push]

# For push events the PR number is only available inside the ref
# (refs/tags/ciflow/trunk/<PR#>), so parse it out for the concurrency
# group; fall back to run_id when the ref does not match (never cancels).
concurrency:
  group: >-
    ci-${{ github.event.client_payload.payload.repository.full_name }}-${{
    github.event.client_payload.payload.ref
    && replace(github.event.client_payload.payload.ref, 'refs/tags/ciflow/trunk/', '')
    || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write  # Required by report-ci-result to obtain an OIDC token

jobs:
  forward:
    uses: Ascend/pytorch/.github/workflows/receive-trigger.yml@ci-test
    secrets: inherit
    with:
      event_type: ${{ github.event.client_payload.event_type }}
      payload: ${{ toJSON(github.event.client_payload) }}
