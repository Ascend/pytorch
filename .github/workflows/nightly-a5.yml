name: Nightly Build and Test A5 (All)

on:
  push:
    branches:
      - ci-test
    paths:
      - '.github/workflows/nightly-a5.yml'
      - '.github/config/nightly_test_categories_a5.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_nightly_build.yml
    secrets: inherit
    with:
      upstream_repo: pytorch/pytorch
      upstream_ref: main
      torch_npu_repo: Ascend/pytorch
      torch_npu_ref: master
      # Build in the dedicated x86_64 builder image; the wheel-repair
      # step in _nightly_build.yml vendors its private libs (MKL from
      # /opt/intel) into the torch wheel so it stays self-contained in
      # the A5 test image.
      docker_image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-builder-x86_64-torch-master-202610160227-8a315d17
      report_to_upstream: false
      runner_label: 'linux-amd64-a5-2'
      max_jobs: '23'

  test:
    needs: build
    uses: ./.github/workflows/_nightly_test.yml
    secrets: inherit
    with:
      resolved_short: ${{ needs.build.outputs.resolved_short }}
      resolved_sha: ${{ needs.build.outputs.resolved_sha }}
      wheels_tarball: ${{ needs.build.outputs.wheels_tarball }}
      upstream_repo: pytorch/pytorch
      torch_npu_short: ${{ needs.build.outputs.torch_npu_short }}
      case_paths_config: .github/config/nightly_test_categories_a5.yml
      docker_image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-test-x86_64-cann-a5-py3.11-torch-master-cann9.2.0-20260910200430-202610160226-8a315d17
      report_to_upstream: false
      hw_classification: ''
      full_scan: true
      device_env: 'privateuse1,cpu'
      runner_label: 'linux-amd64-a5-2'
      test_max_parallel: 3
      # Rewrites the installed triton-ascend backend's hardcoded
      # -std=c++17 to -std=c++20 and prebuilds npu_utils.so once per
      # shard container, working around the deterministic npu_utils
      # build failure against torch master's C++20-only ATen headers.
      # This image is the original hotspot: run 38846980367 graph-2
      # alone showed 549 compile failures + 34 per-case timeouts +
      # ~55h swallowed compile tax. Validated on nightly-a3 run
      # 39538533016: npu_utils failures -> 0, no side effects.
      # See the Patch triton cxx20 step in _nightly_test-category.yml.
      patch_triton_cxx20: true

