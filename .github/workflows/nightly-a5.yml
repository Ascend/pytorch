name: Nightly Build and Test A5 (All)
# 触发方式: 推送到 ci-test 且改动本文件，或在 Actions 页面 workflow_dispatch 手动触发。

on:
  push:
    branches:
      - ci-test
    paths:
      - '.github/workflows/nightly-a5.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_nightly_build.yml
    secrets: inherit
    with:
      upstream_repo: pytorch/pytorch
      upstream_ref: main
      torch_npu_repo: Ascend/pytorch
      torch_npu_ref: master
      # Build in the dedicated x86_64 builder image. The build step
      # statically links MKL from the image's /opt/intel (mkl-static
      # layout, same wiring as upstream build_wheel.py), so the x86_64
      # torch wheel matches upstream CPU wheels; the wheel-repair step
      # then vendors libgomp and sets $ORIGIN RPATHs so the wheel stays
      # self-contained in the A5 test image.
      docker_image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-builder-x86_64-torch-master-202610160227-8a315d17
      report_to_upstream: false
      runner_label: 'linux-amd64-a5-2'
      max_jobs: '23'
      # Wheels cache moved to the dedicated Guiyang bucket
      # (pytorch-torchnpu, cn-southwest-2); source stays on the legacy
      # ap-southeast-1 bucket. Guiyang bucket credentials
      # (ACCESSKEY_GUIYANG/SECRETACCESSKEY_GUIYANG) are selected by the
      # wheel steps via the cn-southwest-2 endpoint match.
      wheels_obs_endpoint: 'obs.cn-southwest-2.myhuaweicloud.com'
      wheels_obs_bucket: 'pytorch-torchnpu/7day-cache'

  test:
    needs: build
    uses: ./.github/workflows/_nightly_test.yml
    secrets: inherit
    with:
      resolved_short: ${{ needs.build.outputs.resolved_short }}
      resolved_sha: ${{ needs.build.outputs.resolved_sha }}
      pytorch_wheels_tarball: ${{ needs.build.outputs.pytorch_wheels_tarball }}
      torchnpu_wheels_tarball: ${{ needs.build.outputs.torchnpu_wheels_tarball }}
      upstream_repo: pytorch/pytorch
      torch_npu_short: ${{ needs.build.outputs.torch_npu_short }}
      case_paths_config: .github/config/nightly_test_categories_a5.yml
      docker_image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-test-x86_64-cann-a5-py3.11-torch-master-cann9.2.0-20260910200430-202610160226-8a315d17
      report_to_upstream: false
      hw_classification: ''
      full_scan: true
      device_env: 'privateuse1,cpu'
      skip_list: |-
        .github/config/disabled_testcases_a5_all.json
        .github/config/unsupport_dtype_testcases.json
        .github/config/unsupported_aclnn_testcases.json
        .github/config/temporary_skiped_testcases.json
      runner_label: 'linux-amd64-a5-2'
      test_max_parallel: 3
      # Same dedicated Guiyang wheels bucket as the build job above.
      wheels_obs_endpoint: 'obs.cn-southwest-2.myhuaweicloud.com'
      wheels_obs_bucket: 'pytorch-torchnpu/7day-cache'
      # Rewrites the installed triton-ascend backend's hardcoded
      # -std=c++17 to -std=c++20 and prebuilds npu_utils.so once per
      # shard container, working around the deterministic npu_utils
      # build failure against torch master's C++20-only ATen headers.
      # This image is the original hotspot: run 38846980367 graph-2
      # alone showed 549 compile failures + 34 per-case timeouts +
      # ~55h swallowed compile tax. Validated on nightly-a3 run
      # 39538533016: npu_utils failures -> 0, no side effects.
      # See the Patch triton cxx20 step in _nightly_test-category.yml.
      patch_triton_cxx20: true

