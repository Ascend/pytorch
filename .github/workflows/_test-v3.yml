name: Test Parallel (v3)

on:
  workflow_call:
    inputs:
      resolved_short:
        required: true
        type: string
        description: Short SHA of upstream PyTorch (from _build-v3.yml outputs)
      classification_config:
        required: false
        type: string
        default: '.github/config/nightly_v3_test_whitelist.yml'
        description: 'Path to category classification config YAML (relative to ci-scripts checkout root)'

defaults:
  run:
    shell: bash

jobs:
  # ── Collect: scan files → classify → shard → build dynamic matrix ──
  collect:
    uses: ./.github/workflows/_test-collect-v3.yml
    secrets: inherit
    with:
      resolved_short: ${{ inputs.resolved_short }}
      classification_config: ${{ inputs.classification_config }}

  # ── Test: single job, matrix-driven fan-out (v2 pattern) ──────────
  # Each (category, shard) combo becomes a parallel _test-exec-v3.yml
  # instance.  Adding a new category only requires editing the whitelist
  # YAML — no workflow changes needed.
  test:
    needs: collect
    strategy:
      matrix: ${{ fromJson(needs.collect.outputs.matrix_json) }}
      fail-fast: false
    uses: ./.github/workflows/_test-exec-v3.yml
    secrets: inherit
    with:
      resolved_short: ${{ inputs.resolved_short }}
      category: ${{ matrix.category }}
      shard: ${{ matrix.shard }}
      num_shards: ${{ matrix.num_shards }}
      runner: ${{ matrix.runner }}
      npu_count: ${{ matrix.npu_count }}
      devices_per_proc: ${{ matrix.devices_per_proc }}

  # ── Report: aggregate all shard artifacts ──────────────────────────
  report:
    needs: [collect, test]
    if: always() && needs.collect.result == 'success'
    uses: ./.github/workflows/_test-report-v3.yml
    secrets: inherit
