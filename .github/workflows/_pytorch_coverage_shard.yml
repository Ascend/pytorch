name: PyTorch Coverage Shard

on:
  workflow_call:
    inputs:
      category:
        required: true
        type: string
      matrix_json:
        required: true
        type: string
        description: JSON array of shard numbers for this category
      num_shards:
        required: true
        type: string
      max_workers:
        required: true
        type: string
      runner_label:
        required: true
        type: string
      resolved_short:
        required: true
        type: string
      resolved_sha:
        required: true
        type: string
        description: >-
          Full 40-char SHA of upstream PyTorch the shards check out from the
          in-cluster git-cdn. A short SHA cannot be fetched directly.
      upstream_repo:
        required: false
        type: string
        default: 'pytorch/pytorch'
        description: The upstream repository full name (owner/repo) the source is cloned from.
      pytorch_wheels_tarball:
        required: true
        type: string
      torchnpu_wheels_tarball:
        required: false
        type: string
        default: ''
      docker_image:
        required: false
        type: string
        default: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch:torch-npu-test-aarch64-cann-a3-py3.11-torch-master-cann9.2.0-20260910200430-202610160225-8a315d17
      case_timeout:
        required: false
        type: string
        default: '1200'
      categories_filter:
        required: false
        type: string
        default: ''
        description: 'Comma-separated categories for debug runs; empty = run this shard'

jobs:
  coverage:
    name: coverage ${{ inputs.category }} shard ${{ matrix.shard }}/${{ inputs.num_shards }}
    if: ${{ inputs.categories_filter == '' || contains(inputs.categories_filter, inputs.category) }}
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 1440
    defaults:
      run:
        shell: bash
    container:
      image: ${{ inputs.docker_image }}
      options: --network host
    env:
      PIP_INDEX_URL: https://mirrors.huaweicloud.com/repository/pypi/simple
      ASCEND_PROCESS_LOG_PATH: /root/ascend/log/plog
      ASCEND_GLOBAL_LOG_LEVEL: '3'
      OBS_SHARD_PREFIX: obs://pytorch-ci-cache/7day-cache/coverage-shards
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(inputs.matrix_json) }}
    steps:
      - name: Compute tarball names
        id: sha
        env:
          PYTORCH_WHEELS_TARBALL: ${{ inputs.pytorch_wheels_tarball }}
          TORCHNPU_WHEELS_TARBALL: ${{ inputs.torchnpu_wheels_tarball }}
        run: |
          echo "pytorch_wheels_tarball=${PYTORCH_WHEELS_TARBALL}" >> "$GITHUB_OUTPUT"
          echo "torchnpu_wheels_tarball=${TORCHNPU_WHEELS_TARBALL}" >> "$GITHUB_OUTPUT"

      # Clone the tested commit from the in-cluster git-cdn instead of
      # pulling a ~800MB worktree tarball from OBS.
      # The NPU runner's gitconfig rewrites github.com to git-cdn (a
      # cluster-local service in NO_PROXY), so this is a cache hit rather
      # than a public-internet clone. Submodules are deliberately NOT
      # shallow-cloned: with `--depth 1` every pinned submodule commit is
      # unreachable, so `git submodule update` has to run two extra serial
      # `git fetch` round-trips per submodule; full-history clones reach
      # the pin directly and go straight to the checkout. The extra .git
      # bytes stay on the runner — the shard only needs the working tree.
      - name: Clone PyTorch source from git-cdn
        env:
          UPSTREAM_REPO: ${{ inputs.upstream_repo }}
          UPSTREAM_SHA: ${{ inputs.resolved_sha }}
        run: |
          set -euo pipefail
          git init -q pytorch
          cd pytorch
          git remote add origin "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --depth 1 origin "${UPSTREAM_SHA}"
          git checkout -q -b build FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${UPSTREAM_SHA}" || {
            echo "ERROR: checked out $(git rev-parse HEAD), expected ${UPSTREAM_SHA}" >&2
            exit 1
          }
          git submodule update --init --recursive --jobs=$(nproc)
          echo "PyTorch source ready: $(git rev-parse --short HEAD), $(du -sh . | cut -f1)"

      - name: Download pytorch wheels from OBS
        run: |
          # Wheels live in the dedicated Guiyang bucket
          # (pytorch-torchnpu, cn-southwest-2, key pair
          # ACCESSKEY_GUIYANG/SECRETACCESSKEY_GUIYANG); the source
          # download above and the coverage upload below stay on the
          # legacy ap-southeast-1 endpoint.
          obsutil config -i=${{ secrets.ACCESSKEY_GUIYANG }} -k=${{ secrets.SECRETACCESSKEY_GUIYANG }} -e=obs.cn-southwest-2.myhuaweicloud.com

          TARBALL="${{ steps.sha.outputs.pytorch_wheels_tarball }}"
          for attempt in 1 2; do
            echo "=== Download attempt ${attempt} ==="
            if obsutil cp "obs://pytorch-torchnpu/7day-cache/${TARBALL}" "./${TARBALL}" -vlength; then
              echo "Download succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Download attempt ${attempt} failed"
            sleep 10
          done
          echo "ERROR: ${TARBALL} not found in OBS cache (build may have failed to upload)." >&2
          exit 1

      - name: Download torch_npu wheels from OBS
        if: steps.sha.outputs.torchnpu_wheels_tarball != ''
        run: |
          # Same dedicated Guiyang wheels bucket as the pytorch wheels
          # download above.
          obsutil config -i=${{ secrets.ACCESSKEY_GUIYANG }} -k=${{ secrets.SECRETACCESSKEY_GUIYANG }} -e=obs.cn-southwest-2.myhuaweicloud.com

          TARBALL="${{ steps.sha.outputs.torchnpu_wheels_tarball }}"
          for attempt in 1 2; do
            echo "=== Download attempt ${attempt} ==="
            if obsutil cp "obs://pytorch-torchnpu/7day-cache/${TARBALL}" "./${TARBALL}" -vlength; then
              echo "Download succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Download attempt ${attempt} failed"
            sleep 10
          done
          echo "ERROR: ${TARBALL} not found in OBS cache (build may have failed to upload)." >&2
          exit 1

      - name: Extract and install wheels
        run: |
          mkdir -p /tmp/wheels
          tar -xzf ${{ steps.sha.outputs.pytorch_wheels_tarball }} -C /tmp/wheels
          rm ${{ steps.sha.outputs.pytorch_wheels_tarball }}
          if [ -n "${{ steps.sha.outputs.torchnpu_wheels_tarball }}" ]; then
            tar -xzf ${{ steps.sha.outputs.torchnpu_wheels_tarball }} -C /tmp/wheels
            rm ${{ steps.sha.outputs.torchnpu_wheels_tarball }}
          fi
          pip install /tmp/wheels/torch-*.whl
          pip install --no-deps /tmp/wheels/torch_npu*.whl
          pip install --no-deps /tmp/wheels/torchvision-*.whl || echo "WARNING: torchvision wheel not found in tarball"
          pip install pyyaml coverage

      - name: Download cases shard JSONs
        uses: actions/download-artifact@v4
        with:
          name: cases-shards
          path: cases-shards

      - name: Checkout coverage scripts
        uses: actions/checkout@v6
        with:
          repository: Ascend/pytorch
          path: ci-scripts
          ref: ci-test

      - name: Verify NPU environment
        run: |
          source /usr/local/Ascend/cann/set_env.sh 2>/dev/null || true
          source /usr/local/Ascend/nnal/atb/set_env.sh 2>/dev/null || true
          export LD_LIBRARY_PATH="$(python3 -c 'import sys; print(sys.prefix)')/lib:$LD_LIBRARY_PATH"

          mkdir -p "${ASCEND_PROCESS_LOG_PATH}"
          npu-smi info
          python -c "
          import torch
          print(f'torch: {torch.__version__}')
          import torch_npu
          print(f'torch_npu: {torch_npu.__version__}')
          print(f'NPU available: {torch.npu.is_available()}')
          print(f'NPU count: {torch.npu.device_count()}')
          "

      - name: Run coverage shard
        id: run_coverage
        run: |
          source /usr/local/Ascend/cann/set_env.sh 2>/dev/null || true
          source /usr/local/Ascend/nnal/atb/set_env.sh 2>/dev/null || true
          export LD_LIBRARY_PATH="$(python3 -c 'import sys; print(sys.prefix)')/lib:$LD_LIBRARY_PATH"
          mkdir -p "${ASCEND_PROCESS_LOG_PATH}"

          CASES_JSON="cases-shards/${{ inputs.category }}_cases_shard_${{ matrix.shard }}.json"
          OUT_DIR="${GITHUB_WORKSPACE}/cov-out/${{ inputs.category }}-${{ matrix.shard }}"

          echo "=== ${{ inputs.category }} shard ${{ matrix.shard }}/${{ inputs.num_shards }} ==="
          python3 -c "import json; d=json.load(open('${CASES_JSON}')); print('total cases:', d['total_cases'])"
          echo "Max workers: ${{ inputs.max_workers }}  Case timeout: ${{ inputs.case_timeout }}s"

          set +e
          OUT_ROOT="${GITHUB_WORKSPACE}/coverage-out" \
          PYTHON_BIN=python3 \
            bash "${GITHUB_WORKSPACE}/ci-scripts/.github/scripts/run_pytorch_coverage.sh" \
              --cases-json "${CASES_JSON}" \
              --test-dir "${GITHUB_WORKSPACE}/pytorch/test" \
              --out-dir "${OUT_DIR}" \
              --max-workers ${{ inputs.max_workers }} \
              --timeout ${{ inputs.case_timeout }}
          STATUS=$?
          set -e
          echo "test_status=${STATUS}" >> "$GITHUB_OUTPUT"

      - name: Upload shard data to OBS
        if: always()
        run: |
          SHARD_DIR="${GITHUB_WORKSPACE}/cov-out/${{ inputs.category }}-${{ matrix.shard }}"
          TARBALL="${GITHUB_WORKSPACE}/${{ inputs.category }}-${{ matrix.shard }}.tar.gz"
          if [ ! -d "${SHARD_DIR}" ]; then
            echo "WARNING: no shard dir ${SHARD_DIR}, nothing to upload"
            exit 0
          fi

          tar -czf "${TARBALL}" -C "${SHARD_DIR}" \
            --exclude=./reports/cases_logs --exclude=./reports/junit_xmls .
          echo "shard tarball: $(ls -lh "${TARBALL}" | awk '{print $5}')"

          obsutil config -i=${{ secrets.ACCESSKEY }} -k=${{ secrets.SECRETACCESSKEY }} -e=obs.ap-southeast-1.myhuaweicloud.com

          TARGET="${{ env.OBS_SHARD_PREFIX }}/${{ github.run_id }}/${{ inputs.category }}-${{ matrix.shard }}.tar.gz"
          for attempt in 1 2; do
            echo "=== Upload attempt ${attempt} ==="
            if obsutil cp "${TARBALL}" "${TARGET}" -f -vlength; then
              echo "Shard data uploaded: ${TARGET}"
              rm -f "${TARBALL}"
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: failed to upload ${TARGET}" >&2
          exit 1