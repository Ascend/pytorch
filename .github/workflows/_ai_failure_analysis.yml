name: AI Failure Analysis

# 失败用例 AI 根因分析（Trae CLI headless）。由 nightly a3/a5 末尾的
# ai-failure-analysis job 与 ai-failure-analysis-manual.yml 手动验证入口
# 共同调用。Agent 换代历史：Claude Code + DeepSeek（f9823f0669）→ Trae CLI
# 2.0（PAT 鉴权，接入方式对齐 EnginVault/nightly-issue-hub 的
# availability-failure-analysis-github.yml 参考实现）。
#
# 流程：廉价门禁（fetch_test_failures.py，无模型调用）→ 通过才安装
# Trae CLI（CDN stable + sha256 校验）→ PAT 登录 + 模型冒烟 → agent 按
# skill 夜间模式分析 → 报告上传 guiyang OBS → Summary 打印匿名下载链接。
#
# 门禁退出码（job 级/基础设施失败一律不启动 AI 流程）：
#   0 分析 / 3 无失败用例 / 4 报告制品缺失 / 5 失败全部为基础设施签名

on:
  workflow_call:
    inputs:
      run_url:
        required: false
        type: string
        default: ''
        description: 待分析流水线 run URL；空 = 当前 run
      model:
        required: false
        type: string
        default: ''
        description: Trae 模型名；空 = 取 repo 变量 TRAECLI_MODEL，再空 = GLM-5.3-Flash
      max_cases:
        required: false
        type: number
        default: 30
        description: 深度分析的失败用例上限（其余按签名聚类归类）
      timeout_minutes:
        required: false
        type: number
        default: 45
        description: job 超时（分钟）
      obs_endpoint:
        required: false
        type: string
        default: 'obs.cn-southwest-2.myhuaweicloud.com'
        description: 报告上传 OBS endpoint（Guiyang）
      obs_bucket:
        required: false
        type: string
        default: 'pytorch-torchnpu'
        description: 报告上传 OBS 桶名（public-read）
      obs_prefix:
        required: false
        type: string
        default: 'ai-analysis'
        description: 报告对象键前缀
      continue_on_error:
        required: false
        type: boolean
        default: false
        description: true = 分析失败不使本 job 显红（夜间集成用；手动验证保持 false 以便失败可见）

permissions:
  contents: read

jobs:
  ai-failure-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    # 夜间集成传 true：AI 分析异常不影响流水线结论；手动验证默认 false 显红
    continue-on-error: ${{ inputs.continue_on_error }}
    permissions:
      # gh 下载本仓库制品 + checkout，够用即可；不继承顶层 id-token: write
      contents: read
      actions: read
    env:
      # Trae PAT 登录（login --with-trae-pat 读取）
      TRAECLI_PERSONAL_ACCESS_TOKEN: ${{ secrets.TRAE_API_KEY }}
      # gh CLI 认证（门禁脚本下载制品用）
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout this repo (skill + gate script + prompt)
        uses: actions/checkout@v6

      - name: Gate and prepare failure data
        id: gate
        run: |
          set +e
          RUN_URL='${{ inputs.run_url }}'
          if [ -z "${RUN_URL}" ]; then
            RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
          echo "run_url=${RUN_URL}" >> "$GITHUB_OUTPUT"
          echo "Target run: ${RUN_URL}"
          python3 .github/scripts/fetch_test_failures.py \
            --run-url "${RUN_URL}" \
            --workdir failure-data \
            --max-cases '${{ inputs.max_cases }}'
          code=$?
          set -e
          echo "gate_code=${code}" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            echo "status=analyze" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 3 ] || [ "$code" -eq 4 ] || [ "$code" -eq 5 ]; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "GATE: skipped (exit ${code}), AI analysis will NOT run"
          else
            echo "::error::gate script failed with unexpected exit code ${code}"
            exit 1
          fi

      - name: Install Trae CLI
        if: steps.gate.outputs.status == 'analyze'
        run: |
          set -e
          # CDN stable 通道 + manifest sha256 校验（安装方式对齐
          # EnginVault/nightly-issue-hub 参考实现；二进制自带运行时，无需 Node）
          BASE=https://lf-cdn.trae.com.cn/obj/trae-com-cn/trae-cli
          MANIFEST=$(curl -fsSL --max-time 60 "$BASE/v2/public/stable/latest.json")
          read -r VER URL SHA SIZE <<< "$(printf '%s' "$MANIFEST" | python3 -c "
          import json,sys
          m=json.load(sys.stdin)
          a=[x for x in m['artifacts'] if x.get('platform')=='linux-x86_64'][0]
          u=a['url'] if a['url'].startswith('http') else '$BASE/'+a['url'].lstrip('/')
          print(m['version'], u, a.get('sha256','-'), a.get('size','-'))")"
          echo "traecli version=$VER"
          curl -fsSL --max-time 600 "$URL" -o /tmp/traex.gz
          echo "downloaded $(wc -c < /tmp/traex.gz) bytes (expect $SIZE)"
          python3 - "$SHA" <<'EOF'
          import sys, hashlib
          h = hashlib.sha256(open('/tmp/traex.gz','rb').read()).hexdigest()
          if sys.argv[1] != '-' and h != sys.argv[1]:
              sys.exit(f'sha256 mismatch: {h}')
          print('sha256 OK')
          EOF
          mkdir -p ~/.local/share/traecli/releases/"$VER"
          gzip -dc /tmp/traex.gz > ~/.local/share/traecli/releases/"$VER"/traex
          chmod +x ~/.local/share/traecli/releases/"$VER"/traex
          ln -sfn ~/.local/share/traecli/releases/"$VER" ~/.local/share/traecli/current
          mkdir -p ~/.local/bin && ln -sf ~/.local/share/traecli/current/traex ~/.local/bin/traecli
          export PATH=~/.local/bin:$PATH
          traecli --version

      - name: Login with Trae PAT and smoke test model
        if: steps.gate.outputs.status == 'analyze'
        run: |
          set -e
          export PATH=~/.local/bin:$PATH
          if [ -z "${TRAECLI_PERSONAL_ACCESS_TOKEN}" ]; then
            echo "::error::TRAE_API_KEY secret is not configured"
            exit 1
          fi
          timeout 180 traecli login --with-trae-pat || {
            echo "::error::traecli login failed: check TRAE_API_KEY (Trae PAT) validity"
            exit 1
          }
          # 模型冒烟（区分"模型调不通"与"分析失败"）
          MODEL='${{ inputs.model }}'
          if [ -z "$MODEL" ]; then MODEL='${{ vars.TRAECLI_MODEL }}'; fi
          if [ -z "$MODEL" ]; then MODEL='GLM-5.3-Flash'; fi
          echo "model: $MODEL"
          timeout 120 traecli exec --json --color never --skip-git-repo-check \
            -C "$PWD" -y -m "$MODEL" -o /tmp/smoke-message.md \
            "请直接回复两个字符：OK" > /tmp/smoke-events.jsonl 2>&1 || {
            echo "::error::traecli probe failed - check TRAE_API_KEY and model '$MODEL'"
            tail -n 15 /tmp/smoke-events.jsonl || true
            exit 1
          }
          PROBE_OUT=$(cat /tmp/smoke-message.md 2>/dev/null || true)
          echo "smoke reply: ${PROBE_OUT}"
          echo "${PROBE_OUT}" | grep -q "OK" || {
            echo "::error::model replied unexpectedly: ${PROBE_OUT}"
            exit 1
          }
          echo "Model connectivity OK"

      - name: Run AI failure analysis
        id: agent
        if: steps.gate.outputs.status == 'analyze'
        env:
          RUN_URL: ${{ steps.gate.outputs.run_url }}
          WORKDIR: failure-data
          REPORT_PATH: ai-analysis-report.md
          MAX_CASES: '${{ inputs.max_cases }}'
          TIMEOUT_MINUTES: '${{ inputs.timeout_minutes }}'
        run: |
          set -e
          export PATH=~/.local/bin:$PATH
          MODEL='${{ inputs.model }}'
          if [ -z "$MODEL" ]; then MODEL='${{ vars.TRAECLI_MODEL }}'; fi
          if [ -z "$MODEL" ]; then MODEL='GLM-5.3-Flash'; fi
          # agent 内层超时留出登录/上传/Summary 的余量
          EXEC_TIMEOUT=$(( TIMEOUT_MINUTES - 10 ))
          if [ "$EXEC_TIMEOUT" -lt 10 ]; then EXEC_TIMEOUT=10; fi
          # 渲染 prompt 模板（sed 而非 envsubst：不依赖 gettext，占位符固定五个）
          sed -e "s|\${RUN_URL}|${RUN_URL}|g" \
              -e "s|\${WORKDIR}|${WORKDIR}|g" \
              -e "s|\${REPORT_PATH}|${REPORT_PATH}|g" \
              -e "s|\${MAX_CASES}|${MAX_CASES}|g" \
              -e "s|\${TIME_BUDGET}|${EXEC_TIMEOUT} 分钟|g" \
              .github/ai-analysis/nightly_prompt.md > prompt.md
          set +e
          T0=$(date +%s)
          ( timeout -k 20 "${EXEC_TIMEOUT}m" traecli exec \
              --json --color never --skip-git-repo-check \
              -C "$PWD" -y -m "$MODEL" \
              -o agent-final-message.md \
              "$(cat prompt.md)" > trae-events.jsonl 2>&1 ) &
          TPID=$!
          while kill -0 "$TPID" 2>/dev/null; do
            sleep 60
            echo "[progress] elapsed=$(( $(date +%s) - T0 ))s events=$(wc -l < trae-events.jsonl 2>/dev/null || echo 0)"
          done
          wait "$TPID"
          AGENT_CODE=$?
          set -e
          echo "agent_code=${AGENT_CODE}" >> "$GITHUB_OUTPUT"
          echo "traecli exit code: ${AGENT_CODE}"
          if [ "${AGENT_CODE}" -ne 0 ]; then
            echo "::warning::traecli exited with code ${AGENT_CODE}; report may be incomplete"
            echo "--- 失败现场：事件尾部 ---"
            tail -n 25 trae-events.jsonl || true
          fi
          if [ ! -s ai-analysis-report.md ]; then
            echo "report file missing/empty, wrapping agent final message as fallback"
            {
              echo "# AI 失败用例分析报告（降级产出：agent 未写报告文件）"
              echo
              cat agent-final-message.md 2>/dev/null || true
            } > ai-analysis-report.md
          fi
          [ -s ai-analysis-report.md ] || {
            echo "::error::no report produced (agent code ${AGENT_CODE}, see trae-events.jsonl artifact)"
            exit 1
          }

      - name: Install obsutil
        if: steps.gate.outputs.status == 'analyze'
        run: |
          set -e
          # 与 _nightly_build_upstream_wheels.yml 的安装方式一致（无 Actions
          # cache：本 job 每日至多一次，单文件上传不值得缓存维护）
          ARCH=$(uname -m)
          case "${ARCH}" in
            x86_64)  OBS_ARCH="amd64" ;;
            aarch64) OBS_ARCH="arm64" ;;
            *)       echo "Unsupported architecture: ${ARCH}"; exit 1 ;;
          esac
          OBSUTIL_HOME="$HOME/.local/obsutil"
          rm -rf "${OBSUTIL_HOME}"
          mkdir -p "${OBSUTIL_HOME}"
          OBS_URL="https://obs-community.obs.cn-north-1.myhuaweicloud.com/obsutil/current/obsutil_linux_${OBS_ARCH}.tar.gz"
          wget --tries=3 --timeout=30 --waitretry=10 --progress=dot:mega "${OBS_URL}"
          tar -zxf "obsutil_linux_${OBS_ARCH}.tar.gz" -C "${OBSUTIL_HOME}/"
          rm -f "obsutil_linux_${OBS_ARCH}.tar.gz"
          ln -sf "${OBSUTIL_HOME}"/obsutil_linux_${OBS_ARCH}_*/obsutil "${OBSUTIL_HOME}/obsutil"
          "${OBSUTIL_HOME}/obsutil" version

      - name: Upload report to OBS
        id: obs
        if: steps.gate.outputs.status == 'analyze'
        run: |
          set -e
          export PATH="${HOME}/.local/obsutil:${PATH}"
          # 凭据跟随 endpoint（Guiyang 桶独立 key 对），与 wheels 上传一致
          OBS_ENDPOINT='${{ inputs.obs_endpoint }}'
          OBS_BUCKET='${{ inputs.obs_bucket }}'
          OBS_PREFIX='${{ inputs.obs_prefix }}'
          if [[ "${OBS_ENDPOINT}" == *cn-southwest-2* ]]; then
            obsutil config -i=${{ secrets.ACCESSKEY_GUIYANG }} -k=${{ secrets.SECRETACCESSKEY_GUIYANG }} -e=${OBS_ENDPOINT}
          else
            obsutil config -i=${{ secrets.ACCESSKEY }} -k=${{ secrets.SECRETACCESSKEY }} -e=${OBS_ENDPOINT}
          fi
          # 对象键用"被分析 run"的 id（手动模式下与当前 workflow run 不同）
          RUN_ID=$(python3 -c "import json; print(json.load(open('failure-data/gate.json'))['run']['run_id'])")
          KEY="${OBS_PREFIX}/run-${RUN_ID}"
          obsutil cp ai-analysis-report.md "obs://${OBS_BUCKET}/${KEY}/ai-analysis-report.md" -f
          obsutil cp failure-data/failures.json "obs://${OBS_BUCKET}/${KEY}/failures.json" -f
          # 桶为 public-read，匿名 URL 为 virtual-hosted style；HEAD 探测
          # best-effort，非 200 仅告警（与 wheels 上传一致）
          REPORT_URL="https://${OBS_BUCKET}.${OBS_ENDPOINT}/${KEY}/ai-analysis-report.md"
          echo "report_url=${REPORT_URL}" >> "$GITHUB_OUTPUT"
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 -I "${REPORT_URL}" || echo 000)
          echo "Public download URL (anonymous HEAD: HTTP ${HTTP_CODE}): ${REPORT_URL}"
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::warning::report not anonymously downloadable (HTTP ${HTTP_CODE})"
          fi

      - name: Write job summary
        if: always()
        env:
          REPORT_URL: ${{ steps.obs.outputs.report_url }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os

          print("## AI 失败用例分析")
          try:
              gate = json.load(open("failure-data/gate.json", encoding="utf-8"))
          except Exception:
              print("| 项 | 值 |")
              print("|---|---|")
              print("| 状态 | gate 异常（见 job 日志） |")
              raise SystemExit(0)
          run = gate.get("run", {})
          status = gate.get("status", "skipped")
          print("| 项 | 值 |")
          print("|---|---|")
          if status == "analyze":
              counts = gate.get("counts", {})
              print(f"| 状态 | **analyzed**（failed={counts.get('failed')} "
                    f"errors={counts.get('errors')} timeout={counts.get('timeout')}；"
                    f"非基础设施用例 {gate.get('cases_non_infra')} / "
                    f"基础设施类 {gate.get('cases_infra')}） |")
          else:
              print(f"| 状态 | skipped（{gate.get('reason', '')}） |")
          if run.get("html_url"):
              sha = (run.get("head_sha") or "")[:12]
              print(f"| 目标流水线 | [{run.get('name')} #{run.get('run_id')}]({run['html_url']}) @ {sha} |")
          url = os.environ.get("REPORT_URL", "")
          if url:
              print(f"| 分析报告 (OBS) | [ai-analysis-report.md]({url}) |")
          print("| GHA 制品 | ai-failure-analysis（报告 + failures.json + agent 日志） |")
          EOF

      - name: Upload analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-failure-analysis
          path: |
            ai-analysis-report.md
            agent-final-message.md
            prompt.md
            trae-events.jsonl
            failure-data/gate.json
            failure-data/failures.json
          if-no-files-found: ignore
          retention-days: 30
