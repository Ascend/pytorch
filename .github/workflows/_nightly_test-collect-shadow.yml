name: Test Collect (Shadow JSONL channel)

# Shadow twin of _nightly_test-collect.yml for plan stage 2
# (agent_space/nodeid-collection-plan-a.md): collects the same source with
# the same config in the same image, but through the dedicated JSONL nodeid
# channel (collect_all_cases_v2.py + nodeid_dump.py) instead of stdout line
# parsing. Artifacts land as cases-shards-shadow / collection-errors-shadow
# and are diffed against the baseline by diff_collection.py in the caller's
# shadow-diff job.
#
# Differences from the baseline workflow, in full:
#   - runs collect_all_cases_v2.py (baseline collect_all_cases.py is
#     untouched and keeps running in the `collect` job)
#   - no shard matrix outputs (nothing executes the shadow shards)
#   - artifacts are hardcoded to the -shadow names
# DELETE THIS FILE once the JSONL channel is promoted to the main collect
# script (plan stage 3).

on:
  workflow_call:
    inputs:
      resolved_short:
        required: true
        type: string
        description: Short SHA of upstream PyTorch (from _build.yml outputs)
      resolved_sha:
        required: true
        type: string
        description: Full resolved SHA of upstream PyTorch (interface compatibility; the tested source comes from the OBS tarball keyed by resolved_short).
      upstream_repo:
        required: false
        type: string
        default: 'pytorch/pytorch'
        description: The upstream repository full name (owner/repo). No longer used to clone here — source comes from OBS.
      pytorch_wheels_tarball:
        required: true
        type: string
        description: >-
          Content-addressed pytorch-side wheels tarball name (torch +
          torchvision) from the build job output
          (wheels-pytorch-<upstream_short>-py<ver>-<image_tag>-<arch>-
          <recipe>.tar.gz), used for the OBS download. A legacy combined
          tarball name also works: it additionally contains the
          torch_npu wheel.
      torchnpu_wheels_tarball:
        required: false
        type: string
        default: ''
        description: >-
          torch_npu wheels tarball name from the build job output
          (wheels-torchnpu-<torch_npu_short>-<upstream_short>-py<ver>-
          <image_tag>-<arch>-<recipe>.tar.gz). Empty means the torch_npu
          wheel comes from the pytorch tarball (legacy combined flows).
      case_paths_config:
        required: false
        type: string
        default: ''
        description: 'Path (relative to repo root) to whitelist YAML. Empty = scan all test_*.py files.'
      docker_image:
        required: false
        type: string
        default: 'quay.io/kerer/pytorch:torch-npu-test-aarch64-cann-a3-py3.10-torch-nightly'
        description: Docker image for running tests
      hw_classification:
        required: false
        type: string
        default: 'ACCELERATOR'
        description: >-
          Space-separated hardware classification filters passed to pytest
          --collect-only (e.g., "ACCELERATOR" or "GENERIC ACCELERATOR").
          Valid values: GENERIC ACCELERATOR CPU CUDA MPS XPU.
      full_scan:
        required: false
        type: boolean
        default: false
        description: >-
          When true, scan ALL test_*.py files and use case-paths-config as a
          categorization mapping (paths + files) instead of a whitelist.
          Unmatched files go to 'others'.
      skip_list:
        required: false
        type: string
        default: ''
        description: >-
          Path(s) (relative to repo root) to skip list files. Newline-separated
          for multiple files. When set, matching nodeids are removed after
          collection and before sharding. When empty, no skip filtering is
          applied. Supports JSONL, JSON {skip_nodeids:[...]}, JSON array,
          and JSON {nodeid: {reason:...}} formats.
      runner_label:
        required: false
        type: string
        default: 'linux-aarch64-a3-8'
        description: Runner label for runs-on.
      device_env:
        required: false
        type: string
        default: 'privateuse1'
        description: >-
          Comma-separated device types exported as
          PYTORCH_TESTING_DEVICE_ONLY_FOR during collection. Must match the
          execution phase value.

jobs:
  collect-shadow:
    runs-on: ${{ inputs.runner_label }}
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        shell: bash
    container:
      image: ${{ inputs.docker_image }}
      options: --network host
    env:
      PIP_INDEX_URL: https://mirrors.huaweicloud.com/repository/pypi/simple

    steps:
      - name: Compute tarball names
        id: sha
        env:
          PYTORCH_WHEELS_TARBALL: ${{ inputs.pytorch_wheels_tarball }}
          TORCHNPU_WHEELS_TARBALL: ${{ inputs.torchnpu_wheels_tarball }}
        run: |
          UPSTREAM_SHORT="${{ inputs.resolved_short }}"
          echo "source_tarball=pytorch-source-${UPSTREAM_SHORT}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "pytorch_wheels_tarball=${PYTORCH_WHEELS_TARBALL}" >> "$GITHUB_OUTPUT"
          echo "torchnpu_wheels_tarball=${TORCHNPU_WHEELS_TARBALL}" >> "$GITHUB_OUTPUT"

      # Source and wheels are fetched from OBS only (no GitHub clone on the
      # NPU runner, no GHA artifacts): the build job (or the PR CI fetch job,
      # which shares the same content-addressed key) published
      # pytorch-source-<upstream_short>.tar.gz there.
      - name: Download PyTorch source from OBS
        run: |
          obsutil config -i=${{ secrets.ACCESSKEY }} -k=${{ secrets.SECRETACCESSKEY }} -e=obs.ap-southeast-1.myhuaweicloud.com

          TARBALL="${{ steps.sha.outputs.source_tarball }}"
          for attempt in 1 2; do
            echo "=== Download attempt ${attempt} ==="
            if obsutil cp "obs://pytorch-ci-cache/7day-cache/${TARBALL}" "./${TARBALL}" -vlength; then
              echo "Download succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Download attempt ${attempt} failed"
            sleep 10
          done
          echo "Download failed after 2 attempts"
          exit 1

      - name: Extract PyTorch source
        run: |
          tar -xzf ${{ steps.sha.outputs.source_tarball }}
          rm ${{ steps.sha.outputs.source_tarball }}
          echo "PyTorch source extracted: $(du -sh pytorch/ | cut -f1)"

      # obsutil is preinstalled in the test image; auth is done inline
      # via `obsutil config` (AK/SK are masked by the runner in logs).
      # Objects above the 50MB threshold use segment download
      # automatically; a failed attempt leaves a checkpoint record in
      # ~/.obsutil_checkpoint/down, so the retry resumes the transfer
      # instead of restarting from byte 0. -vlength verifies the local
      # file size against the object. Do NOT delete the .obs.temp partial
      # file between attempts — it is the resume state.
      - name: Download pytorch wheels from OBS
        run: |
          obsutil config -i=${{ secrets.ACCESSKEY }} -k=${{ secrets.SECRETACCESSKEY }} -e=obs.ap-southeast-1.myhuaweicloud.com

          TARBALL="${{ steps.sha.outputs.pytorch_wheels_tarball }}"
          for attempt in 1 2; do
            echo "=== Download attempt ${attempt} ==="
            if obsutil cp "obs://pytorch-ci-cache/7day-cache/${TARBALL}" "./${TARBALL}" -vlength; then
              echo "Download succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Download attempt ${attempt} failed"
            sleep 10
          done
          echo "Download failed after 2 attempts"
          exit 1

      - name: Download torch_npu wheels from OBS
        if: steps.sha.outputs.torchnpu_wheels_tarball != ''
        run: |
          obsutil config -i=${{ secrets.ACCESSKEY }} -k=${{ secrets.SECRETACCESSKEY }} -e=obs.ap-southeast-1.myhuaweicloud.com

          TARBALL="${{ steps.sha.outputs.torchnpu_wheels_tarball }}"
          for attempt in 1 2; do
            echo "=== Download attempt ${attempt} ==="
            if obsutil cp "obs://pytorch-ci-cache/7day-cache/${TARBALL}" "./${TARBALL}" -vlength; then
              echo "Download succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Download attempt ${attempt} failed"
            sleep 10
          done
          echo "Download failed after 2 attempts" >&2
          exit 1

      - name: Extract and install wheels
        run: |
          mkdir -p /tmp/wheels
          tar -xzf ${{ steps.sha.outputs.pytorch_wheels_tarball }} -C /tmp/wheels
          rm ${{ steps.sha.outputs.pytorch_wheels_tarball }}
          if [ -n "${{ steps.sha.outputs.torchnpu_wheels_tarball }}" ]; then
            tar -xzf ${{ steps.sha.outputs.torchnpu_wheels_tarball }} -C /tmp/wheels
            rm ${{ steps.sha.outputs.torchnpu_wheels_tarball }}
          fi
          pip install /tmp/wheels/torch-*.whl
          pip install --no-deps /tmp/wheels/torch_npu*.whl
          pip install --no-deps /tmp/wheels/torchvision-*.whl || echo "WARNING: torchvision wheel not found in tarball"

      - name: Checkout test scripts
        uses: actions/checkout@v6
        with:
          path: ci-scripts
          ref: ci-test

      - name: Collect and shard test cases (JSONL channel)
        run: |
          source /usr/local/Ascend/cann/set_env.sh 2>/dev/null || true
          source /usr/local/Ascend/nnal/atb/set_env.sh 2>/dev/null || true
          export LD_LIBRARY_PATH="$(python3 -c 'import sys; print(sys.prefix)')/lib:$LD_LIBRARY_PATH"

          export PYTHONPATH="${GITHUB_WORKSPACE}/ci-scripts/.github/scripts:${PYTHONPATH}"

          CASE_PATHS_CONFIG='${{ inputs.case_paths_config }}'

          echo "=== Collecting all test cases (shadow JSONL channel) ==="
          echo "Case paths config: ${CASE_PATHS_CONFIG:-<scan all>}"

          CONFIG_ARG=""
          if [ -n "${CASE_PATHS_CONFIG}" ]; then
            CONFIG_ARG="--case-paths-config ${GITHUB_WORKSPACE}/ci-scripts/${CASE_PATHS_CONFIG}"
          fi

          FULL_SCAN_ARG=""
          if [ "${{ inputs.full_scan }}" = "true" ]; then
            FULL_SCAN_ARG="--full-scan"
          fi

          SKIP_LIST_ARG=""
          SKIP_LIST_INPUT='${{ inputs.skip_list }}'
          if [ -n "${SKIP_LIST_INPUT}" ]; then
            for skip_path in ${SKIP_LIST_INPUT}; do
              FULL_PATH="${GITHUB_WORKSPACE}/ci-scripts/${skip_path}"
              if [ -f "${FULL_PATH}" ]; then
                SKIP_LIST_ARG="${SKIP_LIST_ARG} --skip-list ${FULL_PATH}"
                echo "Skip list: ${skip_path}"
              else
                echo "WARNING: skip list file not found: ${FULL_PATH}"
              fi
            done
          fi

          # --dump-dir stays OUTSIDE the output dir so the transient per-file
          # dumps are never uploaded as artifacts.
          python3 ${GITHUB_WORKSPACE}/ci-scripts/.github/scripts/collect_all_cases_v2.py \
            --test-dir ${GITHUB_WORKSPACE}/pytorch/test \
            --hw-classification ${{ inputs.hw_classification }} \
            ${CONFIG_ARG} \
            ${FULL_SCAN_ARG} \
            ${SKIP_LIST_ARG} \
            --regular-threshold 50000 \
            --distributed-threshold 3000 \
            --device-env "${{ inputs.device_env }}" \
            --output-dir ${GITHUB_WORKSPACE}/cases-shards \
            --error-log-dir ${GITHUB_WORKSPACE}/collection_errors \
            --dump-dir ${GITHUB_WORKSPACE}/nodeid_dumps \
            --parallel 16 \
            2>&1 | tee /tmp/collect_cases.log

          echo "=== Generated shard files ==="
          ls -la ${GITHUB_WORKSPACE}/cases-shards/

          echo "=== Collection summary ==="
          cat ${GITHUB_WORKSPACE}/cases-shards/cases_collection_summary.json

          echo "=== nodeid_report (unselectable / hazardous names) ==="
          python3 -c "
          import json
          d = json.load(open('${GITHUB_WORKSPACE}/cases-shards/nodeid_report.json'))
          print(f\"unselectable: {d['unselectable_count']}, hazards: {d['hazard_count']}\")
          for u in d['unselectable'][:10]:
              print(f\"  unselectable: {u['nodeid']!r}\")
          for h in d['hazards'][:10]:
              print(f\"  hazardous:   {h['nodeid']!r} ({','.join(h['hazards'])})\")
          "

      - name: Upload cases shard JSONs
        uses: actions/upload-artifact@v4
        with:
          name: cases-shards-shadow
          path: cases-shards/
          retention-days: 7

      - name: Upload collection error logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-errors-shadow
          path: collection_errors/
          if-no-files-found: ignore
          retention-days: 7
