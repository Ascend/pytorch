name: Blacklist Shard

# Shards nodeids taken directly from the blacklist files (no collection).
# With scope=all, the blacklist_testccases/ directory is first flattened into a
# single pure nodeid list (the files use several different shapes), then split
# into balanced shards uploaded in the format expected by
# _nightly_test-category.yml ({"shard", "num_shards", "test_type", "cases"}).

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
        description: 'Target platform: a3 or a5 (used for the category name)'
      scope:
        required: false
        type: string
        default: 'platform'
        description: >-
          'platform' (default) shards only the given platform's flat
          blacklist; 'all' flattens blacklist_testccases/ into a single
          nodeid list and shards that (used by the removal-candidate pipeline).
      num_shards:
        required: false
        type: string
        default: '4'
        description: Number of shards to split the blacklist nodeids into
      artifact_name:
        required: true
        type: string
        description: >-
          Artifact name for the generated shard JSONs (e.g. cases-shards-a3).
          Must be unique per platform within the same workflow run.
    outputs:
      shards_json:
        description: JSON array of shard indexes, e.g. [1,2,3,4]
        value: ${{ jobs.shard.outputs.shards_json }}
      num_shards:
        description: Number of generated shards
        value: ${{ jobs.shard.outputs.num_shards }}
      total_cases:
        description: Number of unique blacklist nodeids sharded
        value: ${{ jobs.shard.outputs.total_cases }}

defaults:
  run:
    shell: bash

jobs:
  shard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      shards_json: ${{ steps.build_shards.outputs.shards_json }}
      num_shards: ${{ steps.build_shards.outputs.num_shards }}
      total_cases: ${{ steps.build_shards.outputs.total_cases }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v6
        with:
          ref: ci-test

      - name: Build shard JSONs from blacklist nodeids
        id: build_shards
        env:
          PLATFORM: ${{ inputs.platform }}
          SCOPE: ${{ inputs.scope }}
          NUM_SHARDS: ${{ inputs.num_shards }}
          CATEGORY: blacklist-${{ inputs.platform }}
        run: |
          python3 - <<'PY'
          import importlib.util
          import json
          import os
          import pathlib

          platform = os.environ["PLATFORM"]
          scope = os.environ.get("SCOPE", "platform")
          num_shards = int(os.environ["NUM_SHARDS"])
          category = os.environ["CATEGORY"]

          if platform not in ("a3", "a5"):
              raise SystemExit(f"invalid platform: {platform}")
          if num_shards < 1:
              raise SystemExit(f"invalid num_shards: {num_shards}")

          if scope == "all":
              # Flatten the blacklist_testccases/ directory into a single pure
              # nodeid list, handling every file format inside it in one pass.
              flatten_spec = importlib.util.spec_from_file_location(
                  "flatten_blacklist_testccases",
                  ".github/scripts/blacklist-test/scripts/flatten_blacklist_testccases.py",
              )
              flatten = importlib.util.module_from_spec(flatten_spec)
              flatten_spec.loader.exec_module(flatten)

              config_dir = ".github/config/blacklist_testccases"
              nodeids, stats = flatten.collect_nodeids(config_dir)
              for name, kind, count in stats:
                  if kind == "nodes":
                      print(f"    {name}: +{count} nodeids")
                  else:
                      print(f"    {name}: {kind}: {count}")
              files = [f"{config_dir}/{name}" for name, _kind, _count in stats]

              # Subtract the cases that passed on this platform from the flat
              # union. platform_passed_diff.json records, per platform, the
              # nodeids that passed there (passed_a3 / passed_a5); removing
              # them yields that platform's actual blacklist.
              diff_path = pathlib.Path(
                  ".github/config/blacklist_testccases/platform_passed_diff.json"
              )
              if diff_path.exists():
                  diff_data = json.loads(diff_path.read_text(encoding="utf-8"))
                  passed = set(diff_data.get(f"passed_{platform}", []) or [])
                  before = len(nodeids)
                  nodeids = [n for n in nodeids if n not in passed]
                  print(
                      f"    removed {before - len(nodeids)} passed nodeids "
                      f"for {platform}"
                  )
          else:
              spec = importlib.util.spec_from_file_location(
                  "collect_all_cases", ".github/scripts/collect_all_cases.py"
              )
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)

              files = [
                  f".github/config/disabled_testcases_{platform}_all.json",
                  ".github/config/unsupported_aclnn_testcases.json",
                  ".github/config/unsupport_dtype_testcases.json",
              ]
              if platform == "a3":
                  files.append(".github/config/temporary_skiped_testcases.json")
              nodeids = sorted(module.load_skip_list(files, platform=platform))
          print(f"[{platform}] {len(nodeids)} unique blacklist nodeids from {len(files)} files (scope={scope})")

          out_dir = pathlib.Path("cases-shards")
          out_dir.mkdir(parents=True, exist_ok=True)
          for i in range(1, num_shards + 1):
              shard_cases = [
                  {"nodeid": nodeid, "file": nodeid.split("::", 1)[0]}
                  for nodeid in nodeids[i - 1 :: num_shards]
              ]
              data = {
                  "shard": i,
                  "num_shards": num_shards,
                  "test_type": "regular",
                  "total_cases": len(shard_cases),
                  "cases": shard_cases,
              }
              path = out_dir / f"{category}_cases_shard_{i}.json"
              path.write_text(json.dumps(data, indent=2, ensure_ascii=False), encoding="utf-8")
              print(f"  shard {i}: {len(shard_cases)} cases -> {path}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"shards_json={json.dumps(list(range(1, num_shards + 1)))}\n")
              f.write(f"num_shards={num_shards}\n")
              f.write(f"total_cases={len(nodeids)}\n")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as f:
                  f.write(f"### Blacklist shards ({platform})\n\n")
                  f.write(f"- source files: {', '.join(files)}\n")
                  f.write(f"- unique nodeids: {len(nodeids)}\n")
                  f.write(f"- shards: {num_shards}\n")
          PY

      - name: Upload shard JSONs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: cases-shards/
          retention-days: 7
