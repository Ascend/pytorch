name: Retry Cross-Repo CI Relay Callback

description: >
  Retry wrapper around pytorch/test-infra cross-repo-ci-relay-callback:
  waits 30 seconds, then re-sends the callback once. Place it right after
  a "Report ... completed" step and guard it with
  `steps.<report-step-id>.outcome == 'failure'` so that a transient
  failure of the first attempt (typically an OIDC token mint timeout)
  does not silently drop the completion report.

inputs:
  status:
    description: Workflow status to report ("in_progress" or "completed").
    required: true
  conclusion:
    description: >
      Conclusion of the workflow run, passed through to the check run
      as-is (required when status is "completed").
    required: false
    default: ''
  job-name:
    description: >
      Identifier for this job, used to name the upstream check run. Must
      be unique per matrix leg, exactly as in the original callback step.
    required: true
  max-time:
    description: Maximum time in seconds to wait for the callback HTTP request.
    required: false
    default: '10'
  test-results:
    description: Optional JSON string with test result summary counts.
    required: false
    default: ''
  artifact-url:
    description: Optional URL to downstream-hosted artifacts.
    required: false
    default: ''
  callback-url:
    description: Base URL of the result callback server.
    required: false
    default: 'https://gwuj7w5coh4y4l66urspge6mnm0pwaxq.lambda-url.us-east-1.on.aws/github/callback/'

runs:
  using: composite
  steps:
    - name: Wait 30s before retry
      shell: bash
      run: |
        echo "First callback attempt failed; waiting 30s before retry..."
        sleep 30

    - name: Send callback to relay server (retry)
      uses: pytorch/test-infra/.github/actions/cross-repo-ci-relay-callback@fb6a1fce9cf9689c395708258317daca817281dc
      with:
        status: ${{ inputs.status }}
        conclusion: ${{ inputs.conclusion }}
        job-name: ${{ inputs.job-name }}
        max-time: ${{ inputs.max-time }}
        test-results: ${{ inputs.test-results }}
        artifact-url: ${{ inputs.artifact-url }}
        callback-url: ${{ inputs.callback-url }}
