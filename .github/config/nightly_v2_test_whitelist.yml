# Nightly v2 test whitelist — category-driven classification rules.
#
# Each category specifies:
#   shards:     number of shards for round-robin distribution
#   execution:  concurrent | serial
#   workers:    max concurrent workers (NPU cards)
#   paths:      directories to recursively scan for test_*.py files
#   files:      exact file paths to include (takes priority over paths)
#
# Classification priority (3 passes):
#   1. files:  exact file match across all categories (first match wins)
#   2. paths:  directory prefix match for remaining files
#   3. others: catch-all for any test_*.py not matched above
#
# Categories without paths/files (e.g. others) act as catch-all buckets.
#
# Top-level 'exclude' lists directories/files to skip entirely — they are
# removed from the scan set before classification, so they never enter
# any category (not even others).

exclude:
  - test/cpython

categories:
  core:
    shards: 1
    execution: concurrent
    workers: 8
    paths:
      - test/nn
      - test/optim
      - test/autograd
      - test/profiler
    files:
      - test/test_cpp_api_parity.py
      - test/test_modules.py
      - test/test_native_mha.py
      - test/test_nn.py
      - test/test_nnapi.py
      - test/test_transformers.py
      - test/test_varlen_attention.py
      - test/test_functional_optim.py
      - test/test_optim.py
      - test/test_autograd.py
      - test/test_autograd_fallback.py
      - test/test_expanded_weights.py
      - test/test_functional_autograd_benchmark.py
      - test/test_functionalization_of_rng_ops.py
      - test/test_ops_fwd_gradients.py
      - test/test_ops_gradients.py
      - test/test_flop_counter.py
      - test/test_itt.py
      - test/test_throughput_benchmark.py

  tensor:
    shards: 1
    execution: concurrent
    workers: 8
    paths:
      - test/torch_np
    files:
      - test/test_as_strided.py
      - test/test_binary_ufuncs.py
      - test/test_bmm_outer_product.py
      - test/test_indexing.py
      - test/test_ops.py
      - test/test_ops_unbacked.py
      - test/test_out_dtype_op.py
      - test/test_reductions.py
      - test/test_scatter_gather_ops.py
      - test/test_segment_reductions.py
      - test/test_shape_ops.py
      - test/test_sort_and_select.py
      - test/test_tensor_creation_ops.py
      - test/test_tensor_iterator.py
      - test/test_torch.py
      - test/test_unary_ufuncs.py
      - test/test_view_ops.py
      - test/test_foreach.py
      - test/test_function_schema.py
      - test/test_namedtuple_return_api.py
      - test/test_native_functions.py
      - test/test_schema_check.py
      - test/test_type_info.py
      - test/test_type_promotion.py
      - test/test_autocast.py
      - test/test_sparse.py
      - test/test_sparse_csr.py
      - test/test_sparse_semi_structured.py
      - test/test_nestedtensor.py
      - test/test_masked.py
      - test/test_maskedtensor.py
      - test/test_namedtensor.py
      - test/complex_tensor/test_complex_tensor.py
      - test/test_complex.py

  distributed:
    shards: 1
    execution: serial
    workers: 1
    paths:
      - test/distributed

  graph:
    shards: 1
    execution: concurrent
    workers: 8
    paths:
      - test/dynamo
    files:
      - test/higher_order_ops/test_invoke_subgraph.py

  others:
    shards: 1
    execution: concurrent
    workers: 8
