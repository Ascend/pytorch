# Nightly test categories — categorization + execution config (full-scan mode).
#
# In full-scan mode (nightly.yml full_scan: true), this file is NOT a whitelist.
# ALL test_*.py files under pytorch/test/ are scanned; the files/paths below
# assign files to categories. Unmatched files go to 'others' (catch-all).
#
# paths:  directories under pytorch/test/ to recursively scan for test_*.py.
#          e.g. [test/nn, test/optim] -> all test_*.py under those dirs.
# files:  exact file paths under pytorch/test/ to include.
#          Takes priority over paths (first match wins).
#
# Classification is 3-pass, first-match-wins:
#   1. files:  exact match across all categories
#   2. paths:  directory prefix match for remaining files
#   3. others: any unmatched test_*.py (catch-all)
#
# In whitelist mode (PR / receive-trigger.yml), only listed files are collected.

categories:
  core:
    workers: 32
    execution: concurrent
    paths:
      - test/nn
      - test/optim
      - test/autograd
      - test/profiler
    files:
      - test/test_cpp_api_parity.py
      - test/test_modules.py
      - test/test_native_mha.py
      - test/test_nn.py
      - test/test_nnapi.py
      - test/test_transformers.py
      - test/test_varlen_attention.py
      - test/test_functional_optim.py
      - test/test_optim.py
      - test/test_autograd.py
      - test/test_autograd_fallback.py
      - test/test_expanded_weights.py
      - test/test_functional_autograd_benchmark.py
      - test/test_functionalization_of_rng_ops.py
      - test/test_ops_fwd_gradients.py
      - test/test_ops_gradients.py
      - test/test_flop_count.py
      - test/test_itt.py
      - test/test_throughput_benchmark.py

  tensor:
    workers: 32
    execution: concurrent
    files:
      - test/test_as_strided.py
      - test/test_binary_ufuncs.py
      - test/test_ops_unbacked.py
      - test/test_segment_reductions.py
      - test/test_foreach.py
      - test/test_function_schema.py
      - test/test_namedtuple_return_api.py
      - test/test_native_functions.py
      - test/test_type_info.py
      - test/test_type_promotion.py

  distributed:
    workers: 1
    execution: serial
    paths:
      - test/distributed

  graph:
    workers: 32
    execution: concurrent
    paths:
      - test/fx
      - test/dynamo
      - test/inductor
      - test/export
      - test/functorch
      - test/higher_order_ops
      - test/cpython
    files:
      - test/test_fx.py
      - test/test_fx_experimental.py
      - test/test_fx_graph_print.py
      - test/test_fx_passes.py
      - test/test_fx_reinplace_pass.py
      - test/test_dispatch.py
      - test/test_functionalization.py
      - test/test_hop_infra.py
      - test/test_meta.py
      - test/test_proxy_tensor.py
      - test/test_sympy_utils.py
      - test/test_model_exports_to_core_aten.py
      - test/test_prims.py
      - test/test_compile_benchmark_util.py
      - test/distributed/test_inductor_compile_collectives.py

  others:
    workers: 32
    execution: concurrent
