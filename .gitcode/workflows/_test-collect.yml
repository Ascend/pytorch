name: Test Collect

on:
  workflow_call:
    inputs:
      case_paths_config:
        required: false
        type: string
        default: ''
        description: 'Path (relative to repo root) to whitelist YAML. Empty = scan all test_*.py files.'
      docker_image:
        required: false
        type: string
        default: 'swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch_master_a2_aarch64_builder:20260704'
        description: Docker image for running tests
      runner_label:
        required: false
        type: string
        default: 'npu=8'
        description: 'Runner scheduling label, e.g. npu=8'
      hw_classification:
        required: false
        type: string
        default: 'ACCELERATOR'
        description: >-
          Space-separated hardware classification filters passed to pytest
          --collect-only (e.g., "ACCELERATOR" or "GENERIC ACCELERATOR").
          Valid values: GENERIC ACCELERATOR CPU CUDA MPS XPU.
      full_scan:
        required: false
        type: string
        default: 'false'
        description: >-
          'true' 时扫描全部 test_*.py 文件，case-paths-config 作为分类映射
          （paths + files）而非白名单，未匹配文件归入 'others'。
      skip_list:
        required: false
        type: string
        default: ''
        description: >-
          Path(s) (relative to repo root) to skip list files. Newline-separated
          for multiple files. When set, matching nodeids are removed after
          collection and before sharding. When empty, no skip filtering is
          applied. Supports JSONL, JSON {skip_nodeids:[...]}, JSON array,
          and JSON {nodeid: {reason:...}} formats.
      device_env:
        required: false
        type: string
        default: 'privateuse1'
        description: >-
          Comma-separated device types exported as
          PYTORCH_TESTING_DEVICE_ONLY_FOR during collection. Must match the
          execution phase value.
    outputs:
      core_matrix:
        description: Core shard matrix JSON
        value: ${{ jobs.collect.outputs.core_matrix }}
      tensor_matrix:
        description: Tensor shard matrix JSON
        value: ${{ jobs.collect.outputs.tensor_matrix }}
      distributed_matrix:
        description: Distributed shard matrix JSON
        value: ${{ jobs.collect.outputs.distributed_matrix }}
      graph_matrix:
        description: Graph shard matrix JSON
        value: ${{ jobs.collect.outputs.graph_matrix }}
      others_matrix:
        description: Others shard matrix JSON
        value: ${{ jobs.collect.outputs.others_matrix }}

jobs:
  collect:
    runs-on: [self-hosted, "${{ inputs.runner_label }}"]
    defaults:
      run:
        shell: bash
    container:
      image: ${{ inputs.docker_image }}
      options: --user root --privileged --security-opt label=disable --volume /usr/local/Ascend:/usr/local/Ascend --volume /usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi
    env:
      # 华为云 pip 镜像源在容器内 SSL 证书校验失败，加 PIP_TRUSTED_HOST 跳过该源证书校验。
      PIP_INDEX_URL: https://mirrors.huaweicloud.com/repository/pypi/simple
      PIP_TRUSTED_HOST: mirrors.huaweicloud.com
    outputs:
      core_matrix: ${{ steps.build_matrix.outputs.core_matrix }}
      tensor_matrix: ${{ steps.build_matrix.outputs.tensor_matrix }}
      distributed_matrix: ${{ steps.build_matrix.outputs.distributed_matrix }}
      graph_matrix: ${{ steps.build_matrix.outputs.graph_matrix }}
      others_matrix: ${{ steps.build_matrix.outputs.others_matrix }}

    steps:
      - name: Download PyTorch test directory
        uses: download-artifact
        with:
          name: pytorch-test
          path: ./

      - name: Extract PyTorch test directory
        run: |
          tar -xzf pytorch-test.tar.gz
          rm pytorch-test.tar.gz
          echo "test dir extracted: $(du -sh pytorch/test | cut -f1)"

      - name: Download wheels
        uses: download-artifact
        with:
          name: packages-pytorch
          path: ./

      - name: Extract and install wheels
        run: |
          mkdir -p /tmp/wheels
          tar -xzf wheels.tar.gz -C /tmp/wheels
          rm wheels.tar.gz
          # torch 版本从 build 阶段下发的 torch_npu_info.json 读取，与编译期严格一致
          TORCH_SPEC=$(python3 -c "
          import json
          try:
              d = json.load(open('torch_npu_info.json'))
              print(d.get('torch_spec', ''))
          except Exception:
              print('')
          " 2>/dev/null || echo "")
          if [ -z "${TORCH_SPEC}" ]; then
            echo "ERROR: 未能从 torch_npu_info.json 读取 torch_spec（制品缺失或格式异常）"
            exit 1
          fi
          echo "Resolved torch from torch_npu_info.json: ${TORCH_SPEC}"

          # pip 加重试，规避多 job 并发拉 nightly 源时的瞬时网络故障
          for i in 1 2 3; do
            if python3 -m pip install --retries 5 --timeout 120 "torch==${TORCH_SPEC}" --extra-index-url https://download.pytorch.org/whl/nightly/cpu; then
              break
            fi
            if [ "${i}" = "3" ]; then
              echo "ERROR: pip install torch failed after 3 attempts"
              exit 1
            fi
            echo "pip install torch failed (attempt ${i}/3), retrying in $((i * 20))s..."
            sleep $((i * 20))
          done
          python3 -m pip install --no-deps /tmp/wheels/torch_npu*.whl
          python3 -m pip install --no-deps /tmp/wheels/torchvision-*.whl || echo "WARNING: torchvision wheel not found in tarball"

      - name: Checkout test scripts from trigger commit
        uses: checkout
        with:
          repository: https://gitcode.com/${{ atomgit.repository }}.git
          # 用触发提交 SHA 而非 master，保证脚本版本与工作流版本自洽
          ref: ${{ atomgit.sha }}
          path: ci-scripts
          fetch-depth: 1

      - name: Collect and shard test cases
        id: collect_cases
        run: |
          # CANN 环境初始化：探测并 source set_env.sh，坏环境立即中止（防大面积 561103）
          _CANN_SET_ENV=""
          for _p in /usr/local/Ascend/ascend-toolkit/set_env.sh \
                    /usr/local/Ascend/cann/set_env.sh \
                    /usr/local/Ascend/nnae/set_env.sh; do
            if [ -f "${_p}" ]; then _CANN_SET_ENV="${_p}"; break; fi
          done
          if [ -z "${_CANN_SET_ENV}" ]; then
            _CANN_SET_ENV=$(find /usr/local/Ascend -maxdepth 3 -name set_env.sh 2>/dev/null | head -1)
          fi
          if [ -z "${_CANN_SET_ENV}" ]; then
            echo "ERROR: 未找到 CANN set_env.sh，环境坏损，拒绝继续"
            exit 1
          fi
          echo "source CANN env: ${_CANN_SET_ENV}"
          source "${_CANN_SET_ENV}"
          if [ -z "${ASCEND_OPP_PATH}" ] || [ ! -d "${ASCEND_OPP_PATH}" ]; then
            echo "ERROR: ASCEND_OPP_PATH=${ASCEND_OPP_PATH} 未设置或目录不存在，CANN 算子包异常"
            exit 1
          fi

          export PYTHONPATH="${{ atomgit.workspace }}/ci-scripts/.gitcode/scripts:${PYTHONPATH}"

          CASE_PATHS_CONFIG='${{ inputs.case_paths_config }}'

          echo "=== Collecting all test cases ==="
          echo "Case paths config: ${CASE_PATHS_CONFIG:-<scan all>}"

          CONFIG_ARG=""
          if [ -n "${CASE_PATHS_CONFIG}" ]; then
            CONFIG_ARG="--case-paths-config ${{ atomgit.workspace }}/ci-scripts/${CASE_PATHS_CONFIG}"
          fi

          FULL_SCAN_ARG=""
          if [ "${{ inputs.full_scan }}" = "true" ]; then
            FULL_SCAN_ARG="--full-scan"
          fi

          SKIP_LIST_ARG=""
          SKIP_LIST_INPUT='${{ inputs.skip_list }}'
          if [ -n "${SKIP_LIST_INPUT}" ]; then
            for skip_path in ${SKIP_LIST_INPUT}; do
              FULL_PATH="${{ atomgit.workspace }}/ci-scripts/${skip_path}"
              if [ -f "${FULL_PATH}" ]; then
                SKIP_LIST_ARG="${SKIP_LIST_ARG} --skip-list ${FULL_PATH}"
                echo "Skip list: ${skip_path}"
              else
                echo "WARNING: skip list file not found: ${FULL_PATH}"
              fi
            done
          fi

          python3 ${{ atomgit.workspace }}/ci-scripts/.gitcode/scripts/collect_all_cases.py \
            --test-dir ${{ atomgit.workspace }}/pytorch/test \
            --hw-classification ${{ inputs.hw_classification }} \
            ${CONFIG_ARG} \
            ${FULL_SCAN_ARG} \
            ${SKIP_LIST_ARG} \
            --regular-threshold 25000 \
            --distributed-threshold 1000 \
            --device-env "${{ inputs.device_env }}" \
            --output-dir ${{ atomgit.workspace }}/cases-shards \
            --error-log-dir ${{ atomgit.workspace }}/collection_errors \
            --parallel 32 \
            2>&1 | tee /tmp/collect_cases.log

          echo "=== Generated shard files ==="
          ls -la ${{ atomgit.workspace }}/cases-shards/

          echo "=== Collection summary ==="
          cat ${{ atomgit.workspace }}/cases-shards/cases_collection_summary.json

          # 打印各类目用例数统计
          python3 -c "
          import json
          d = json.load(open('${{ atomgit.workspace }}/cases-shards/cases_collection_summary.json'))
          cats = d.get('categories', {})
          print('=== 用例数统计 ===')
          for cat in ['core', 'tensor', 'distributed', 'graph', 'others']:
              c = cats.get(cat, {})
              print(f'  {cat}: {c.get(\"total_cases\", 0)} 用例 / {c.get(\"total_files\", 0)} 文件')
          print(f'  总计: {d.get(\"total_cases\", 0)} 用例 / {d.get(\"total_files\", 0)} 文件')
          print(f'  跳过: {d.get(\"total_skipped\", 0)} 用例')
          "

          # 提取各类目状态到 job outputs
          python3 -c "
          import json
          d = json.load(open('${{ atomgit.workspace }}/cases-shards/cases_collection_summary.json'))
          cats = d.get('categories', {})
          print(f'total_cases={d.get(\"total_cases\", 0)}')
          for cat in ['core', 'tensor', 'distributed', 'graph', 'others']:
              c = cats.get(cat, {})
              has = 'true' if c.get('total_cases', 0) > 0 else 'false'
              print(f'has_{cat}={has}')
          " >> "$ATOMGIT_OUTPUT"

      - name: Build shard matrices
        id: build_matrix
        run: |
          python3 -c "
          import json
          d = json.load(open('${{ atomgit.workspace }}/cases-shards/cases_collection_summary.json'))
          cats = d.get('categories', {})

          for cat in ['core', 'tensor', 'distributed', 'graph', 'others']:
              c = cats.get(cat, {})
              n = c.get('num_shards', 0)
              w = c.get('workers', 32)
              matrix = json.dumps(list(range(1, n + 1))) if n > 0 else '[]'
              print(f'{cat}_matrix={matrix}')
              print(f'{cat}_num_shards={n}')
              print(f'{cat}_workers={w}')

          # 静态矩阵上限保护：与 pytorch_ci_trigger.yml 中各类目 matrix 槽位数
          # 一致（需同步维护）。实际分片数超上限时立即 fail——否则超出部分会被
          # 静默漏跑（静态矩阵不会产生对应 job，分片文件存在性检查也拦不住）。
          import sys
          CAPS = {'core': 4, 'tensor': 4, 'distributed': 6, 'graph': 2, 'others': 1}
          violations = []
          for cat, cap in CAPS.items():
              n = cats.get(cat, {}).get('num_shards', 0)
              if n > cap:
                  violations.append(f'{cat}: num_shards={n} > cap={cap}')
          if violations:
              print('ERROR: shard count exceeds static matrix cap.', file=sys.stderr)
              print('Bump BOTH the matrix in pytorch_ci_trigger.yml AND CAPS here:', file=sys.stderr)
              for v in violations:
                  print(f'  {v}', file=sys.stderr)
              sys.exit(1)
          " >> "$ATOMGIT_OUTPUT"

      - name: Upload cases shard JSONs
        uses: upload-artifact
        with:
          name: cases-shards
          path: cases-shards/
          retention-days: 7

      - name: Upload collection error logs
        if: ${{ always() }}
        uses: upload-artifact
        with:
          name: collection-errors
          path: collection_errors/
          retention-days: 7
