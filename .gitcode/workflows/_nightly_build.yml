name: nightly_build

on:
  workflow_call:
    inputs:
      PYTHON_VERSION:
        description: Python version
        required: false
        type: string
      NIGHTLY_DATE:
        description: Nightly date YYYYMMDD, overrides torch date parsed from requirements.txt
        required: false
        type: string
        default: ""
      PYTORCH_BRANCH:
        description: PyTorch source branch
        required: false
        type: string
      MAX_JOBS:
        description: C++ compile parallel jobs
        required: false
        type: string
      TORCH_NPU_WHEEL_ARTIFACT_DIR:
        description: torch-npu wheel artifact directory
        required: false
        type: string
      DOCKER_IMAGE:
        description: Docker image for building
        required: false
        type: string
      CONTAINER_OPTIONS:
        description: Container options
        required: false
        type: string

jobs:
  build:
    name: build
    select: selected_by_default
    runs-on: [ self-hosted, op_plugin, arm, cpu=32 ]
    container:
      image: ${{ inputs.DOCKER_IMAGE }}
      options: ${{ inputs.CONTAINER_OPTIONS }}

    outputs:
      wheel: ${{ steps.build.outputs.wheel }}
      status: ${{ steps.build.outputs.status }}
    steps:
      - name: checkout
        uses: checkout

      - name: Write build environment info
        run: |
          echo "=== Build Environment Info ===" > build_msg.txt
          echo "Python Version:" >> build_msg.txt
          python3.11 --version >> build_msg.txt 2>&1
          echo "CMake Version:" >> build_msg.txt
          cmake3 --version 2>/dev/null | head -1 >> build_msg.txt || cmake --version 2>/dev/null | head -1 >> build_msg.txt
          echo "GCC Version:" >> build_msg.txt
          gcc --version | head -1 >> build_msg.txt
          echo "ccache Version:" >> build_msg.txt
          ccache --version | head -1 >> build_msg.txt
          echo "=== Build Info End ===" >> build_msg.txt

      - name: Install PyTorch
        run: |
          NIGHTLY_DATE_ARG=""
          if [ -n "${{ inputs.NIGHTLY_DATE }}" ]; then
            NIGHTLY_DATE_ARG="--nightly-date ${{ inputs.NIGHTLY_DATE }}"
          fi
          python3.11 .gitcode/scripts/install_pytorch_from_requirements.py \
            --arch aarch64 \
            --python-tag cp311 \
            --python-exe python3.11 \
            ${NIGHTLY_DATE_ARG}

      - name: Build torch_npu wheel
        id: build
        env:
          MAX_JOBS: ${{ inputs.MAX_JOBS }}
          DISABLE_INSTALL_TORCHAIR: "FALSE"
          BUILD_WITHOUT_SHA: "1"
        run: |
          export OMP_NUM_THREADS=32
          export CCACHE_BASEDIR="${ATOMGIT_WORKSPACE}"
          source .gitcode/scripts/ccache_env.sh
          # release/2.15 -> 2.15.0 (build.sh --torch= expects X.Y.Z)
          TORCH_VER=$(echo "${{ inputs.PYTORCH_BRANCH }}" | sed 's|.*/||')
          if echo "${TORCH_VER}" | grep -Eq '^[0-9]+\.[0-9]+$'; then
            TORCH_VER="${TORCH_VER}.0"
          fi
          bash ci/build.sh --python="3.11" --torch="${TORCH_VER}" 2>&1 | tee /tmp/build_torch_npu.log
          BUILD_STATUS=${PIPESTATUS[0]}
          ccache -s 2>&1
          echo "${BUILD_STATUS}" > build_status.txt
          echo "status=${BUILD_STATUS}" >> $ATOMGIT_OUTPUT
          if [ ${BUILD_STATUS} -eq 0 ]; then
            WHL=$(ls dist/*.whl 2>/dev/null | head -1)
            echo "wheel=${WHL}" >> $ATOMGIT_OUTPUT
            echo "Build succeeded: ${WHL}"
          else
            echo "Build failed with exit code ${BUILD_STATUS}"
            echo "wheel=N/A" >> $ATOMGIT_OUTPUT
          fi
          WHL=$(ls dist/*.whl 2>/dev/null | head -1)
          echo "Wheel: ${WHL##*/}" >> build_msg.txt
          exit ${BUILD_STATUS}

      - name: Upload torch-npu wheel as artifact
        uses: upload-artifact
        with:
          name: torch-npu-wheel
          path: "dist/*.whl"
          retention-days: 14
          overwrite: true

      - name: Upload build_msg.txt as artifact
        uses: upload-artifact
        with:
          name: build-msg
          path: build_msg.txt
          retention-days: 14
          overwrite: true
