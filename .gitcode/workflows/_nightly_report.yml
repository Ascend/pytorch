name: nightly_report

on:
  workflow_call:
    inputs:
      PYTORCH_BRANCH:
        description: PyTorch source branch
        required: false
        type: string
      CONTAINER_OPTIONS:
        description: Container options
        required: false
        type: string
      # 调度标签 (变量�?: 报告任务默认调度到编译机
      RUNNER_LABEL:
        required: false
        type: string
        default: "npu=1"

jobs:
  report:
    name: report
    select: always
    runs-on: [ self-hosted, "${{ inputs.RUNNER_LABEL }}" ]
    container:
      image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch_master_a2_aarch64_builder:20260704
      options: ${{ inputs.CONTAINER_OPTIONS }}
    steps:
      - name: checkout
        uses: checkout

      - name: Download cases-shards
        uses: download-artifact
        with:
          name: cases-shards
          path: cases-shards

      - name: Download all shard test reports
        uses: download-artifact
        continue-on-error: true
        with:
          pattern: "test-reports-*"
          path: .

      - name: Generate Markdown and HTML reports
        run: |
          python3.10 .gitcode/scripts/nightly_generate_npu_full_test_report.py \
            --reports-root . \
            --output-markdown npu-full-test-summary.md \
            --output-json npu-full-test-summary.json \
            --output-html npu-full-test-report.html \
            --pytorch-version "${{ inputs.PYTORCH_BRANCH }}" \
            --torch-npu-whl "${{ inputs.PYTORCH_BRANCH }}" \
            --shard-matrix-json '["dist-2card-1","dist-2card-2","dist-1","reg-npu-1","reg-npu-2","reg-npu-3","reg-npu-4","reg-npu-5","reg-npu-6","reg-npu-7","reg-npu-8","reg-npu-9","reg-npu-10"]' \
            --cases-summary cases-shards/cases_collection_summary.json \
            --cases-by-file-dir cases-shards \
            --docker-image "swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch_master_a2_aarch64_builder:20260704" \
            --runner "self-hosted"

          echo "=== Test Report Summary ==="
          cat npu-full-test-summary.md

      - name: Upload reports as artifact
        uses: upload-artifact
        with:
          name: npu-full-test-report
          path: |
            npu-full-test-summary.md
            npu-full-test-summary.json
            npu-full-test-report.html
          retention-days: 60
          overwrite: true
