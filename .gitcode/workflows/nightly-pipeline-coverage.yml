name: TorchNPU Coverage Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  push:
    branches: [ci-test, ci-test-coverage]
    paths:
      - ".gitcode/workflows/nightly-pipeline-coverage.yml"
      - ".gitcode/workflows/_pytorch_coverage.yml"
      - ".gitcode/workflows/_nightly_coverage_test_job.yml"
      - ".gitcode/workflows/_nightly_coverage_merge.yml"
      - ".gitcode/scripts/coverage_pytest_plugin.py"
      - ".gitcode/scripts/coverage_report.py"
  workflow_dispatch:
    inputs:
      coverage_source:
        description: "覆盖率统计的目标包"
        required: false
        default: "torch_npu"
        type: string
      obs_object_prefix:
        description: "release.tar.gz 的 OBS 归档前缀"
        required: false
        default: "pta/coverage/torch_npu/latest/"
        type: string
      shard_strategy:
        description: "用例分片策略: contiguous / round-robin"
        required: false
        default: "round-robin"
        type: string

concurrency:
  enable: true
  max: 1
  exceed-action: QUEUE

permissions:
  project: read
  repository: read
  id-token: write
  pr: write
  note: write
  action: read

stages:
  coverage:
    name: coverage
    select: selected_by_default
    jobs:
      coverage:
        name: coverage
        uses: Ascend/pytorch/.gitcode/workflows/_pytorch_coverage.yml@ci-test
        with:
          COVERAGE_SOURCE: "${{ inputs.coverage_source || 'torch_npu' }}"
          OBS_OBJECT_PREFIX: "${{ inputs.obs_object_prefix || 'pta/coverage/torch_npu/latest/' }}"
          SHARD_STRATEGY: "${{ inputs.shard_strategy || 'round-robin' }}"
