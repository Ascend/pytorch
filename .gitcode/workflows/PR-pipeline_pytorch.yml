name: PR-pipeline_pytorch

concurrency:
  max: 120
  exceed-action: QUEUE
  enable: true
  preemption:
    enable: true
    events: [mr_id]

on:
  pr_comment:
    types: [created]
    keyword: '^compile$'

  pull_request_comment:
    types: [created]
    branches: [ 'master', 'v2.7.1', 'v2.9.0', 'v2.10.0', 'v2.11.0', 'v2.12.0', 'v2.13.0', '*-26.1.0', '*-26.2.0' ]
    comments: [ '^compile$' , '^compile_torchair$', '^compile_inductor$' ]

env:
  repo: ${{ atomgit.event.repository.name }}
  pr_id: ${{ atomgit.event.pull_request.number }}
  target_branch: ${{ atomgit.event.pull_request.base.ref }}
  org_name: "Ascend"
  img_master_arm: "pytorch_master_a2_aarch64_builder:20260922"
  img_2_7_1_arm: "pytorch_2.7.1_a2_aarch64_builder:20260804"
  img_2_9_0_arm: "pytorch_2.9.0_a2_aarch64_builder:20260901"
  img_2_10_0_arm: "pytorch_2.10.0_a2_aarch64_builder:20260804"
  img_2_11_0_arm: "pytorch_2.11.0_a2_aarch64_builder:20260804"
  img_2_12_0_arm: "pytorch_2.12.0_a2_aarch64_builder:20260804"
  img_2_13_0_arm: "pytorch_2.13.0_a2_aarch64_builder:20260922"
  img_2_14_0_arm: "pytorch_2.14.0_a2_aarch64_builder:20260922"
  img_master_x86: "pytorch_master_a1_x86_64_builder:20260922"
  img_2_7_1_x86: "pytorch_2.7.1_a1_x86_64_builder:20260804"
  img_2_9_0_x86: "pytorch_2.9.0_a1_x86_64_builder:20260901"
  img_2_10_0_x86: "pytorch_2.10.0_a1_x86_64_builder:20260704"
  img_2_11_0_x86: "pytorch_2.11.0_a1_x86_64_builder:20260704"
  img_2_12_0_x86: "pytorch_2.12.0_a1_x86_64_builder:20260704"
  img_2_13_0_x86: "pytorch_2.13.0_a1_x86_64_builder:20260922"
  img_2_14_0_x86: "pytorch_2.14.0_a1_x86_64_builder:20260922"

permissions:
  project: read
  repository: read
  id-token: write
  pr: write
  note: write
  action: read

stages:
  stage_1:
    name: only_doc
    jobs:
      Detect_file_changes:
        name: Detect_file_changes
        runs-on: [ self-hosted, default, x86, cpu=16 ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/pytorch_images_x86/pytorchx86:v_03
        outputs:
          need_build_ut: ${{ steps.set-skip.outputs.need_build_ut }}
        steps:
          - name: checkout
            uses: checkout
            with:
              ref: refs/merge-requests/${{ env.pr_id }}/merge
              fetch-depth: 0
              allow-unsafe-pr-checkout: true
          - name: Only_doc_commit
            id: filter
            uses: paths-changes-filter
            with:
              event-name: 'pull_request'
              base: ${{ atomgit.event.pull_request.base.ref }}
              repo: ${{ atomgit.repository }}
              number: ${{ env.pr_id }}
              token: ${{ secrets.GIT_TOKEN }}
              list-files: json
              predicate-quantifier: every
              filters: |
                changed:
                  - '**'
                non-doc:
                  - '!**/*.md'
                  - '!**/*.rst'
                  - '!**/*.log'
                  - '!**/*.png'
                  - '!**/*.jpg'
                  - '!**/*.doc'
                  - '!**/*.eddx'
                  - '!**/*.svg'

          - name: set build skip flag
            id: set-skip
            run: |
              echo "changed: ${{ steps.filter.outputs.changed_files }}"
              echo "non-doc: ${{ steps.filter.outputs.non-doc }}"
              if [ "${{ steps.filter.outputs.non-doc }}" = "true" ]; then
                echo "need_build_ut=yes" >> "$ATOMGIT_OUTPUT"
              else
                echo "need_build_ut=no" >> "$ATOMGIT_OUTPUT"
              fi
              echo "${{ steps.filter.outputs.changed_files }}" | tr -d '[]" ' | tr ',' '\n' > modify_files.txt
              cat modify_files.txt
          - name: upload modify_files.txt
            uses: upload-artifact
            with:
              name: modify_files.txt
              path: modify_files.txt
              overwrite: true

      associate_pr_comment:
        name: associate_pr_comment
        select: selected_by_default
        runs-on: [ self-hosted, default, x86, cpu=16 ]
        steps:
          - name: associate-pr-comment
            uses: associate-pr-comment
          - name: pre_pipeline
            id: pre_pipeline
            uses: cann/.gitcode/actions/pre-pipeline@689551d6b29a77d8c2a005b8f1b3883db24820ef
            with:
              owner: ${{ env.org_name }}
              repo: ${{ atomgit.event.repository.name }}
              pr_number: ${{ atomgit.event.pull_request.number }}
              token: ${{ secrets.GIT_TOKEN }}
              apply_label: 'true'
              run_url: https://gitcode.com/${{ env.org_name }}/${{ atomgit.event.repository.name }}/actions/runs/${{ atomgit.workflow_run_id }}

  stage_2:
    name: CodeCheck
    select: selected_by_default
    jobs:
      lintrunner:
        name: CodeCheck_lintrunner
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' }}
        runs-on: [ self-hosted, default, x86, cpu=16 ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/atlas-ci/common:latest
        steps:
          - name: checkout
            uses: checkout
            with:
              ref: refs/merge-requests/${{ env.pr_id }}/merge
              fetch-depth: 0
              allow-unsafe-pr-checkout: true

          - name: lintrunner
            run: |
              # ====================== 判断是否存在 lintrunner 配置 ======================
              { echo "------------------------------------检查是否存在 .lintrunner.toml-----------------------------------"; } 2>/dev/null
              if [ ! -f ".lintrunner.toml" ]; then
                  echo "✅ 未找到.lintrunner.toml，跳过代码检查，直接成功"
                  exit 0
              fi
              echo "✅ 找到 lintrunner 配置文件，开始执行检查"
              { echo "------------------------------------2. show changes files-----------------------------------"; } 2>/dev/null
              git fetch origin ${{ env.target_branch }}
              git diff origin/${{ env.target_branch }} HEAD --name-only
              { echo "------------------------------------3. install lintrunner-----------------------------------"; } 2>/dev/null
              pip3 install uv -i https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple
              # 启用缓存
              export UV_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple/
              pip3 config set global.index-url https://mirrors.huaweicloud.com/repository/pypi/simple
              pip3 install --upgrade pip
              pip3 install lintrunner
              lintrunner --version
              { echo "------------------------------------4. init lintrunner-----------------------------------"; } 2>/dev/null
              lintrunner init
              { echo "------------------------------------5. lintrunner changes files-----------------------------------"; } 2>/dev/null
              { echo "--------本地运行指导查看 https://gitcode.com/Ascend/pytorch/blob/master/CONTRIBUTING.md#%E6%9C%AC%E5%9C%B0%E9%9D%99%E6%80%81%E6%A3%80%E6%9F%A5"; } 2>/dev/null
              git diff origin/${{ env.target_branch }} HEAD --name-only --diff-filter=AM -z | xargs -0 lintrunner

      sca-pr:
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' }}
        runs-on: [ self-hosted, default, x86, cpu=16 ]
        steps:
          - name: checkout
            uses: checkout
          - name: Run SCA PR scan
            uses: openlibing/sca-action/sca-pr-action@v1.0.0
            with:
              project-name: AscendForPyTorch

      malicious-scan:
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' }}
        runs-on: [ self-hosted, default, x86, cpu=16 ]
        steps:
          - name: checkout
            uses: checkout
          - name: Run malicious code scan
            uses: openlibing/malicious-code-scan-action/malicious-code-pr-scan-action@v1.0.0
            with:
              repository-name: ${{ atomgit.repository }}
              pr-id: "${{ atomgit.event.pull_request.number }}"
              project-name: AscendForPyTorch

      img_select:
        name: img_select
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' }}
        runs-on: [ self-hosted, default, x86, cpu=16 ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/pytorch_images_x86/pytorchx86:v_03
        outputs:
          img_arm: ${{ steps.set-img.outputs.img_arm }}
          img_x86: ${{ steps.set-img.outputs.img_x86 }}
          target_branch: ${{ steps.set-img.outputs.target_branch }}
        steps:
          - name: set img
            id: set-img
            run: |
              echo "target_branch=${{ env.target_branch }}"
              img_branch=${target_branch//./_}
              img_branch=${img_branch//v/}
              img_branch=${img_branch%%-*}
              echo "img_branch=${img_branch}"
              img_arm_var="img_${img_branch}_arm"
              img_x86_var="img_${img_branch}_x86"
              echo "img_arm=${!img_arm_var}" >> "$ATOMGIT_OUTPUT"
              echo "img_x86=${!img_x86_var}" >> "$ATOMGIT_OUTPUT"
              echo "target_branch=${{ env.target_branch }}" >> "$ATOMGIT_OUTPUT"
              echo "img_arm=${!img_arm_var}"
              echo "img_x86=${!img_x86_var}"

      check_inductor:
        name: check_inductor
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' }}
        uses: .gitcode/workflows/check_inductor.yml

      check_distribution:
        name: check_distribution
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' }}
        uses: .gitcode/workflows/check_distribution.yml

      check_torchair:
        name: check_torchair
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' }}
        uses: .gitcode/workflows/find_torchair.yml

      check_patch:
        name: check_patch
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' }}
        uses: .gitcode/workflows/check_patch.yml

      get_count:
        name: get_count
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' }}
        uses: .gitcode/workflows/get_count.yml

  stage_3:
    name: Build
    select: selected_by_default
    jobs:
      Build_x86:
        name: Build_x86
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' }}
        uses: .gitcode/workflows/build_job.yml
        with:
          torch_branch: ${{ atomgit.event.pull_request.base.ref }}
          CP_DOCKER_IMG: ${{ jobs.img_select.outputs.img_x86 }}
          runs_on_arch: "x86"

      Build_arm:
        name: Build_arm
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' }}
        uses: .gitcode/workflows/build_job.yml
        with:
          torch_branch: ${{ jobs.img_select.outputs.target_branch }}
          CP_DOCKER_IMG: ${{ jobs.img_select.outputs.img_arm }}
          runs_on_arch: "arm"

      Build_x86_onetrack:
        name: Build_x86
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' && env.target_branch == 'master' }}
        uses: .gitcode/workflows/build_job.yml
        with:
          torch_branch: '2.13.0'
          CP_DOCKER_IMG: ${{ env.img_2_13_0_x86 }}
          runs_on_arch: "x86"

      Build_arm_onetrack:
        name: Build_arm
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' && env.target_branch == 'master' }}
        uses: .gitcode/workflows/build_job.yml
        with:
          torch_branch: '2.13.0'
          CP_DOCKER_IMG: ${{ env.img_2_13_0_arm }}
          runs_on_arch: "arm"

      Build_x86_torchair:
        name: Build_x86_torchair
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' && jobs.check_torchair.outputs.build_torchair == 'yes' && env.target_branch == 'v2.7.1' }}
        uses: .gitcode/workflows/build_torchair_job.yml
        with:
          torch_branch: ${{ atomgit.event.pull_request.base.ref }}
          CP_DOCKER_IMG: ${{ jobs.img_select.outputs.img_x86 }}
          runs_on_arch: "x86"

      Build_arm_torchair:
        name: Build_arm_torchair
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' && jobs.check_torchair.outputs.build_torchair == 'yes' && env.target_branch == 'v2.7.1' }}
        uses: .gitcode/workflows/build_torchair_job.yml
        with:
          torch_branch: ${{ jobs.img_select.outputs.target_branch }}
          CP_DOCKER_IMG: ${{ jobs.img_select.outputs.img_arm }}
          runs_on_arch: "arm"

      test_patch:
        name: test_patch
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' && jobs.check_patch.outputs.need_patch == 'yes' }}
        uses: .gitcode/workflows/test_patch_job.yml
        with:
          torch_branch: ${{ jobs.img_select.outputs.target_branch }}
          CP_DOCKER_IMG: ${{ jobs.img_select.outputs.img_x86 }}
          runs_on_arch: "x86"

  stage_4:
    name: UT
    select: selected_by_default
    jobs:
      UT_core_part_1:
        name: UT_core_part_1
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' && jobs.get_count.outputs.core > '0' }}
        uses: .gitcode/workflows/ut_job.yml
        with:
          torch_branch: ${{ atomgit.event.pull_request.base.ref }}
          CP_DOCKER_IMG: ${{ jobs.img_select.outputs.img_arm }}
          TEST_RANK: "1"
          TEST_WORLD_SIZE: "3"
          NPU_CORE: "yes"

      UT_core_part_2:
        name: UT_core_part_2
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' && jobs.get_count.outputs.core > '1' }}
        uses: .gitcode/workflows/ut_job.yml
        with:
          torch_branch: ${{ atomgit.event.pull_request.base.ref }}
          CP_DOCKER_IMG: ${{ jobs.img_select.outputs.img_arm }}
          TEST_RANK: "2"
          TEST_WORLD_SIZE: "3"
          NPU_CORE: "yes"

      UT_core_part_3:
        name: UT_core_part_3
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' && jobs.get_count.outputs.core > '2' }}
        uses: .gitcode/workflows/ut_job.yml
        with:
          torch_branch: ${{ atomgit.event.pull_request.base.ref }}
          CP_DOCKER_IMG: ${{ jobs.img_select.outputs.img_arm }}
          TEST_RANK: "3"
          TEST_WORLD_SIZE: "3"
          NPU_CORE: "yes"

      UT_core_part_213:
        name: UT_core_part_213
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' && jobs.get_count.outputs.core > '2' && env.target_branch == 'master' }}
        uses: .gitcode/workflows/ut_job.yml
        with:
          torch_branch: '2.13.0'
          CP_DOCKER_IMG: ${{ env.img_2_13_0_arm }}
          TEST_RANK: "1"
          TEST_WORLD_SIZE: "1"
          NPU_CORE: "yes"

      UT_select_01:
        name: UT_select_01
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' && jobs.get_count.outputs.select > '0' }}
        uses: .gitcode/workflows/ut_job.yml
        with:
          torch_branch: ${{ atomgit.event.pull_request.base.ref }}
          CP_DOCKER_IMG: ${{ jobs.img_select.outputs.img_arm }}
          NPU_CORE: "no"
          TEST_RANK: "1"
          TEST_WORLD_SIZE: "2"

      UT_select_02:
        name: UT_select_02
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' && jobs.get_count.outputs.select == '2' }}
        uses: .gitcode/workflows/ut_job.yml
        with:
          torch_branch: ${{ atomgit.event.pull_request.base.ref }}
          CP_DOCKER_IMG: ${{ jobs.img_select.outputs.img_arm }}
          NPU_CORE: "no"
          TEST_RANK: "2"
          TEST_WORLD_SIZE: "2"

      UT_select_213:
        name: UT_select_213
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' && jobs.get_count.outputs.select == '2' && env.target_branch == 'master' }}
        uses: .gitcode/workflows/ut_job.yml
        with:
          torch_branch: '2.13.0'
          CP_DOCKER_IMG: ${{ env.img_2_13_0_arm }}
          NPU_CORE: "no"

      UT_inductor_01:
        name: UT_inductor_01
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' && jobs.check_inductor.outputs.need_inductor == 'yes' && env.target_branch != 'master' }}
        uses: .gitcode/workflows/ut_job_inductor.yml
        with:
          torch_branch: ${{ atomgit.event.pull_request.base.ref }}
          CP_DOCKER_IMG: ${{ jobs.img_select.outputs.img_arm }}
          TEST_RANK: "1"
          TEST_WORLD_SIZE: "4"

      UT_inductor_02:
        name: UT_inductor_02
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' && jobs.check_inductor.outputs.need_inductor == 'yes' && env.target_branch != 'master' }}
        uses: .gitcode/workflows/ut_job_inductor.yml
        with:
          torch_branch: ${{ atomgit.event.pull_request.base.ref }}
          CP_DOCKER_IMG: ${{ jobs.img_select.outputs.img_arm }}
          TEST_RANK: "2"
          TEST_WORLD_SIZE: "4"

      UT_inductor_03:
        name: UT_inductor_03
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' && jobs.check_inductor.outputs.need_inductor == 'yes' && env.target_branch != 'master' }}
        uses: .gitcode/workflows/ut_job_inductor.yml
        with:
          torch_branch: ${{ atomgit.event.pull_request.base.ref }}
          CP_DOCKER_IMG: ${{ jobs.img_select.outputs.img_arm }}
          TEST_RANK: "3"
          TEST_WORLD_SIZE: "4"

      UT_inductor_04:
        name: UT_inductor_04
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' && jobs.check_inductor.outputs.need_inductor == 'yes' && env.target_branch != 'master' }}
        uses: .gitcode/workflows/ut_job_inductor.yml
        with:
          torch_branch: ${{ atomgit.event.pull_request.base.ref }}
          CP_DOCKER_IMG: ${{ jobs.img_select.outputs.img_arm }}
          TEST_RANK: "4"
          TEST_WORLD_SIZE: "4"

      UT_inductor_213:
        name: UT_inductor_213
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' && jobs.check_inductor.outputs.need_inductor == 'yes' && env.target_branch == 'master' }}
        uses: .gitcode/workflows/ut_job_inductor.yml
        with:
          torch_branch: '2.13.0'
          CP_DOCKER_IMG: ${{ env.img_2_13_0_arm }}
          TEST_RANK: "1"
          TEST_WORLD_SIZE: "1"

      UT_distributed_01:
        name: UT_distributed_01
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' && jobs.check_distribution.outputs.need_distribution == 'yes' }}
        uses: .gitcode/workflows/ut_job_distributed.yml
        with:
          torch_branch: ${{ atomgit.event.pull_request.base.ref }}
          CP_DOCKER_IMG: ${{ jobs.img_select.outputs.img_arm }}
          TEST_RANK: "1"
          TEST_WORLD_SIZE: "4"

      UT_distributed_02:
        name: UT_distributed_02
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' && jobs.check_distribution.outputs.need_distribution == 'yes' }}
        uses: .gitcode/workflows/ut_job_distributed.yml
        with:
          torch_branch: ${{ atomgit.event.pull_request.base.ref }}
          CP_DOCKER_IMG: ${{ jobs.img_select.outputs.img_arm }}
          TEST_RANK: "2"
          TEST_WORLD_SIZE: "4"

      UT_distributed_03:
        name: UT_distributed_03
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' && jobs.check_distribution.outputs.need_distribution == 'yes' }}
        uses: .gitcode/workflows/ut_job_distributed.yml
        with:
          torch_branch: ${{ atomgit.event.pull_request.base.ref }}
          CP_DOCKER_IMG: ${{ jobs.img_select.outputs.img_arm }}
          TEST_RANK: "3"
          TEST_WORLD_SIZE: "4"

      UT_distributed_04:
        name: UT_distributed_04
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' && jobs.check_distribution.outputs.need_distribution == 'yes' }}
        uses: .gitcode/workflows/ut_job_distributed.yml
        with:
          torch_branch: ${{ atomgit.event.pull_request.base.ref }}
          CP_DOCKER_IMG: ${{ jobs.img_select.outputs.img_arm }}
          TEST_RANK: "4"
          TEST_WORLD_SIZE: "4"

      UT_distributed_213:
        name: UT_distributed_213
        if : ${{ jobs.Detect_file_changes.outputs.need_build_ut == 'yes' && jobs.check_distribution.outputs.need_distribution == 'yes' && env.target_branch == 'master' }}
        uses: .gitcode/workflows/ut_job_distributed.yml
        with:
          torch_branch: '2.13.0'
          CP_DOCKER_IMG: ${{ env.img_2_13_0_arm }}
          TEST_RANK: "1"
          TEST_WORLD_SIZE: "1"

post:
  jobs:
    query_pipeline:
      steps:
        - name: query_pipeline
          id: query_pipeline
          uses: cann/.gitcode/actions/query-pipeline@689551d6b29a77d8c2a005b8f1b3883db24820ef
          with:
            owner: ${{ env.org_name }}
            repo: ${{ atomgit.event.repository.name }}
            run_id: ${{ atomgit.workflow_run_id }}
            token: ${{ secrets.GIT_TOKEN }}
            pr_number: ${{ atomgit.event.pull_request.number }}
            apply_label: 'true'
