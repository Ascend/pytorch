name: nightly_coverage_merge

on:
  workflow_call:
    inputs:
      # 覆盖率统计的目标包
      COVERAGE_SOURCE:
        required: false
        type: string
        default: "torch_npu"
      # OBS 归档前缀 (release.tar.gz 的对象前缀)
      OBS_OBJECT_PREFIX:
        required: false
        type: string
        default: "pta/coverage/torch_npu/latest/"
      # 分片覆盖率数据的 OBS 7 天缓存前缀 (需与 _nightly_coverage_test_job.yml 一致),
      # 合并成功后清理本次运行的该前缀
      OBS_SHARD_PREFIX:
        required: false
        type: string
        default: "pta/coverage/torch_npu/7day-cache/"
      OBS_BUCKET:
        required: false
        type: string
        default: "pta-pr"
      OBS_ENDPOINT:
        required: false
        type: string
        default: "obs.cn-north-4.myhuaweicloud.com"
      # 期望的分片数量 (与入口流水线的 stage_coverage job 数一致);
      # 实际收到的分片不足时视为不完整, 不提升为 latest
      EXPECTED_SHARDS:
        required: false
        type: string
        default: "13"
      CONTAINER_OPTIONS:
        required: false
        type: string
      # 调度标签: 合并 job 为轻量 CPU 任务, 复用报告机
      RUNNER_LABEL:
        required: false
        type: string
        default: "npu=1"

jobs:
  merge:
    name: merge-coverage
    select: always
    runs-on: [ self-hosted, "${{ inputs.RUNNER_LABEL }}" ]
    timeout-minutes: 180
    container:
      image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch_master_a2_aarch64_builder:20260922
      options: ${{ inputs.CONTAINER_OPTIONS }}
    defaults:
      run:
        shell: bash
    steps:
      - name: checkout
        uses: checkout

      - name: Download coverage shard data from OBS
        id: download_shards
        env:
          OBS_AK: ${{ secrets.ACCESSKEY }}
          OBS_SK: ${{ secrets.SECRETACCESSKEY }}
        run: |
          mkdir -p cov-dl cov-data
          echo "shard_count=0" >> $ATOMGIT_OUTPUT
          if [ -z "${OBS_AK}" ] || [ -z "${OBS_SK}" ]; then
            echo "错误: 未配置 ACCESSKEY / SECRETACCESSKEY, 无法取回分片覆盖率数据"
            exit 1
          fi
          if ! command -v obsutil >/dev/null 2>&1; then
            echo "错误: 镜像内没有 obsutil, 无法取回分片覆盖率数据"
            exit 1
          fi
          obsutil config -i="${OBS_AK}" -k="${OBS_SK}" -e="${{ inputs.OBS_ENDPOINT }}"

          SRC="obs://${{ inputs.OBS_BUCKET }}/${{ inputs.OBS_SHARD_PREFIX }}${{ atomgit.workflow_run_id }}/"
          if ! obsutil cp "${SRC}" cov-dl -r -f; then
            echo "错误: 从 OBS 下载分片覆盖率数据失败: ${SRC}"
            exit 1
          fi

          # 每个 <COVERAGE_SHARD>.tar.gz 解到 cov-data/<COVERAGE_SHARD>/ (去掉 tar 内层的 shard/ 前缀)
          count=0
          while IFS= read -r tarball; do
            name="$(basename "${tarball}" .tar.gz)"
            mkdir -p "cov-data/${name}"
            tar -xzf "${tarball}" -C "cov-data/${name}" --strip-components=1
            count=$((count + 1))
          done < <(find cov-dl -type f -name '*.tar.gz' | sort)
          echo "已解包分片覆盖率数据: ${count} 个 (期望 ${{ inputs.EXPECTED_SHARDS }} 个)"
          ls -la cov-data
          echo "shard_count=${count}" >> $ATOMGIT_OUTPUT
          if [ "${count}" -ne "${{ inputs.EXPECTED_SHARDS }}" ]; then
            echo "警告: 分片数量不完整 ($count/${{ inputs.EXPECTED_SHARDS }}), 本次不提升为 latest"
            echo "shards_complete=false" >> $ATOMGIT_OUTPUT
          else
            echo "shards_complete=true" >> $ATOMGIT_OUTPUT
          fi

      - name: Install coverage
        run: python3.10 -m pip install --trusted-host mirrors.huaweicloud.com coverage

      - name: Merge shard coverage
        id: merge
        if: ${{ steps.download_shards.outputs.shards_complete == 'true' }}
        env:
          REPO: ${{ atomgit.repository }}
          RUN_ID: ${{ atomgit.workflow_run_id }}
          EVENT: ${{ atomgit.event_name }}
        run: |
          ls -la cov-data 2>/dev/null || true
          INPUTS="$(cd cov-data 2>/dev/null && ls -d */ 2>/dev/null | sed 's:/$::' | sed 's:^:cov-data/:' | paste -sd, -)"
          echo "合并输入: ${INPUTS:-<空>}"
          RUN_ATTEMPT="${ATOMGIT_RUN_ATTEMPT:-1}"

          set +e
          python3.10 .gitcode/scripts/coverage_report.py merge \
            --inputs "${INPUTS}" \
            --out-dir coverage-out \
            --source "${{ inputs.COVERAGE_SOURCE }}" \
            --workflow-name "torch_npu_coverage_nightly" \
            --repository "${REPO}" \
            --run-id "${RUN_ID}" \
            --run-attempt "${RUN_ATTEMPT}" \
            --event "${EVENT}" \
            --sha "$(git rev-parse HEAD 2>/dev/null || echo '')" \
            --summary-file coverage-summary.md
          STATUS=$?
          set -e
          echo "merge_status=${STATUS}" >> $ATOMGIT_OUTPUT
          echo "合并退出码: ${STATUS}"
          exit 0

      - name: Build covstub source snapshot
        if: ${{ steps.merge.outputs.merge_status == '0' }}
        run: |
          python3.10 .gitcode/scripts/coverage_report.py covstub \
            --src "${{ inputs.COVERAGE_SOURCE }}" \
            --test test \
            --out-dir coverage-out \
            --executed-dir "coverage-out/${{ inputs.COVERAGE_SOURCE }}@latest"

      - name: Package release archive
        id: pack
        if: ${{ steps.merge.outputs.merge_status == '0' }}
        run: |
          set -euo pipefail
          PKG="${{ inputs.COVERAGE_SOURCE }}"

          if [ ! -f "coverage-out/${PKG}@latest/manifest.json" ] || [ ! -d coverage-out/covstub ]; then
            echo "未产出合并结果, 跳过打包"
            exit 0
          fi

          tar -C coverage-out -czf release.tar.gz covstub "${PKG}@latest"
          ls -lh release.tar.gz
          tar -tzf release.tar.gz > release-files.txt
          if grep -qx "${PKG}@latest/manifest.json" release-files.txt; then
            echo "packed=1" >> $ATOMGIT_OUTPUT
            echo "已打包: release.tar.gz"
          else
            echo "警告: release.tar.gz 内容不完整 (缺少 manifest.json)"
          fi

      - name: Write job summary
        if: ${{ always() }}
        run: |
          if [ "${{ steps.download_shards.outputs.shards_complete }}" != "true" ]; then
            echo "## TorchNPU 覆盖率" >> $ATOMGIT_STEP_SUMMARY
            echo "本次未合并: 分片数量不完整 (${{ steps.download_shards.outputs.shard_count }}/${{ inputs.EXPECTED_SHARDS }}), 保留上一版 latest" >> $ATOMGIT_STEP_SUMMARY
            exit 0
          fi
          if [ -f coverage-summary.md ]; then
            cat coverage-summary.md >> $ATOMGIT_STEP_SUMMARY
          else
            echo "## TorchNPU 覆盖率" >> $ATOMGIT_STEP_SUMMARY
            echo "本次未产出覆盖率报告 (merge_status=${{ steps.merge.outputs.merge_status }})" >> $ATOMGIT_STEP_SUMMARY
          fi

      - name: oidc-auth
        if: ${{ steps.pack.outputs.packed == '1' }}
        uses: huaweicloud-oidc-auth
        with:
          audience: pta_pr_obs_for_pytorch
          region: cn-north-4
          agency_urn: iam::0d336831568090260fd5c01450729240:agency:pta_obs_pr_trust
          provider_urn: iam::0d336831568090260fd5c01450729240:oidcProvider:pta_obs_pr

      - name: Upload release archive to OBS
        if: ${{ steps.pack.outputs.packed == '1' }}
        uses: obs-upload
        with:
          endpoint: "${{ inputs.OBS_ENDPOINT }}"
          bucket: "${{ inputs.OBS_BUCKET }}"
          artifact-path: |
            release.tar.gz
          object-prefix: "${{ inputs.OBS_OBJECT_PREFIX }}"

      - name: Clean up shard staging on OBS
        if: ${{ always() && steps.pack.outputs.packed == '1' }}
        continue-on-error: true
        env:
          OBS_AK: ${{ secrets.ACCESSKEY }}
          OBS_SK: ${{ secrets.SECRETACCESSKEY }}
        run: |
          obsutil config -i="${OBS_AK}" -k="${OBS_SK}" -e="${{ inputs.OBS_ENDPOINT }}"
          TARGET="obs://${{ inputs.OBS_BUCKET }}/${{ inputs.OBS_SHARD_PREFIX }}${{ atomgit.workflow_run_id }}/"
          if obsutil rm -r -f "${TARGET}"; then
            echo "已清理分片暂存: ${TARGET}"
          else
            echo "警告: 清理分片暂存失败: ${TARGET}"
          fi
