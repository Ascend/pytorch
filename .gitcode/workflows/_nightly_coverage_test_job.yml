name: nightly_coverage_test_job

on:
  workflow_call:
    inputs:
      # Shard file name (under cases-shards/), e.g. regular_npu_cases_shard_1.json
      SHARD_FILE:
        required: true
        type: string
      # Test report directory (stores shard_*_cases.json and case logs locally), e.g. cov-reports-reg-npu-1
      REPORT_NAME:
        required: true
        type: string
      # Coverage shard identifier: used as the object name in the OBS 7day-cache (<COVERAGE_SHARD>.tar.gz)
      COVERAGE_SHARD:
        required: true
        type: string
      # Per-case timeout (seconds)
      CASE_TIMEOUT:
        required: true
        type: string
      # Number of cards per case (distributed cases): 2/4/8; leave empty for regular cases
      CARDS_PER_TEST:
        required: false
        type: string
        default: ""
      # Number of pytest-xdist workers for regular cases; leave empty for distributed cases
      MAX_WORKERS:
        required: false
        type: string
        default: ""
      # Target package for coverage
      COVERAGE_SOURCE:
        required: false
        type: string
        default: "torch_npu"
      # OBS 7-day cache prefix for shard coverage data
      OBS_SHARD_PREFIX:
        required: false
        type: string
        default: "pta/coverage/torch_npu/7day-cache/"
      # Target bucket and endpoint for shard coverage upload (must match _nightly_coverage_merge.yml)
      OBS_BUCKET:
        required: false
        type: string
        default: "pta-pr"
      OBS_ENDPOINT:
        required: false
        type: string
        default: "obs.cn-north-4.myhuaweicloud.com"
      DOCKER_IMAGE:
        required: false
        type: string
        default: "swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch_master_a2_aarch64_test:20261018"
      CONTAINER_OPTIONS:
        required: false
        type: string
      NPU_LABEL:
        required: false
        type: string
        default: "npu=8"

jobs:
  coverage_test:
    name: coverage-test
    select: selected_by_default
    runs-on: [ self-hosted, nightly, "${{ inputs.NPU_LABEL }}" ]
    container:
      image: ${{ inputs.DOCKER_IMAGE }}
      options: ${{ inputs.CONTAINER_OPTIONS }}
    env:
      PYTHON_BIN: "python3"
    defaults:
      run:
        shell: bash
    steps:
      - name: checkout
        uses: checkout

      - name: Download cases-shards
        uses: download-artifact
        with:
          name: cases-shards
          path: cases-shards

      - name: Check shard exists
        id: check_shard
        run: |
          if [ ! -f "cases-shards/${{ inputs.SHARD_FILE }}" ]; then
            echo "Shard ${{ inputs.SHARD_FILE }} does not exist, skipping"
            echo "has_shard=false" >> $ATOMGIT_OUTPUT
            exit 0
          fi
          echo "Shard ${{ inputs.SHARD_FILE }} exists, will execute tests"
          echo "has_shard=true" >> $ATOMGIT_OUTPUT

      - name: Download torch-npu-wheel
        if: ${{ steps.check_shard.outputs.has_shard == 'true' }}
        uses: download-artifact
        with:
          name: torch-npu-wheel
          path: ./

      - name: Install PyTorch
        if: ${{ steps.check_shard.outputs.has_shard == 'true' }}
        run: |
          PY_VER=$(${PYTHON_BIN} -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          PY_TAG="cp${PY_VER//./}"
          ${PYTHON_BIN} .gitcode/scripts/install_pytorch_from_requirements.py \
            --arch aarch64 \
            --python-tag "${PY_TAG}" \
            --python-exe ${PYTHON_BIN}

      - name: Install pytest-timeout and coverage
        if: ${{ steps.check_shard.outputs.has_shard == 'true' }}
        run: ${PYTHON_BIN} -m pip install --trusted-host mirrors.huaweicloud.com pytest-timeout coverage

      - name: Setup NPU test environment
        if: ${{ steps.check_shard.outputs.has_shard == 'true' }}
        run: |
          bash .gitcode/scripts/setup_npu_test_env.sh --wheel-artifact-dir ./

      - name: Prepare coverage environment
        if: ${{ steps.check_shard.outputs.has_shard == 'true' }}
        run: |
          WORKDIR="${ATOMGIT_WORKSPACE:-$PWD}"
          mkdir -p cov/raw cov/shard
          cat > cov/.coveragerc <<EOF
          [run]
          branch = True
          parallel = True
          source = ${{ inputs.COVERAGE_SOURCE }}
          EOF
          # Child processes spawned by the code under test start coverage automatically at startup
          cat > cov/sitecustomize.py <<'EOF'
          import os

          if os.environ.get("COVERAGE_PROCESS_START"):
              import coverage
              coverage.process_startup()
          EOF
          cat > cov/env.sh <<EOF
          export COVERAGE_PLUGIN_RCFILE="${WORKDIR}/cov/.coveragerc"
          export COVERAGE_CASE_DIR="${WORKDIR}/cov/raw"
          export PYTEST_PLUGINS="coverage_pytest_plugin"
          export PYTHONPATH="${WORKDIR}/.gitcode/scripts:${WORKDIR}/cov${PYTHONPATH:+:${PYTHONPATH}}"
          EOF
          echo "=== .coveragerc ==="
          cat cov/.coveragerc
          echo "=== sitecustomize.py ==="
          cat cov/sitecustomize.py
          echo "=== env.sh ==="
          cat cov/env.sh

      - name: Execute tests with coverage
        if: ${{ steps.check_shard.outputs.has_shard == 'true' }}
        run: |
          source cov/env.sh
          source /usr/local/Ascend/cann/set_env.sh 2>/dev/null || true
          source /usr/local/Ascend/nnal/atb/set_env.sh 2>/dev/null || true

          EXTRA_ARGS=""
          if [ -n "${{ inputs.MAX_WORKERS }}" ]; then
            EXTRA_ARGS="${EXTRA_ARGS} --max-workers ${{ inputs.MAX_WORKERS }}"
          fi
          if [ -n "${{ inputs.CARDS_PER_TEST }}" ]; then
            EXTRA_ARGS="${EXTRA_ARGS} --cards-per-test ${{ inputs.CARDS_PER_TEST }}"
          fi

          set +e
          ${PYTHON_BIN} .gitcode/scripts/nightly_run_npu_test_shard.py \
            --cases-json "cases-shards/${{ inputs.SHARD_FILE }}" \
            --test-dir test \
            --disabled-testcases .gitcode/config/disabled_testcases.json \
            --disabled-methods .gitcode/config/disabled_test_methods.json \
            --report-dir "${{ inputs.REPORT_NAME }}" \
            --timeout "${{ inputs.CASE_TIMEOUT }}" \
            ${EXTRA_ARGS} \
            --verbose 2>&1 | tee cov/run.log
          STATUS=${PIPESTATUS[0]}
          set -e
          echo "test_status=${STATUS}" >> $ATOMGIT_OUTPUT
          echo "Test exit code: ${STATUS} (test failures do not block coverage output)"
          exit 0

      - name: Group coverage data by test file
        if: ${{ always() && steps.check_shard.outputs.has_shard == 'true' }}
        run: |
          ${PYTHON_BIN} .gitcode/scripts/coverage_report.py group \
            --report-dir "${{ inputs.REPORT_NAME }}" \
            --raw-dir cov/raw \
            --shard-dir cov/shard

      - name: Package coverage shard for OBS
        id: pack_shard
        # Upload an empty shard when the shard file does not exist (no cases in this category), so the shard count on the merge side stays stable
        if: ${{ always() && (steps.check_shard.outputs.has_shard == 'true' || steps.check_shard.outputs.has_shard == 'false') }}
        run: |
          mkdir -p cov/shard
          if [ -z "$(find cov/shard -type d -name covdata -print -quit)" ]; then
            if [ "${{ steps.check_shard.outputs.has_shard }}" = "true" ]; then
              echo "No shard coverage data, skipping packaging"
              exit 0
            fi
            echo "Shard file does not exist, uploading empty shard"
          fi
          # Include the shard case report so the merge stage can identify test files missing coverage data
          mkdir -p cov/shard/reports
          cp "${{ inputs.REPORT_NAME }}"/shard_*_cases.json cov/shard/reports/ 2>/dev/null || true
          tar -czf "${{ inputs.COVERAGE_SHARD }}.tar.gz" -C cov shard
          ls -lh "${{ inputs.COVERAGE_SHARD }}.tar.gz"
          echo "packed=1" >> $ATOMGIT_OUTPUT

      - name: oidc-auth
        if: ${{ steps.pack_shard.outputs.packed == '1' }}
        uses: huaweicloud-oidc-auth
        with:
          audience: pta_pr_obs_for_pytorch
          region: cn-north-4
          agency_urn: iam::0d336831568090260fd5c01450729240:agency:pta_obs_pr_trust
          provider_urn: iam::0d336831568090260fd5c01450729240:oidcProvider:pta_obs_pr

      - name: Upload coverage shard to OBS 7day-cache
        if: ${{ steps.pack_shard.outputs.packed == '1' }}
        uses: obs-upload
        with:
          endpoint: "${{ inputs.OBS_ENDPOINT }}"
          bucket: "${{ inputs.OBS_BUCKET }}"
          artifact-path: |
            ${{ inputs.COVERAGE_SHARD }}.tar.gz
          object-prefix: "${{ inputs.OBS_SHARD_PREFIX }}${{ atomgit.workflow_run_id }}/"
