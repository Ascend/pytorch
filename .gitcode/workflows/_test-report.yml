name: Test Report

on:
  workflow_call:
    inputs:
      core_matrix:
        required: false
        type: string
        default: '[]'
        description: Core shard matrix JSON
      tensor_matrix:
        required: false
        type: string
        default: '[]'
        description: Tensor shard matrix JSON
      distributed_matrix:
        required: false
        type: string
        default: '[]'
        description: Distributed shard matrix JSON
      graph_matrix:
        required: false
        type: string
        default: '[]'
        description: Graph shard matrix JSON
      others_matrix:
        required: false
        type: string
        default: '[]'
        description: Others shard matrix JSON
      docker_image:
        required: false
        type: string
        default: 'swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch_master_a2_aarch64_builder:20260704'
        description: Docker image used for test execution
jobs:
  report:
    runs-on: [self-hosted, npu=8]
    steps:
      - name: Checkout report scripts from trigger commit
        uses: checkout
        with:
          repository: https://gitcode.com/${{ atomgit.repository }}.git
          ref: ${{ atomgit.sha }}
          path: ci-scripts
          fetch-depth: 1

      # 从制品读取 build 阶段的 SHA（缺失时回退 unknown，不阻塞报告）
      - name: Download PyTorch build info
        uses: download-artifact
        with:
          name: pytorch-test
          path: build-info-pytorch
        continue-on-error: true

      - name: Download torch_npu build info
        uses: download-artifact
        with:
          name: packages-pytorch
          path: build-info-torchnpu
        continue-on-error: true

      - name: Resolve build SHAs from artifacts
        id: shas
        run: |
          # 从制品 info json 解析 SHA；json 缺失/损坏时回退 'unknown'，不阻塞报告生成
          PYTORCH_SHORT=$(python3 -c "
          import json
          try:
              d = json.load(open('build-info-pytorch/build_info.json'))
              print(d.get('pytorch_short', 'unknown'))
          except Exception:
              print('unknown')
          " 2>/dev/null || echo unknown)

          TORCH_NPU_SHORT=$(python3 -c "
          import json
          try:
              d = json.load(open('build-info-torchnpu/torch_npu_info.json'))
              print(d.get('torch_npu_short', 'unknown'))
          except Exception:
              print('unknown')
          " 2>/dev/null || echo unknown)

          echo "pytorch_short=${PYTORCH_SHORT}" >> "$ATOMGIT_OUTPUT"
          echo "torch_npu_short=${TORCH_NPU_SHORT}" >> "$ATOMGIT_OUTPUT"
          echo "Resolved pytorch_short=${PYTORCH_SHORT}, torch_npu_short=${TORCH_NPU_SHORT}"

      - name: Download all test reports
        uses: download-artifact
        with:
          path: all-test-reports
        continue-on-error: true

      - name: Download cases collection summary
        uses: download-artifact
        with:
          name: cases-shards
          path: cases-shards
        continue-on-error: true

      - name: Generate consolidated summary
        id: generate_report
        run: |
          REPORT_MD=npu-full-test-summary.md
          REPORT_JSON=npu-full-test-summary.json

          # Build combined matrix with category prefixes
          COMBINED_MATRIX=$(python3 -c "
          import json
          mats = {
              'core': '${{ inputs.core_matrix }}',
              'tensor': '${{ inputs.tensor_matrix }}',
              'distributed': '${{ inputs.distributed_matrix }}',
              'graph': '${{ inputs.graph_matrix }}',
              'others': '${{ inputs.others_matrix }}',
          }
          pfx = {
              'core': 'core', 'tensor': 'tensor',
              'distributed': 'dist', 'graph': 'graph', 'others': 'others',
          }
          combined = []
          for cat, ms in mats.items():
              for n in json.loads(ms):
                  combined.append(f'{pfx[cat]}-{n}')
          print(json.dumps(combined))
          ")

          echo "Combined matrix: ${COMBINED_MATRIX}"

          # Copy skipped cases record from collection artifact
          cp cases-shards/skipped_cases.json skipped_cases.json 2>/dev/null || \
            echo "No skipped_cases.json found in cases-shards"

          python3 ci-scripts/.gitcode/scripts/generate_npu_full_test_report.py \
            --reports-root all-test-reports \
            --output-markdown ${REPORT_MD} \
            --output-json ${REPORT_JSON} \
            --pytorch-version "${{ steps.shas.outputs.pytorch_short }}" \
            --torch-npu-short "${{ steps.shas.outputs.torch_npu_short }}" \
            --shard-matrix-json "${COMBINED_MATRIX}" \
            --docker-image "${{ inputs.docker_image }}" \
            --cases-summary cases-shards/cases_collection_summary.json \
            --cases-by-file-dir cases-shards

          cat ${REPORT_MD} >> $ATOMGIT_STEP_SUMMARY

      - name: Upload consolidated summary
        if: ${{ always() }}
        uses: upload-artifact
        with:
          name: npu-full-test-summary
          path: |
            npu-full-test-summary.md
            npu-full-test-summary.json
            core_cases_results_by_file.jsonl
            tensor_cases_results_by_file.jsonl
            distributed_cases_results_by_file.jsonl
            graph_cases_results_by_file.jsonl
            others_cases_results_by_file.jsonl
            skipped_cases.json
          retention-days: 7
