# PR test whitelist — category-driven configuration.
# Each category maps to a set of test files, execution mode, and worker count.
#
# 文件清单来源: pytorch-npu-testcase-dashboard
# (https://blog.huangjingwei.site/pytorch-npu-testcase-dashboard/, window.CASES 数据)
# 全量收录 dashboard 的 126 个测试文件(均存在于上游 pytorch main),
# 对应约 17.9 万条用例。白名单文件路径相对上游 pytorch 仓库,
# 收集阶段 --test-dir 指向 $workspace/pytorch/test(上游源码包),非 torch_npu 仓库。
#
# dashboard 类目 → 白名单类目映射:
#   Core → core, Tensor → tensor, Distributed → distributed,
#   Graph → graph, Other + Quantization → others

categories:
  core:
    workers: 32
    execution: concurrent
    runner: linux-aarch64-a3-8
    files:
    - test/autograd/test_functional.py
    - test/autograd/test_logging.py
    - test/nn/attention/test_open_registry.py
    - test/nn/test_convolution.py
